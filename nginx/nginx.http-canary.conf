# UniRouter HTTP Canary Configuration
# Purpose: local/staging canary routing without TLS certificates.
# Use nginx/nginx.conf for TLS-enabled production deployments.

upstream backend_stable {
    server uniroute-api:8080;
}

upstream backend_canary {
    server uniroute-api:8080        weight=9;
    server uniroute-api-canary:8080 weight=1;
}

upstream frontend {
    server uniroute-frontend:80;
}

server {
    listen 80;
    server_name _;

    location /v1/ {
        proxy_pass http://backend_canary;
        proxy_buffering off;
        proxy_cache off;
        # Transport ceiling only; the Gateway owns each typed per-request deadline.
        proxy_read_timeout 1920s;
        proxy_send_timeout 960s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Preserve caller correlation only. UniRouter creates the authoritative
        # server operation identity for every request.
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-UniRouter-Edge-Request-ID $request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://backend_canary;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header X-UniRouter-Edge-Request-ID $request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /health/ {
        proxy_pass http://backend_stable;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://backend_stable;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 50m;
}
