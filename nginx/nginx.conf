# UniRouter Production / Canary Nginx Configuration
# 用途：TLS 终止 + 反向代理 + canary 权重路由
# 使用方式：docker compose -f docker-compose.yml -f docker-compose.canary.yml up -d

upstream backend_stable {
    server uniroute-api:8080;
}

upstream backend_canary {
    # canary 权重：stable:canary = 9:1（可调整 weight 值）
    server uniroute-api:8080        weight=9;
    server uniroute-api-canary:8080 weight=1;
}

upstream frontend {
    server uniroute-frontend:80;
}

# --- HTTP → HTTPS 重定向 ---
server {
    listen 80;
    server_name _;
    # canary 测试阶段可注释掉 return，直接 serve HTTP
    return 301 https://$host$request_uri;
}

# --- HTTPS 主站 ---
server {
    listen 443 ssl http2;
    server_name _;

    # --- TLS 配置 ---
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- 安全 Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Gateway API：走 canary 权重分发 ---
    location /v1/ {
        proxy_pass http://backend_canary;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # --- Admin API：走 canary 权重分发 ---
    location /api/ {
        proxy_pass http://backend_canary;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # --- 健康检查：直连 stable ---
    location /health/ {
        proxy_pass http://backend_stable;
        proxy_set_header Host $host;
    }

    # --- Prometheus 指标：直连 stable ---
    location /metrics {
        proxy_pass http://backend_stable;
        proxy_set_header Host $host;
    }

    # --- 前端静态资源 ---
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 50m;
}
