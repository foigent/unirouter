        context_length: { $ref: "#/components/schemas/ExactTokenCount" }
        output_limit: { type: integer, minimum: 0 }
        capability_tags: { type: string }
        data_residency: { type: string }
        pricing_model_name: { type: string }
        approved_catalog: { type: boolean }
        migration_recommendation: { type: string }
        execution_profile_id: { type: string, description: "Immutable catalog profile identity. Omit both profile fields to exact-match a reviewed model alias, otherwise the unverified profile is used." }
        execution_profile_version: { type: string, description: "Required together with execution_profile_id." }
      additionalProperties: true
    ModelRegistryCreateRequest:
      allOf:
        - $ref: "#/components/schemas/ModelRegistryMutation"
        - type: object
