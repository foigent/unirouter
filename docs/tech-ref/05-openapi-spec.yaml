        source_binding_sha256: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        desired_state: { type: string, enum: [active, paused, disconnected] }
        observed_state: { type: string, enum: [provisioning, connected, paused, abnormal, disconnected] }
        state_revision: { type: integer, format: int64, minimum: 1 }
        control_fence: { type: integer, format: int64, minimum: 1 }
        bootstrap_receipt_sha256: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        last_successful_sync_at: { type: string, format: date-time }
        last_error_code: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        last_error_at: { type: string, format: date-time }
        consented_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    XInsightConnectorOperationSummary:
      type: object
      additionalProperties: false
      required: [schema_version, operation_ref, installation_id, action, desired_state, state, requested_revision, control_fence, attempt_count, created_at, updated_at]
      properties:
        schema_version: { type: string, enum: [unirouter.xinsight.connector-operation.v1] }
        operation_ref: { type: string, pattern: '^xcop_[a-f0-9]{32}$' }
        installation_id: { type: string, pattern: '^xci_[A-Za-z0-9_-]{22}$' }
        action: { type: string, enum: [connect, pause, resume, rotate, replay] }
        desired_state: { type: string, enum: [active, paused] }
        state: { type: string, enum: [queued, claimed, retry_wait, succeeded, failed, cancelled] }
        requested_revision: { type: integer, format: int64, minimum: 1 }
        control_fence: { type: integer, format: int64, minimum: 1 }
        attempt_count: { type: integer, minimum: 0 }
        result_code: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        result_sha256: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        error_code: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
        completed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    XInsightStagedFeedCredential:
