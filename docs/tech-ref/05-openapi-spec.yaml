                  reported_model: { type: string, maxLength: 200, description: Sanitized top-level provider model identity when present. }
                  evidence_ref: { type: string, description: "Server-generated append-only probe reference, present only for usable successful evidence." }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
