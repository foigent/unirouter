                  current: { type: boolean, description: True only when every snapshotted identity and revision still matches after the network request. }
                  stale: { type: boolean, description: Exact inverse of current. }
                  operation_advanced: { type: boolean, description: True only when this transaction advanced a lower operation evidence state to live_probed. }
                  reason_code: { type: string, description: Stable sanitized final classification; never a raw provider error. }
                  provider_reason_code: { type: string, description: Stable sanitized provider classification retained even when the final result is stale. }
                  status_code: { type: integer, minimum: 0, maximum: 599 }
