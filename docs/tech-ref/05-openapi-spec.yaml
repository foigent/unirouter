openapi: 3.0.3
info:
  title: UniRoute API
  version: 1.0.0
  description: |
    Current UniRouter API contract snapshot for active backend routes.

    Route source: `cmd/uniroute/main.go`.
    Route parity guard: `cmd/uniroute/route_parity_test.go`.

    Authentication:
    - Gateway: `Authorization: Bearer ur-XXXX-...`
    - Admin: `Authorization: Bearer <JWT>`

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Gateway
  - name: Auth
  - name: Admin
  - name: Health
  - name: Observability

paths:
  /:
    get:
      tags: [Health]
      summary: Service metadata
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /docs:
    get:
      tags: [Admin]
      summary: Backend API documentation index
      responses:
        "200":
          description: HTML API contract index
          content:
            text/html:
              schema:
                type: string

  /health/live:
    get:
      tags: [Health]
      summary: Liveness check
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "503":
          $ref: "#/components/responses/JSON"

  /metrics:
    get:
      tags: [Observability]
      summary: Prometheus metrics (runtime-configurable)
      responses:
        "200":
          description: Prometheus metrics text format
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Metrics are disabled or hidden by metrics access policy

  /v1/chat/completions:
    post:
      tags: [Gateway]
      summary: OpenAI-compatible chat completions
      security:
        - gatewayKey: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion or SSE stream
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"

  /v1/embeddings:
    post:
      tags: [Gateway]
      summary: OpenAI-compatible embeddings
      security:
        - gatewayKey: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model:
                  type: string
                input:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                encoding_format:
                  type: string
                  enum: [float, base64]
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"

  /v1/models:
    get:
      tags: [Gateway]
      summary: OpenAI-compatible model list
      security:
        - gatewayKey: []
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/oidc/config:
    get:
      tags: [Auth]
      summary: OIDC public login configuration
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/auth/oidc/start:
    get:
      tags: [Auth]
      summary: Start OIDC login flow
      responses:
        "302":
          description: Redirects to the configured OIDC identity provider
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/auth/oidc/callback:
    get:
      tags: [Auth]
      summary: OIDC callback
      responses:
        "302":
          description: Redirects to the frontend after successful browser login
        "200":
          $ref: "#/components/responses/JSON"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/me:
    get:
      tags: [Admin]
      summary: Current admin user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/me/password:
    put:
      tags: [Admin]
      summary: Change current admin user password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
                  minLength: 6
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/channels:
    get: { $ref: "#/components/pathItems/ListChannels" }
    post: { $ref: "#/components/pathItems/CreateChannel" }

  /api/v1/channels/{id}:
    get: { $ref: "#/components/pathItems/GetById" }
    put: { $ref: "#/components/pathItems/UpdateById" }
    delete: { $ref: "#/components/pathItems/DeleteById" }

  /api/v1/channels/{id}/test:
    post:
      tags: [Admin]
      summary: Test channel connectivity
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/keys:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/keys/{id}:
    get: { $ref: "#/components/pathItems/GetById" }
    put: { $ref: "#/components/pathItems/UpdateById" }

  /api/v1/keys/{id}/disable:
    post:
      tags: [Admin]
      summary: Disable API key
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/projects:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/projects/{id}:
    get: { $ref: "#/components/pathItems/GetById" }
    put: { $ref: "#/components/pathItems/UpdateById" }

  /api/v1/projects/{id}/model-sets:
    get: { $ref: "#/components/pathItems/ListById" }
    put: { $ref: "#/components/pathItems/UpdateById" }

  /api/v1/channel-keys:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/channel-keys/{id}:
    put: { $ref: "#/components/pathItems/UpdateById" }
    delete: { $ref: "#/components/pathItems/DeleteById" }

  /api/v1/wallet:
    get: { $ref: "#/components/pathItems/Get" }

  /api/v1/wallet/topup:
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/wallet/adjust:
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/wallet/transactions:
    get: { $ref: "#/components/pathItems/List" }

  /api/v1/wallet/transactions/export:
    get:
      tags: [Admin]
      summary: Export wallet transactions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Export file or JSON payload

  /api/v1/logs:
    get: { $ref: "#/components/pathItems/List" }

  /api/v1/logs/{id}:
    get: { $ref: "#/components/pathItems/GetById" }

  /api/v1/dashboard/stats:
    get: { $ref: "#/components/pathItems/Get" }

  /api/v1/usage/analytics:
    get:
      tags: [Admin]
      summary: Usage analytics aggregation and CSV export
      security:
        - bearerAuth: []
      parameters:
        - name: group_by
          in: query
          schema:
            type: string
            enum: [overall, project, key, model, alias, provider, channel, status, usage_source]
        - name: format
          in: query
          schema:
            type: string
            enum: [csv]
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/internal-status:
    get:
      tags: [Admin]
      summary: Event-derived internal status
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/error-docs:
    get:
      tags: [Admin]
      summary: Error documentation registry
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/model-prices:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/model-prices/{id}:
    put: { $ref: "#/components/pathItems/UpdateById" }
    delete: { $ref: "#/components/pathItems/DeleteById" }

  /api/v1/model-names:
    get: { $ref: "#/components/pathItems/Get" }

  /api/v1/model-registry:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/model-registry/{id}:
    put: { $ref: "#/components/pathItems/UpdateById" }

  /api/v1/model-catalog:
    get: { $ref: "#/components/pathItems/List" }

  /api/v1/model-aliases:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/model-aliases/{id}:
    put: { $ref: "#/components/pathItems/UpdateById" }

  /api/v1/model-sets:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/model-sets/{id}/items:
    get: { $ref: "#/components/pathItems/ListById" }
    put: { $ref: "#/components/pathItems/UpdateById" }

  /api/v1/org-model-prices:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/org-model-prices/{id}:
    put: { $ref: "#/components/pathItems/UpdateById" }
    delete: { $ref: "#/components/pathItems/DeleteById" }

  /api/v1/reconciliation:
    get: { $ref: "#/components/pathItems/List" }

  /api/v1/users:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/users/{id}:
    put: { $ref: "#/components/pathItems/UpdateById" }
    delete: { $ref: "#/components/pathItems/DeleteById" }

  /api/v1/grants:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/notification-events:
    get: { $ref: "#/components/pathItems/List" }

  /api/v1/notification-deliveries:
    get: { $ref: "#/components/pathItems/List" }

  /api/v1/notification-webhooks:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/notification-webhooks/{id}:
    put: { $ref: "#/components/pathItems/UpdateById" }

  /api/v1/audit-logs:
    get: { $ref: "#/components/pathItems/List" }

  /api/v1/settings:
    get: { $ref: "#/components/pathItems/List" }

  /api/v1/settings/{key}:
    put:
      tags: [Admin]
      summary: Update setting
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  nullable: true
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/license:
    get: { $ref: "#/components/pathItems/Get" }
    put:
      tags: [Admin]
      summary: Import offline license
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/sensitive-words:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }
    put:
      tags: [Admin]
      summary: Replace sensitive words
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    delete:
      tags: [Admin]
      summary: Delete sensitive words
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JSON"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    gatewayKey:
      type: http
      scheme: bearer

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string

  responses:
    JSON:
      description: JSON response
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  pathItems:
    Get:
      tags: [Admin]
      summary: Get resource
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    List:
      tags: [Admin]
      summary: List resources
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    ListById:
      tags: [Admin]
      summary: List nested resources by parent ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    ListChannels:
      tags: [Admin]
      summary: List channels
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    Create:
      tags: [Admin]
      summary: Create resource
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "201":
          $ref: "#/components/responses/JSON"
    CreateChannel:
      tags: [Admin]
      summary: Create channel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          $ref: "#/components/responses/JSON"
    GetById:
      tags: [Admin]
      summary: Get resource by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    UpdateById:
      tags: [Admin]
      summary: Update resource by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    DeleteById:
      tags: [Admin]
      summary: Delete resource by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "204":
          description: Deleted

  schemas:
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
        stream:
          type: boolean
          default: false
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
