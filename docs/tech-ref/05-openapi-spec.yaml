        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [connection, public_model, deployment, credential, operation]
              properties:
                connection:
                  type: object
                  additionalProperties: false
                  anyOf:
                    - required: [id]
                    - required: [name, provider, base_url, adapter_type]
                  properties:
                    id: { type: integer, format: int64, minimum: 1 }
                    name: { type: string, maxLength: 255 }
                    provider: { type: string, maxLength: 50 }
                    base_url: { type: string, format: uri, maxLength: 512, description: "Responses and Messages require an exact path-free HTTPS origin; Chat Completions and Embeddings retain their adapter-owned base-path contract." }
                    adapter_type: { type: string, maxLength: 50 }
                    adapter_config: { type: object, description: "Canonical JSON object limited to 65536 bytes; duplicate members, arrays and scalar roots are rejected. The complete request body is limited to 131072 bytes." }
                public_model:
                  type: object
                  additionalProperties: false
                  anyOf:
                    - required: [id]
                    - required: [model_name]
                  properties:
                    id: { type: integer, format: int64, minimum: 1 }
                    model_name: { type: string, maxLength: 100 }
                    display_name: { type: string, maxLength: 255 }
                    provider_family: { type: string, maxLength: 50 }
                    lifecycle: { type: string, enum: [staging, ga, deprecated] }
                    context_length: { type: integer, minimum: 0, description: "Public context execution limit. The ordinary create UI requires a positive value. API zero is accepted only as non-authorable staging state; release selection remains unavailable until this and output_limit are positive." }
                    output_limit: { type: integer, minimum: 0, description: "Public output execution limit. The ordinary create UI requires a positive value. API zero is accepted only as non-authorable staging state; release selection remains unavailable until this and context_length are positive." }
                    approved_catalog: { type: boolean }
                    execution_profile_id: { type: string, description: "Exact immutable model execution Profile identity. Required together with execution_profile_version. Omission on a new public model pins unverified.chat instead of alias inference." }
                    execution_profile_version: { type: string, description: "Exact immutable model execution Profile version. Required together with execution_profile_id." }
                deployment:
                  type: object
                  additionalProperties: false
                  required: [upstream_model]
                  properties:
                    upstream_model: { type: string, maxLength: 200 }
                    priority: { type: integer, minimum: 1, maximum: 10000, default: 100 }
                    routing_weight: { type: integer, minimum: 1, maximum: 1000, default: 100 }
                    max_context: { type: integer, minimum: 0, default: 0, description: "Deployment context execution limit. The ordinary create UI requires a positive value; API zero records non-authorable staging state." }
                    default_max_output: { type: integer, minimum: 0, default: 0, description: "Deployment default output execution limit. The ordinary create UI requires a positive value; API zero records non-authorable staging state." }
                    degradation_threshold: { type: integer, minimum: 1, maximum: 100, default: 10 }
                credential:
                  type: object
                  additionalProperties: false
                  oneOf:
                    - required: [binding_id]
                    - required: [api_key]
                  properties:
                    binding_id: { type: integer, format: int64, minimum: 1 }
                    api_key: { type: string, minLength: 1, writeOnly: true }
                operation:
                  type: object
                  additionalProperties: false
                  required: [operation_id]
                  properties:
                    operation_id: { type: string }
      responses:
        "200":
          description: Exact idempotent replay of the committed mutation
          headers:
            X-UniRouter-Idempotency-Replayed:
              description: Always true for this replay response.
              schema: { type: string, enum: ["true"] }
            X-UniRouter-Original-Request-ID:
              description: Server operation ID that committed the original mutation.
              schema: { type: string }
          content:
            application/json:
              schema: { type: object }
        "201": { $ref: "#/components/responses/JSON" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

