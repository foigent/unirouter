        "200": { $ref: "#/components/responses/JSON" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [Admin]
      summary: Transactionally create or exactly reuse one model deployment and operation
      description: "Requires an active Gateway License and Idempotency-Key. Existing IDs are explicit selectors and extra fields are exact assertions; no name-based connection lookup or fallback-to-first deployment occurs. A new public model may pin one exact repository-reviewed execution_profile_id/version; both fields are required together, their context/output limits are server-validated, and omission explicitly records unverified.chat rather than guessing from the model name. For the exact compiled M88 DeepSeek V4 Flash Chat streaming tuple, creation also materializes only an enabled/declared capability projection after the compiled binding and database support contract agree exactly. This performs no provider call and creates no live probe, routing approval, route, Release, price, or caller authorization; no capability is inferred for any other tuple. Responses and Messages require the effective connection base_url to be a path-free HTTPS origin before any receipt or canonical row is written; invalid new input returns 400 and an incompatible selected connection returns 409 with code canonical_application_https_origin_required. The first committed mutation returns 201. An exact actor-scoped replay within 24 hours returns the current projection with the original reused-result, status 200, X-UniRouter-Idempotency-Replayed true, and X-UniRouter-Original-Request-ID. The receipt stores no raw key, request body, provider API key, or response body; using the same key with another normalized payload returns 409."
