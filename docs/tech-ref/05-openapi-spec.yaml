  /api/v1/access-requests:
    get:
      tags: [Admin]
      summary: List actor-owned or project access requests with a bounded keyset page
      description: |
        `scope=my` returns only requests submitted by, targeting, or sponsored by the authenticated actor and does not require an existing project membership. This keeps a first-project applicant's pending request reachable without exposing the project inventory. `scope=project` (the default) requires `project_id` and live project-read authority; platform/org/project administrators see the authorized project inventory. Project users and viewers never gain project-wide access-request visibility.

        Results are ordered by stable `id DESC`. `after_id` is exclusive and must be copied from `pagination.next_after_id`. The server returns at most `limit` rows and never performs an unbounded list or a total-count query.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [my, project], default: project }
        - $ref: "#/components/parameters/OrgId"
        - name: project_id
          in: query
          description: Required for project scope and forbidden for my scope.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: status
          in: query
          description: Optional project-scope server filter applied before the keyset limit. Forbidden for scope=my.
          schema: { type: string, enum: [approved, needs_review, rejected, cancelled] }
        - name: workload_application_id
          in: query
          description: Optional exact Workload subject filter for an authorized project queue. Forbidden for scope=my.
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: "#/components/parameters/AccessPageLimit"
        - $ref: "#/components/parameters/AccessAfterId"
      responses:
        "200":
          description: Bounded access-request page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequestPage" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [Admin]
      summary: Submit one project-bound access request through deterministic policy
      description: |
        Public callers may submit only `self`, `delegated`, or `direct_grant`. Migration, bootstrap, and recovery are trusted internal adapter modes and are rejected on this public route. A first-cross-project self request creates review evidence only; membership, Grant, and credential are created only after an authorized approval. `X-UniRouter-Client-Request-ID` is required and scoped to the submitting actor; semantic retries are idempotent and conflicting intent returns 409.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequiredClientRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessProvisionInput" }
      responses:
        "200":
          description: Idempotent replay
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessProvisionResult" } } }
        "201":
          description: New request and optional auto/direct Grant
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessProvisionResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac:
      get: [platform_admin, org_admin, project_admin, project_user]
      post: [platform_admin, org_admin, project_admin, project_user, member]

  /api/v1/access-requests/{ref}:
    get:
      tags: [Admin]
      summary: Read one actor-scoped access request and its approved Grant snapshot
      description: Inaccessible and absent request references are byte-equivalent 404 responses. Project users see only their own subject, sponsored workload, or submitted requests; project-wide inventory is reserved for platform, organization, and live project administrators.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccessRequestRef"
      responses:
        "200":
          description: Access request detail
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequestDetail" } } }
