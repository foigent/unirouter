            org_id: { type: integer, format: int64, minimum: 1 }
    PublicModelExecutionProjection:
      type: object
      additionalProperties: false
      required: [status, display_name]
      properties:
        status:
          type: string
          enum: [verified, unverified, invalid, unregistered]
