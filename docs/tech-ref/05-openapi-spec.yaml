        display_name: { type: string }
        profile_id: { type: string }
        profile_version: { type: string }
        protocol_profile: { type: string }
        context_window: { type: integer, minimum: 1 }
        max_output_tokens: { type: integer, minimum: 1 }
        capabilities:
          type: array
          uniqueItems: true
          items: { type: string }
        reasoning_mode: { type: string, enum: [toggle, required, always_on] }
        reasoning_effort_values:
          type: array
          uniqueItems: true
          items: { type: string }
    PublicModel:
      type: object
      additionalProperties: false
      required: [id, object, owned_by]
      properties:
        id: { type: string, minLength: 1 }
        object: { type: string, enum: [model] }
        owned_by: { type: string, enum: [uniroute] }
        x_unirouter_execution: { $ref: "#/components/schemas/PublicModelExecutionProjection" }
    PublicModelList:
      type: object
      additionalProperties: false
      required: [object, data]
      properties:
        object: { type: string, enum: [list] }
        data: { type: array, items: { $ref: "#/components/schemas/PublicModel" } }
    ModelExecutionProfile:
      type: object
      additionalProperties: false
      required: [id, version, label, tokenizer_profile_id, tokenizer_profile_version, reasoning_profile, cache_usage_profile, protocol_profile, provider_context_window, provider_max_output, default_context_window, default_output_limit, provider_capabilities, capabilities, always_required_capabilities, aliases, evidence_refs]
      properties:
        id: { type: string }
        version: { type: string }
        label: { type: string }
        tokenizer_profile_id: { type: string }
        tokenizer_profile_version: { type: string }
        reasoning_profile: { type: string }
        cache_usage_profile: { type: string }
        protocol_profile: { type: string }
        upstream_model_family:
          type: string
          minLength: 1
          description: Exact model family for a Profile address with typed upstream version identity; absent on historical unmodeled addresses.
        upstream_version_policy:
          type: string
          enum: [pinned, floating]
          description: Append-only per-Profile-address version policy; never inferred from a mutable current alias.
        provider_context_window: { type: integer, minimum: 0 }
        provider_max_output: { type: integer, minimum: 0 }
        default_context_window: { type: integer, minimum: 0 }
        default_output_limit: { type: integer, minimum: 0 }
        provider_capabilities:
          type: array
          uniqueItems: true
          description: Provider-documented capabilities; not execution authority by themselves.
          items: { type: string }
        capabilities:
          type: array
          uniqueItems: true
          description: Capabilities verified through UniRouter's current end-to-end execution path.
          items: { type: string }
        always_required_capabilities:
          type: array
          uniqueItems: true
          description: Narrow supported subset that every invocation of this exact Profile must prove during route selection. Optional or provider-default-derived invocation requirements belong to the one normalized Plan snapshot, not this list.
          items: { type: string }
        aliases: { type: array, uniqueItems: true, items: { type: string } }
        evidence_refs: { type: array, uniqueItems: true, items: { type: string, format: uri } }
    ModelExecutionProfileCatalog:
      type: object
      additionalProperties: false
      required: [contract_version, data]
      properties:
        contract_version: { type: string, enum: [unirouter.model-execution-profiles.v1] }
        data: { type: array, items: { $ref: "#/components/schemas/ModelExecutionProfile" } }
    ModelPriceMutation:
      type: object
      properties:
        model_name: { type: string, minLength: 1, description: "Required when creating a model price. Immutable after creation; PUT may omit it or repeat the exact stored value, but cannot rename the record." }
        input_price_cny_per_million_tokens: { $ref: "#/components/schemas/PublicPriceDecimalInput" }
        output_price_cny_per_million_tokens: { $ref: "#/components/schemas/PublicPriceDecimalInput" }
        cache_read_ratio: { $ref: "#/components/schemas/CachePriceRatioInput" }
        cache_creation_ratio: { $ref: "#/components/schemas/CachePriceRatioInput" }
      additionalProperties: false
    ModelPriceListResponse:
      type: object
      required: [data, total, page, page_size, can_mutate]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ModelPrice" } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        can_mutate: { type: boolean }
    OrgModelPrice:
      type: object
      required: [id, org_id, model_name, multiplier]
      properties:
        id: { type: integer, format: int64 }
        org_id: { type: integer, format: int64 }
        org_name: { type: string }
        model_name: { type: string }
        multiplier: { type: string, pattern: '^(?:0\.00[1-9]|0\.0[1-9][0-9]?|0\.[1-9][0-9]{0,2}|[1-9][0-9]?(?:\.[0-9]{1,3})?)$' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: true
    OrgModelPriceMutation:
      type: object
      required: [multiplier]
      properties:
        org_id: { type: integer, format: int64, minimum: 1 }
        model_name: { type: string, minLength: 1 }
        multiplier: { $ref: "#/components/schemas/OrgPriceMultiplierInput" }
      additionalProperties: false
    OrgModelPriceListResponse:
      type: object
      required: [data, total, page, page_size, org_id, can_mutate]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/OrgModelPrice" } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        org_id: { type: integer, format: int64 }
        can_mutate: { type: boolean }
    AgentCapabilityLimits:
      type: object
      additionalProperties: false
      required: [max_depth, max_children, max_descendants, cost_budget_cents, token_budget, rpm_limit, rps_limit, concurrency_limit, allowed_models, allowed_endpoints]
      properties:
        max_depth: { type: integer, minimum: 0, maximum: 16 }
        max_children: { type: integer, minimum: 0, maximum: 10000 }
        max_descendants: { type: integer, minimum: 0, maximum: 10000 }
        cost_budget_cents: { type: integer, format: int64, minimum: 1, maximum: 900719925474, description: "Compatibility configuration input in whole cents. It is converted exactly to micro-CNY before the v2 Redis counter is written; estimated cost is reserved on this Agent and every ancestor, then replaced with actual settled cost." }
        token_budget: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, description: Shared subtree token ceiling; estimated tokens are reserved on every ancestor and replaced with actual settled tokens. }
        rpm_limit: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, description: Exact rolling one-minute aggregate admission limit for this Agent subtree. }
        rps_limit: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, description: Exact rolling one-second aggregate admission limit for this Agent subtree. }
        concurrency_limit: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, description: "Shared in-flight request limit for this Agent subtree, enforced with an expiring Redis lease." }
        allowed_models:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items: { type: string, maxLength: 128 }
        allowed_endpoints:
          type: array
          minItems: 1
          uniqueItems: true
          description: Agent capability v1 is limited to synchronous model-gateway endpoints. Async media jobs require durable workflow/Agent attribution and lifecycle semantics and are therefore not attenuable by this capability contract.
          items:
            type: string
            enum: [/v1/chat/completions, /v1/embeddings, /v1/responses, /v1/messages, /v1/models]
    AgentCapabilityExchangeRequest:
      type: object
      additionalProperties: false
      required: [root_agent_id, workflow_ttl_seconds, limits]
      properties:
        root_agent_id: { type: string, minLength: 1, maxLength: 128 }
        workflow_ttl_seconds: { type: integer, format: int64, minimum: 300, maximum: 86400 }
        limits: { $ref: "#/components/schemas/AgentCapabilityLimits" }
    AgentCapabilityDelegateRequest:
      type: object
      additionalProperties: false
      required: [child_agent_id, limits]
      properties:
        child_agent_id: { type: string, minLength: 1, maxLength: 128 }
        limits: { $ref: "#/components/schemas/AgentCapabilityLimits" }
    AgentCapabilityTokenResponse:
      type: object
      required: [schema_version, capability_token, token_type, workflow_id, root_agent_id, agent_id, depth, expires_at, refresh_after, workflow_expires_at, limits]
      properties:
        schema_version: { type: string, enum: [unirouter.agent-capability.v2] }
        capability_token: { type: string, readOnly: true, description: Secret bearer capability beginning with urc_; never log or persist it. }
        token_type: { type: string, enum: [Bearer] }
        workflow_id: { type: string, pattern: '^capwf_[0-9a-f]{32}$' }
        root_agent_id: { type: string }
        agent_id: { type: string }
        parent_agent_id: { type: string }
        depth: { type: integer, minimum: 0, maximum: 16 }
        expires_at: { type: string, format: date-time }
        refresh_after: { type: string, format: date-time }
        workflow_expires_at: { type: string, format: date-time }
        limits: { $ref: "#/components/schemas/AgentCapabilityLimits" }
    SensitiveWordsMutation:
      type: object
      required: [words]
      properties:
        words:
          type: array
          items:
            type: string
    PublicResponsesRequest:
      type: object
      additionalProperties: false
      required: [model, input, max_output_tokens]
      properties:
        model: { type: string, minLength: 1 }
        input: { type: string, minLength: 1 }
        instructions: { type: string }
        max_output_tokens: { type: integer, format: int64, minimum: 16 }
        metadata:
          type: object
          maxProperties: 16
          propertyNames: { minLength: 1, maxLength: 64 }
          additionalProperties: { type: string, maxLength: 512 }
        temperature: { type: number, minimum: 0, maximum: 2 }
        top_p: { type: number, minimum: 0, maximum: 1 }
        reasoning:
          type: object
          description: Profile-bound control; executable with current GPT-5.6 Sol/Terra/Luna Responses 1.3.0. Omission preserves the provider default.
          additionalProperties: false
          required: [effort]
          properties:
            effort: { type: string, enum: [none, low, medium, high, xhigh, max] }
        store: { type: boolean, enum: [false], default: false }
        stream: { type: boolean, default: false, description: "true is executable only with an exact Sol/Terra/Luna Responses v2 streaming Profile; other Profiles fail closed." }
        text:
          type: object
          additionalProperties: false
          properties:
            format:
              type: object
              additionalProperties: false
              required: [type]
              properties:
                type: { type: string, enum: [text] }
            verbosity: { type: string, enum: [low, medium, high] }
    PublicResponsesResponse:
      type: object
      additionalProperties: false
      required: [id, object, status, model, error, incomplete_details, output_text, output, usage]
      properties:
        id: { type: string, minLength: 1 }
        object: { type: string, enum: [response] }
        status: { type: string, enum: [completed] }
        model: { type: string, minLength: 1, description: Caller-visible public model; private provider mapping is never delivered. }
        error: { nullable: true, enum: [null] }
        incomplete_details: { nullable: true, enum: [null] }
        output_text: { type: string }
        output:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [id, type, status, role, content]
            properties:
              id: { type: string, minLength: 1 }
              type: { type: string, enum: [message] }
              status: { type: string, enum: [completed] }
              role: { type: string, enum: [assistant] }
              content:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [type, text]
                  properties:
                    type: { type: string, enum: [output_text] }
                    text: { type: string }
        usage:
          type: object
          additionalProperties: false
          required: [input_tokens, output_tokens, total_tokens]
          properties:
            input_tokens: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
            output_tokens: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
            total_tokens: { type: integer, format: int64, minimum: 0, maximum: 2147483647, description: Exact input_tokens plus output_tokens. }
            input_tokens_details:
              type: object
              additionalProperties: false
              properties:
                cached_tokens: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
                cache_write_tokens: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
            output_tokens_details:
              type: object
              additionalProperties: false
              properties:
                reasoning_tokens: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
    PublicMessagesRequest:
      type: object
      additionalProperties: false
      required: [model, max_tokens, messages]
      properties:
        model: { type: string, minLength: 1 }
        max_tokens: { type: integer, format: int64, minimum: 1 }
        messages:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content: { type: string, minLength: 1 }
        system: { type: string, minLength: 1 }
        temperature: { type: number, minimum: 0, maximum: 1 }
        top_p: { type: number, minimum: 0, maximum: 1 }
        stream: { type: boolean, enum: [false], default: false }
    PublicMessagesResponse:
      type: object
      additionalProperties: false
      required: [id, type, role, model, content, stop_reason, stop_sequence, usage]
      properties:
        id: { type: string, minLength: 1 }
        type: { type: string, enum: [message] }
        role: { type: string, enum: [assistant] }
        model: { type: string, minLength: 1, description: Caller-visible public model; private provider mapping is never delivered. }
        content:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [type, text]
            properties:
              type: { type: string, enum: [text] }
              text: { type: string }
        stop_reason: { type: string, enum: [end_turn, max_tokens, stop_sequence] }
        stop_sequence: { type: string, nullable: true }
        usage:
          type: object
          additionalProperties: false
          required: [input_tokens, output_tokens]
          properties:
            input_tokens: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
            cache_creation_input_tokens: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
            cache_read_input_tokens: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
            output_tokens: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
            cache_creation:
              type: object
              additionalProperties: false
              required: [ephemeral_5m_input_tokens, ephemeral_1h_input_tokens]
              properties:
                ephemeral_5m_input_tokens: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
                ephemeral_1h_input_tokens: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
    PublicOpenAIErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [type, code, message, doc_url, param]
          properties:
            type: { type: string, enum: [authentication_error, permission_error, rate_limit_error, invalid_request_error, server_error] }
            code: { type: string }
            message: { type: string }
            doc_url: { type: string }
            param: { nullable: true, enum: [null] }
    PublicOpenAIIdempotencyConflictEnvelope:
      type: object
      additionalProperties: false
      required: [error, idempotency]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [type, code, message, doc_url, param]
          properties:
            type: { type: string, enum: [idempotency_error] }
            code: { type: string }
            message: { type: string }
            doc_url: { type: string }
            param: { nullable: true, enum: [null] }
        idempotency:
          type: object
          description: Secret-free original-operation receipt. It contains no request or response body and is not a replay payload.
          additionalProperties: true
    PublicAnthropicErrorEnvelope:
      type: object
      additionalProperties: false
      required: [type, error, request_id]
      properties:
        type: { type: string, enum: [error] }
        error:
          type: object
          additionalProperties: false
          required: [type, message]
          properties:
            type: { type: string, enum: [authentication_error, permission_error, not_found_error, request_too_large, rate_limit_error, overloaded_error, api_error, invalid_request_error] }
            message: { type: string }
        request_id: { type: string, description: Same server operation ID returned in request-id and X-Request-ID. }
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
        stream:
          type: boolean
          default: false
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
