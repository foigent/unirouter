      cache_creation_ratio. The V1 public price contract is CNY per 1,000,000
      tokens, represented by input_price_cny_per_million_tokens and
      output_price_cny_per_million_tokens; responses also return currency=CNY
      and price_basis_tokens=1000000. Legacy input_price_cents and
      output_price_cents request fields are rejected because their unit is
      ambiguous. Public prices and ratios are returned as canonical decimal
      strings and may be submitted as strings; finite JSON number literals
      remain accepted for compatibility but are parsed from their exact JSON
      lexical form, never through binary floating point. Ratios default to 1 and apply only to provider-authoritative
      Prompt Cache token classes for requests frozen after the change. A model
      with no explicit model_prices row fails closed; no default price is used.
      Supported mutations are serialized per model and return 400 without an
      audit/write when any base/cache/organization-effective price would exceed
      the signed micro-CNY price range. model_name is the stable pricing,
      organization-multiplier, routing and governance identity: it is required
      on create and immutable afterward. Updating a different model_name returns
      400 without changing prices or writing audit evidence; create a new price
      row and migrate independently owned references explicitly instead.
    get:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Paginated exact model-price authority.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelPriceListResponse" }
    post:
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelPriceMutation" }
      responses:
        "201":
          description: Exact model price created or replaced.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelPrice" }
        "400": { $ref: "#/components/responses/Error" }

