      tags: [Admin]
      summary: Acknowledge a tenant-scoped notification event
      description: Requires the notifications License feature. Billing administrators can transition only the two financial event types visible to them. Lifecycle state is independent from webhook delivery state.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: project_id
          in: query
          required: false
          description: Required for project-scoped roles; ignored only where the caller has organization-wide scope
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/notification-events/{id}/resolve:
    x-unirouter-rbac:
      post: [platform_admin, org_admin, billing_admin, project_admin]
    post:
      tags: [Admin]
      summary: Resolve a tenant-scoped notification event
      description: Requires the notifications License feature. Billing administrators can transition only the two financial event types visible to them. Resolved events cannot be reopened through this API.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: project_id
          in: query
          required: false
          description: Required for project-scoped roles; ignored only where the caller has organization-wide scope
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/notification-deliveries:
    x-unirouter-rbac:
      get: [platform_admin, org_admin, billing_admin, project_admin]
    description: Requires the notifications License feature. Billing administrators see delivery rows only when the joined event is in the two-type financial taxonomy; project administrators require an explicit readable project_id.
    get: *operation_list

  /api/v1/notification-webhooks:
    x-unirouter-rbac:
      get: [platform_admin, org_admin, project_admin]
      post: [platform_admin, org_admin, project_admin]
    description: Requires the notifications License feature. Billing administrators have no webhook authority; route middleware excludes the role and every handler also returns 403 before persistence as defense in depth.
    get: *operation_list
    post: *operation_create

  /api/v1/notification-webhooks/{id}:
    x-unirouter-rbac:
      put: [platform_admin, org_admin, project_admin]
    description: Requires the notifications License feature. Billing administrators receive 403 and no read or write is attempted.
    put: *operation_update_by_id

  /api/v1/notification-webhooks/{id}/verify-scope:
    x-unirouter-rbac:
      post: [platform_admin, org_admin, project_admin]
    description: Requires the notifications License feature. Billing administrators receive 403 and no verification or audit mutation is attempted.
    post: *operation_update_by_id

  /api/v1/audit-logs:
    get:
      tags: [Admin]
      summary: Tenant-scoped control-plane audit log
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: request_id, in: query, schema: { type: string }, description: Exact server operation ID }
        - { name: client_request_id, in: query, schema: { type: string }, description: Exact caller correlation ID }
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/settings:
    x-unirouter-rbac:
      get: [platform_admin]
    description: Deployment-wide settings. Dedicated license and sensitive-word values are redacted. Retired global budget-alert keys are marked retired/effective=false with their project and notification API replacements; their historical values have no runtime effect.
    get: *operation_list

  /api/v1/settings/{key}:
    x-unirouter-rbac:
      put: [platform_admin]
    description: Deployment-wide setting update. license.* and sensitive_words must use their dedicated endpoints. Retired budget_alert_webhook_url, budget_alert_threshold_cents, and budget_cents keys return 409 and direct callers to project budgets and tenant-scoped notification webhooks.
    put:
      tags: [Admin]
      summary: Update setting
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  description: Arbitrary valid JSON value, including null.
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/license:
    x-unirouter-rbac:
      get: [platform_admin]
      put: [platform_admin]
    description: Platform recovery and commercial License surface. The response never returns the raw signed document or signature. Only enforceable=true authorizes commercial runtime.
    get:
      tags: [Admin]
      summary: Get verified commercial License status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current verified License status and non-secret signed payload metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseStatus"
    put:
      tags: [Admin]
      summary: Import strict signed commercial License
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license]
              properties:
                license:
                  oneOf:
                    - $ref: "#/components/schemas/CommercialLicenseDocument"
                    - type: string
      responses:
        "200":
          description: Imported and immediately active verified License status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseStatus"
        "400":
          $ref: "#/components/responses/JSON"
        "409":
          description: Signed resource limit is below current active inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: License import exceeds 256 KiB

  /api/v1/sensitive-words:
    x-unirouter-rbac:
      get: [platform_admin]
      post: [platform_admin]
      put: [platform_admin]
      delete: [platform_admin]
    description: Deployment-wide input blocking word list. The handling instance reloads after commit; other instances converge through the existing periodic reload.
    get: *operation_list
    post:
      tags: [Admin]
      summary: Add sensitive words
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensitiveWordsMutation"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    put:
      tags: [Admin]
      summary: Replace sensitive words
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensitiveWordsMutation"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    delete:
      tags: [Admin]
      summary: Delete sensitive words
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensitiveWordsMutation"
      responses:
        "200":
          $ref: "#/components/responses/JSON"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    gatewayKey:
      type: http
      scheme: bearer
      description: UniRouter API key or a signed urc_ Agent capability whose endpoint scope includes the requested model API. Capability calls reserve cost, tokens, rolling rate and concurrency on every signed ancestor before upstream dispatch.
    gatewayRootKey:
      type: http
      scheme: bearer
      description: Long-lived UniRouter API key; Agent capabilities are rejected.
    agentCapability:
      type: http
      scheme: bearer
      bearerFormat: urc_JWT
      description: Five-minute, attenuation-only Agent capability for UniRouter model-gateway authority.
    completedFeedKey:
      type: http
      scheme: bearer
      description: Project-bound, network-bound service key whose exact purpose is xinsight.feed.read. It has no model allowance and is rejected by every non-feed API-key route.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Legacy caller-correlation alias. UniRouter never uses this caller value as the response operation ID or a global financial key.
      schema:
        type: string
        maxLength: 128
    ClientRequestId:
      name: X-UniRouter-Client-Request-ID
      in: header
      required: false
      description: Caller-owned correlation value recorded in operator logs. Do not place secrets or personal data in it. If both this header and legacy X-Request-ID are supplied, they must match.
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Enables 24-hour metadata-only deduplication scoped to organization, API key and canonical request payload. Model responses are not stored or replayed.
      schema:
        type: string
        maxLength: 255

  headers:
    OperationId:
      description: Server-generated operation identity used across gateway, billing, audit and route attempts.
      schema:
        type: string
        pattern: '^op_[0-9a-f]{32}$'
    ClientRequestId:
      description: Echo of the accepted caller correlation value, when supplied.
      schema:
        type: string
        maxLength: 128
    LimitPolicyVersion:
      description: Sanitized fingerprint of the effective shared limit and workload-admission configuration.
      schema:
        type: string
    WorkloadClass:
      description: Server-derived admission class for the model invocation.
      schema:
        type: string
        enum: [interactive, stream, embedding]

  responses:
    JSON:
      description: JSON response
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: A request, token, concurrency, or weighted workload limit was reached.
      headers:
        Retry-After:
          description: Whole seconds before the caller should retry.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdempotencyConflict:
      description: The key is in progress, completed, failed, or bound to a different request. Scheme A returns metadata only and never replays the model response.
      headers:
        X-UniRouter-Original-Request-ID:
          description: Server operation ID of the original request that owns the idempotency key.
          schema:
            type: string
        Retry-After:
          description: Present for an in-progress request.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CompletedExecutionFeedError:
      description: Bounded completed-execution feed error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompletedExecutionFeedError"

  schemas:
    CompletedExecutionFeedPage:
      type: object
      additionalProperties: false
      required: [schema_version, source_instance, generated_at, items, next_cursor, high_watermark, has_more]
      properties:
        schema_version:
          type: string
          enum: [xinsight.completed-execution-feed.v1]
        source_instance:
          type: string
          minLength: 1
          maxLength: 128
        generated_at:
          type: string
          format: date-time
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/CompletedExecutionFeedItem"
        next_cursor:
          type: string
          maxLength: 512
        high_watermark:
          type: string
          maxLength: 512
        has_more:
          type: boolean
    CompletedExecutionFeedItem:
      type: object
      additionalProperties: false
      required: [request_id, terminal_available_at, revision, timeline_complete, snapshot_sha256, snapshot]
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 64
        terminal_available_at:
          type: string
          format: date-time
        revision:
          type: string
          enum: ["1"]
        timeline_complete:
          type: boolean
          enum: [true]
        snapshot_sha256:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        snapshot:
          $ref: "#/components/schemas/CompletedExecutionSnapshot"
    CompletedExecutionSnapshot:
      type: object
      additionalProperties: false
      required: [schema_version, request_id, org_id, project_id, terminal, usage, money, capture_gaps]
      properties:
        schema_version:
          type: string
          enum: [unirouter.completed-execution.v1]
        request_id:
          type: string
          minLength: 1
          maxLength: 64
        org_id:
          type: integer
          format: int64
          minimum: 1
        project_id:
          type: integer
          format: int64
          minimum: 1
        terminal:
          type: object
          additionalProperties: false
          required: [status, available_at]
          properties:
            status:
              type: string
              enum: [settled, cancelled]
            available_at:
              type: string
              format: date-time
        usage:
          type: object
          additionalProperties: false
          required: [model, prompt_tokens, uncached_prompt_tokens, cache_read_tokens, cache_creation_tokens, completion_tokens, source, authority, purpose, finality, contract_version, cache_usage_schema, cache_usage_status]
          properties:
            model: { type: string, minLength: 1, maxLength: 100 }
            prompt_tokens: { type: integer, minimum: 0 }
            uncached_prompt_tokens: { type: integer, minimum: 0 }
            cache_read_tokens: { type: integer, minimum: 0 }
            cache_creation_tokens: { type: integer, minimum: 0 }
            completion_tokens: { type: integer, minimum: 0 }
            source: { type: string, maxLength: 32 }
            authority: { type: string, maxLength: 64 }
            purpose: { type: string, maxLength: 64 }
            finality: { type: string, maxLength: 64 }
            contract_version: { type: string, maxLength: 80 }
            estimate_version: { type: string, maxLength: 80 }
            cache_usage_schema: { type: string, maxLength: 80 }
            cache_usage_status: { type: string, maxLength: 40 }
        money:
          type: object
          additionalProperties: false
          required: [schema, currency, amount_scale, calculated_cost_micros, charged_cost_micros, pricing_version]
          properties:
            schema: { type: string, enum: [micro-cny.v1] }
            currency: { type: string, enum: [CNY] }
            amount_scale: { type: integer, format: int64, enum: [1000000] }
            calculated_cost_micros: { type: string, pattern: '^(0|[1-9][0-9]{0,18})$' }
            charged_cost_micros: { type: string, pattern: '^(0|[1-9][0-9]{0,18})$' }
            pricing_version: { type: string, maxLength: 80 }
        capture_gaps:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [source, reason]
            properties:
              source:
                type: string
                enum: [call_log, request_trace, client_ip_presence, upstream_error_presence]
              reason:
                type: string
                enum: [not_available_at_billing_terminal]
    CompletedExecutionFeedError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
    LicenseCapabilityFeatures:
      type: object
      additionalProperties: false
      required: [gateway, agent_capabilities, oidc, guardrails, notifications, model_governance, data_exchange]
      properties:
        gateway: { type: boolean }
        agent_capabilities: { type: boolean }
        oidc: { type: boolean }
        guardrails: { type: boolean }
        notifications: { type: boolean }
        model_governance: { type: boolean }
        data_exchange: { type: boolean }
    LicenseCapabilityProjection:
      type: object
      additionalProperties: false
      required: [status, enforceable, features]
      description: Non-sensitive, fail-closed feature authorization projection. It never includes the signed License, customer or deployment identity, key ID, signature, expiry metadata, or resource limits.
      properties:
        status:
          type: string
          enum: [missing, active, expiring, expired, invalid, not_yet_valid, deployment_mismatch]
        enforceable: { type: boolean }
        features: { $ref: "#/components/schemas/LicenseCapabilityFeatures" }
    CurrentUserProfile:
      type: object
      additionalProperties: false
      required: [id, username, role, status, org_id, org_name, email, auth_provider, created_at, license_access]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        status: { type: string, enum: [active, disabled] }
        org_id: { type: integer, format: int64 }
        org_name: { type: string }
        email: { type: string }
        auth_provider: { type: string, description: "`local` for password-managed users; otherwise the configured external identity provider." }
        created_at: { type: string, format: date-time }
        license_access: { $ref: "#/components/schemas/LicenseCapabilityProjection" }
    UserRole:
      type: string
      enum: [admin, platform_admin, org_admin, billing_admin, project_admin, developer, viewer, org_viewer]
    UserProjectRole:
      type: string
      enum: [project_admin, developer, viewer]
    ProjectMembershipRole:
      type: string
      enum: [project_admin, project_developer, project_viewer]
      description: Persisted membership role derived one-to-one from the user's project-scoped account role; callers cannot choose a different privilege level.
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        org_id: { type: integer, format: int64, minimum: 1, description: Required for a platform administrator; organization administrators are constrained to their JWT organization. }
        username: { type: string, minLength: 1, description: Deployment-global local login ID. Outer Unicode whitespace is removed before storage and uniqueness ignores case; an unavailable ID returns a generic 409 response. }
        password:
          type: string
          minLength: 12
          description: At least 12 Unicode characters and at most 72 UTF-8 bytes. Creates a local identity under the shared backend, recovery CLI, and UI password policy; externally managed identities are provisioned through OIDC.
          x-unirouter-max-utf8-bytes: 72
        role: { $ref: "#/components/schemas/UserRole" }
        status: { type: string, enum: [active, disabled], default: active }
        project_ids:
          type: array
          description: Accepted only for project_admin, developer, and viewer. Duplicate IDs are normalized; all IDs must belong to org_id.
          items: { type: integer, format: int64, minimum: 1 }
    UserUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one of role, status, or project_ids is required.
      properties:
        role: { $ref: "#/components/schemas/UserRole" }
        status: { type: string, enum: [active, disabled] }
        project_ids:
          type: array
          description: Replaces the complete project membership set. Duplicate IDs are normalized; all IDs must belong to the user's organization.
          items: { type: integer, format: int64, minimum: 1 }
    UserMutationResponse:
      type: object
      additionalProperties: false
      properties:
        id: { type: integer, format: int64, description: Present on create. }
        success: { type: boolean, description: Present on update. }
        project_ids:
          type: array
          nullable: true
          items: { type: integer, format: int64, minimum: 1 }
    ProjectMember:
      type: object
      additionalProperties: false
      required: [user_id, username, email, auth_provider, user_role, status, membership_role, created_at, updated_at]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        username: { type: string }
        email: { type: string }
        auth_provider: { type: string }
        user_role: { $ref: "#/components/schemas/UserRole" }
        status: { type: string, enum: [active, disabled] }
        membership_role: { $ref: "#/components/schemas/ProjectMembershipRole" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EligibleProjectUser:
      type: object
      additionalProperties: false
      required: [user_id, username, email, user_role, membership_role, status]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        username: { type: string }
        email: { type: string }
        user_role: { $ref: "#/components/schemas/UserProjectRole" }
        membership_role: { $ref: "#/components/schemas/ProjectMembershipRole" }
        status: { type: string, enum: [active, disabled] }
    ProjectMemberListResponse:
      type: object
      additionalProperties: false
      required: [data, total, page, page_size, eligible_users, eligible_total, project_id, project_name]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ProjectMember" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        eligible_users:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/EligibleProjectUser" }
        eligible_total: { type: integer, minimum: 0 }
        project_id: { type: integer, format: int64, minimum: 1 }
        project_name: { type: string }
    ProjectBudget:
      type: object
      additionalProperties: false
      required: [project_id, org_id, project_name, budget_cents, budget_period]
      properties:
        project_id: { type: integer, format: int64, minimum: 1 }
        org_id: { type: integer, format: int64, minimum: 1 }
        project_name: { type: string }
        status: { type: string, enum: [active, disabled, archived], description: Present on GET. }
        budget_cents: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
        budget_period: { type: string, enum: [none, daily, monthly] }
    ProjectBudgetMutation:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one of budget_cents or budget_period is required. No other project field is accepted.
      properties:
        budget_cents: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
        budget_period: { type: string, enum: [none, daily, monthly] }
    CommercialLicensePayload:
      type: object
      additionalProperties: false
      required: [license_id, customer, deployment_id, tier, issued_at, not_before, expires_at, features]
      properties:
        license_id: { type: string, minLength: 1, maxLength: 128 }
        customer: { type: string, minLength: 1, maxLength: 256 }
        deployment_id: { type: string, minLength: 1, maxLength: 128 }
        tier: { type: string, minLength: 1, maxLength: 64 }
        issued_at: { type: string, format: date-time }
        not_before: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        features:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            enum: ['*', gateway, agent_capabilities, oidc, guardrails, notifications, model_governance, data_exchange]
        limits:
          type: object
          additionalProperties: false
          properties:
            active_api_keys: { type: integer, format: int64, minimum: 1 }
            active_users: { type: integer, format: int64, minimum: 1 }
            active_projects: { type: integer, format: int64, minimum: 1 }
            active_channels: { type: integer, format: int64, minimum: 1 }
        metadata:
          type: object
          maxProperties: 32
          additionalProperties: { type: string, maxLength: 512 }
    CommercialLicenseDocument:
      type: object
      additionalProperties: false
      required: [schema_version, key_id, payload, signature]
      properties:
        schema_version: { type: string, enum: [unirouter.license.v1] }
        key_id: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
        payload: { $ref: "#/components/schemas/CommercialLicensePayload" }
        signature: { type: string, description: Base64 Ed25519 signature; accepted on PUT but never returned by GET. }
    LicenseStatus:
      type: object
      additionalProperties: false
      required: [status, valid, enforceable, commercial, signature_valid, deployment_match, warning, days_until_expiry, checked_at, verifier_configured]
      properties:
        status: { type: string, enum: [missing, active, expiring, expired, invalid, not_yet_valid, deployment_mismatch] }
        valid: { type: boolean }
        enforceable: { type: boolean }
        commercial: { type: boolean }
        signature_valid: { type: boolean }
        deployment_match: { type: boolean }
        warning: { type: boolean }
        days_until_expiry: { type: integer }
        checked_at: { type: string, format: date-time }
        verifier_configured: { type: boolean }
        schema_version: { type: string }
        key_id: { type: string }
        expected_deployment_id: { type: string }
        license: { type: object, additionalProperties: true, description: Signed payload metadata. Commercial responses follow CommercialLicensePayload; historical non-enforceable PRD2 evidence may contain legacy keys. }
        error: { type: string }
    CanonicalMicros:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)$'
      description: Signed canonical integer micro-CNY text. Leading plus signs and leading zeroes are invalid.
    NonnegativeCanonicalMicros:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: Nonnegative canonical integer micro-CNY text.
    PublicPriceDecimalInput:
      description: Exact CNY per 1,000,000 tokens with at most five fractional digits, bounded so the canonical micro-CNY price fits signed int64 (maximum 9223372036854.77580). Prefer the string form; the numeric form is compatibility input parsed from JSON text.
      oneOf:
        - type: string
          pattern: '^[0-9]+(?:\.[0-9]{1,5})?$'
          maxLength: 64
        - type: number
          minimum: 0
          maximum: 9223372036854.7758
          multipleOf: 0.00001
    CachePriceRatioInput:
      description: Exact provider Prompt Cache price multiplier with at most six fractional digits.
      oneOf:
        - type: string
          pattern: '^[0-9]+(?:\.[0-9]{1,6})?$'
          maxLength: 64
        - type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.000001
    OrgPriceMultiplierInput:
      description: Exact organization price multiplier with at most three fractional digits.
      oneOf:
        - type: string
          pattern: '^[0-9]+(?:\.[0-9]{1,3})?$'
          maxLength: 64
        - type: number
          minimum: 0.001
          maximum: 99.999
          multipleOf: 0.001
    WalletResponse:
      type: object
      required: [id, org_id, balance_micros, granted_balance_micros, frozen_micros, total_spent_micros, threshold_micros, currency, amount_scale]
      properties:
        id: { type: integer, format: int64 }
        org_id: { type: integer, format: int64 }
        balance_micros: { $ref: "#/components/schemas/CanonicalMicros" }
        granted_balance_micros: { $ref: "#/components/schemas/CanonicalMicros" }
        frozen_micros: { $ref: "#/components/schemas/CanonicalMicros" }
        total_spent_micros: { $ref: "#/components/schemas/CanonicalMicros" }
        threshold_micros: { $ref: "#/components/schemas/CanonicalMicros" }
        currency: { type: string, enum: [CNY] }
        amount_scale: { type: integer, format: int64, enum: [1000000] }
      additionalProperties: true
    WalletMutationResponse:
      type: object
      required: [org_id, balance_micros, currency, amount_scale, client_request_id, idempotent_replay]
      properties:
        org_id: { type: integer, format: int64 }
        previous_balance_micros: { $ref: "#/components/schemas/CanonicalMicros" }
        balance_micros: { $ref: "#/components/schemas/CanonicalMicros" }
        delta_micros: { $ref: "#/components/schemas/CanonicalMicros" }
        currency: { type: string, enum: [CNY] }
        amount_scale: { type: integer, format: int64, enum: [1000000] }
        client_request_id: { type: string }
        idempotent_replay: { type: boolean }
      additionalProperties: true
    ModelPrice:
      type: object
      required: [id, model_name, input_price_cny_per_million_tokens, output_price_cny_per_million_tokens, cache_read_ratio, cache_creation_ratio, currency, price_basis_tokens]
      properties:
        id: { type: integer, format: int64 }
        model_name: { type: string }
        input_price_cny_per_million_tokens: { type: string, pattern: '^(0|[1-9][0-9]{0,12})(?:\.[0-9]{1,5})?$' }
        output_price_cny_per_million_tokens: { type: string, pattern: '^(0|[1-9][0-9]{0,12})(?:\.[0-9]{1,5})?$' }
        cache_read_ratio: { type: string, pattern: '^(0|[1-9][0-9]*)(?:\.[0-9]{1,6})?$' }
        cache_creation_ratio: { type: string, pattern: '^(0|[1-9][0-9]*)(?:\.[0-9]{1,6})?$' }
        currency: { type: string, enum: [CNY] }
        price_basis_tokens: { type: integer, format: int64, enum: [1000000] }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    ModelPriceMutation:
      type: object
      properties:
        model_name: { type: string, minLength: 1, description: "Required when creating a model price. Immutable after creation; PUT may omit it or repeat the exact stored value, but cannot rename the record." }
        input_price_cny_per_million_tokens: { $ref: "#/components/schemas/PublicPriceDecimalInput" }
        output_price_cny_per_million_tokens: { $ref: "#/components/schemas/PublicPriceDecimalInput" }
        cache_read_ratio: { $ref: "#/components/schemas/CachePriceRatioInput" }
        cache_creation_ratio: { $ref: "#/components/schemas/CachePriceRatioInput" }
      additionalProperties: false
    ModelPriceListResponse:
      type: object
      required: [data, total, page, page_size, can_mutate]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ModelPrice" } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        can_mutate: { type: boolean }
    OrgModelPrice:
      type: object
      required: [id, org_id, model_name, multiplier]
      properties:
        id: { type: integer, format: int64 }
        org_id: { type: integer, format: int64 }
        org_name: { type: string }
        model_name: { type: string }
        multiplier: { type: string, pattern: '^(?:0\.00[1-9]|0\.0[1-9][0-9]?|0\.[1-9][0-9]{0,2}|[1-9][0-9]?(?:\.[0-9]{1,3})?)$' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: true
    OrgModelPriceMutation:
      type: object
      required: [multiplier]
      properties:
        org_id: { type: integer, format: int64, minimum: 1 }
        model_name: { type: string, minLength: 1 }
        multiplier: { $ref: "#/components/schemas/OrgPriceMultiplierInput" }
      additionalProperties: false
    OrgModelPriceListResponse:
      type: object
      required: [data, total, page, page_size, org_id, can_mutate]
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/OrgModelPrice" } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        org_id: { type: integer, format: int64 }
        can_mutate: { type: boolean }
    AgentCapabilityLimits:
      type: object
      additionalProperties: false
      required: [max_depth, max_children, max_descendants, cost_budget_cents, token_budget, rpm_limit, rps_limit, concurrency_limit, allowed_models, allowed_endpoints]
      properties:
        max_depth: { type: integer, minimum: 0, maximum: 16 }
        max_children: { type: integer, minimum: 0, maximum: 10000 }
        max_descendants: { type: integer, minimum: 0, maximum: 10000 }
        cost_budget_cents: { type: integer, format: int64, minimum: 1, maximum: 900719925474, description: "Compatibility configuration input in whole cents. It is converted exactly to micro-CNY before the v2 Redis counter is written; estimated cost is reserved on this Agent and every ancestor, then replaced with actual settled cost." }
        token_budget: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, description: Shared subtree token ceiling; estimated tokens are reserved on every ancestor and replaced with actual settled tokens. }
        rpm_limit: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, description: Exact rolling one-minute aggregate admission limit for this Agent subtree. }
        rps_limit: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, description: Exact rolling one-second aggregate admission limit for this Agent subtree. }
        concurrency_limit: { type: integer, format: int64, minimum: 1, maximum: 9007199254740991, description: "Shared in-flight request limit for this Agent subtree, enforced with an expiring Redis lease." }
        allowed_models:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items: { type: string, maxLength: 128 }
        allowed_endpoints:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [/v1/chat/completions, /v1/embeddings, /v1/models]
    AgentCapabilityExchangeRequest:
      type: object
      additionalProperties: false
      required: [root_agent_id, workflow_ttl_seconds, limits]
      properties:
        root_agent_id: { type: string, minLength: 1, maxLength: 128 }
        workflow_ttl_seconds: { type: integer, format: int64, minimum: 300, maximum: 86400 }
        limits: { $ref: "#/components/schemas/AgentCapabilityLimits" }
    AgentCapabilityDelegateRequest:
      type: object
      additionalProperties: false
      required: [child_agent_id, limits]
      properties:
        child_agent_id: { type: string, minLength: 1, maxLength: 128 }
        limits: { $ref: "#/components/schemas/AgentCapabilityLimits" }
    AgentCapabilityTokenResponse:
      type: object
      required: [schema_version, capability_token, token_type, workflow_id, root_agent_id, agent_id, depth, expires_at, refresh_after, workflow_expires_at, limits]
      properties:
        schema_version: { type: string, enum: [unirouter.agent-capability.v2] }
        capability_token: { type: string, readOnly: true, description: Secret bearer capability beginning with urc_; never log or persist it. }
        token_type: { type: string, enum: [Bearer] }
        workflow_id: { type: string, pattern: '^capwf_[0-9a-f]{32}$' }
        root_agent_id: { type: string }
        agent_id: { type: string }
        parent_agent_id: { type: string }
        depth: { type: integer, minimum: 0, maximum: 16 }
        expires_at: { type: string, format: date-time }
        refresh_after: { type: string, format: date-time }
        workflow_expires_at: { type: string, format: date-time }
        limits: { $ref: "#/components/schemas/AgentCapabilityLimits" }
    SensitiveWordsMutation:
      type: object
      required: [words]
      properties:
        words:
          type: array
          items:
            type: string
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
        stream:
          type: boolean
          default: false
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
