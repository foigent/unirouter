  /api/v1/access-provisioning/legacy-preview:
    get:
      tags: [Admin]
      summary: Preview legacy Credential and WorkloadApplication migration classifications
      description: |
        Read-only organization migration inventory. It emits both `credential` and `workload_application` records, including zero-key legacy applications. Application classification is grouped across sanitized linked key metadata so a personal-development owner or a nonhuman workload is never guessed from one key row. `interactive_client`, ambiguous owners/scopes, and unsupported legacy identities remain `review_required`; purpose credentials remain `connector_separate`. `automatic_migration` is always false in PR3 and this route performs no backfill.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Read-only typed legacy migration preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegacyAccessPreviewResponse" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac:
      get: [platform_admin, org_admin]

  /api/v1/access-requests:
    get:
      tags: [Admin]
      summary: List actor-owned or project access requests with a bounded keyset page
      description: |
        `scope=my` returns only requests submitted by, targeting, or sponsored by the authenticated actor and does not require an existing project membership. This keeps a first-project applicant's pending request reachable without exposing the project inventory. `scope=project` (the default) requires `project_id` and live project-read authority; platform/org/project administrators see the authorized project inventory. Project users and viewers never gain project-wide access-request visibility.

        Results are ordered by stable `id DESC`. `after_id` is exclusive and must be copied from `pagination.next_after_id`. The server returns at most `limit` rows and never performs an unbounded list or a total-count query.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [my, project], default: project }
        - $ref: "#/components/parameters/OrgId"
        - name: project_id
          in: query
          description: Required for project scope and forbidden for my scope.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: status
          in: query
          description: Optional project-scope server filter applied before the keyset limit. Forbidden for scope=my.
          schema: { type: string, enum: [approved, needs_review, rejected, cancelled] }
        - name: workload_application_id
          in: query
          description: Optional exact Workload subject filter for an authorized project queue. Forbidden for scope=my.
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: "#/components/parameters/AccessPageLimit"
        - $ref: "#/components/parameters/AccessAfterId"
      responses:
        "200":
          description: Bounded access-request page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRequestPage" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [Admin]
      summary: Submit one project-bound access request through deterministic policy
      description: |
        Public callers may submit only `self`, `delegated`, or `direct_grant`. Migration, bootstrap, and recovery are trusted internal adapter modes and are rejected on this public route. A first-cross-project self request creates review evidence only; membership, Grant, and credential are created only after an authorized approval. `X-UniRouter-Client-Request-ID` is required and scoped to the submitting actor; semantic retries are idempotent and conflicting intent returns 409.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/RequiredClientRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessProvisionInput" }
      responses:
        "200":
          description: Idempotent replay
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessProvisionResult" } } }
        "201":
          description: New request and optional auto/direct Grant
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessProvisionResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac:
      get: [platform_admin, org_admin, project_admin, project_user]
      post: [platform_admin, org_admin, project_admin, project_user, member]

  /api/v1/access-requests/{ref}:
    get:
      tags: [Admin]
      summary: Read one actor-scoped access request and its approved Grant snapshot
      description: Inaccessible and absent request references are byte-equivalent 404 responses. Project users see only their own subject, sponsored workload, or submitted requests; project-wide inventory is reserved for platform, organization, and live project administrators.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccessRequestRef"
      responses:
        "200":
          description: Access request detail
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequestDetail" } } }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac:
      get: [platform_admin, org_admin, project_admin, project_user]

  /api/v1/access-requests/{ref}/decision:
    post:
      tags: [Admin]
      summary: Approve or reject one needs-review request with optimistic revision control
      description: |
        Decision authority is reason-scoped. Project administrators can decide only the accepted ordinary non-production cases; role elevation, special scope, production, migration ambiguity and mixed exceptions require organization/platform authority. `needs_review` requires an explicit audited decision but does not impose a hard-coded second-person workflow: an authorized submitter may also decide, with `submitted_by` and `decided_by` preserved as evidence. The required client request ID makes a committed decision replayable after response loss.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccessRequestRef"
        - $ref: "#/components/parameters/RequiredClientRequestId"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessDecisionInput" } } }
      responses:
        "200":
          description: Durable decision result or semantic replay
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessProvisionResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac:
      post: [platform_admin, org_admin, project_admin]

  /api/v1/access-requests/{ref}/cancel:
    post:
      tags: [Admin]
      summary: Cancel one still-pending access request
      description: |
        Only a `needs_review` request may be cancelled. The live submitter, or the live sponsor of a workload request, supplies the expected revision and a client request ID. Cancellation creates immutable requester-cancelled evidence but never creates or revokes membership, Grant, or Credential state. A concurrent decision and cancellation serialize on the same request row and exactly one wins. Hidden and absent references are indistinguishable.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccessRequestRef"
        - $ref: "#/components/parameters/RequiredClientRequestId"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequestCancelInput" } } }
      responses:
        "200":
          description: Durable cancellation result or semantic replay
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequestCancelResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac:
      post: [platform_admin, org_admin, project_admin, project_user, member]

  /api/v1/access-grants:
    get:
      tags: [Admin]
      summary: List visible Grants with a bounded keyset page
      description: Results are ordered by stable `id DESC`. Project users see only their own human Grant or sponsored workload Grant. Project viewers, organization viewers and billing administrators do not receive project-wide access inventory.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [my, project], default: project }
          description: my returns only human Grants whose subject is the authenticated actor and requires no project enumeration. project requires project_id and live project-read authority.
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/ProjectId"
        - name: workload_application_id
          in: query
          description: Optional exact Workload subject filter for an authorized project list. Forbidden with scope=my.
          schema: { type: integer, format: int64, minimum: 1 }
        - $ref: "#/components/parameters/AccessPageLimit"
        - $ref: "#/components/parameters/AccessAfterId"
      responses:
        "200":
          description: Bounded Grant page
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGrantPage" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac:
      get: [platform_admin, org_admin, project_admin, project_user]

  /api/v1/access-grants/{ref}:
    get:
      tags: [Admin]
      summary: Read one actor-scoped Grant
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccessGrantRef"
      responses:
        "200":
          description: Grant snapshot
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessGrant" } } }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac:
      get: [platform_admin, org_admin, project_admin, project_user]

  /api/v1/access-grants/{ref}/suspend:
    post: &access_grant_lifecycle_operation
      tags: [Admin]
      summary: Suspend one Grant
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccessGrantRef"
        - $ref: "#/components/parameters/RequiredClientRequestId"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessGrantLifecycleInput" } } }
      responses:
        "200": { description: "Updated Grant", content: { application/json: { schema: { $ref: "#/components/schemas/AccessGrant" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac: { post: [platform_admin, org_admin, project_admin] }

  /api/v1/access-grants/{ref}/resume:
    post:
      <<: *access_grant_lifecycle_operation
      summary: Resume one suspended Grant after live-subject revalidation
    x-unirouter-rbac: { post: [platform_admin, org_admin, project_admin] }

  /api/v1/access-grants/{ref}/revoke:
    post:
      <<: *access_grant_lifecycle_operation
      summary: Permanently revoke one Grant and all logical Credential families
    x-unirouter-rbac: { post: [platform_admin, org_admin, project_admin] }

  /api/v1/access-grants/{ref}/credentials:
    get:
      tags: [Admin]
      summary: List logical Access Credentials and nested secret versions
      description: The bounded page is keyed by logical Credential family id, so atomic replacement history never consumes separate page slots. It returns no secret. Platform/org/project administrators can inspect project credentials; a project user can inspect only their own human Grant, and the exact live sponsor of a Workload Grant may inspect that Grant's secret-free Credential family/version metadata for accountability. Sponsor visibility never grants issue, rotate, revoke, or secret access. Viewers and billing administrators cannot inspect credential inventory.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccessGrantRef"
        - $ref: "#/components/parameters/AccessPageLimit"
        - $ref: "#/components/parameters/AccessAfterId"
      responses:
        "200":
          description: Bounded logical Credential family page
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessCredentialPage" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [Admin]
      summary: Issue a new logical Credential and its first one-time secret version
      description: Human personal secrets may be issued only by the exact human subject. Workload secrets are managed by authorized project/org/platform administrators. The requested scope can only narrow the live Grant. A replay returns the same metadata with `secret_available=false`; raw secret material is never persisted for replay.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccessGrantRef"
        - $ref: "#/components/parameters/RequiredClientRequestId"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessCredentialIssueInput" } } }
      responses:
        "200": { description: "Secret-free idempotent replay", content: { application/json: { schema: { $ref: "#/components/schemas/AccessCredentialIssueResult" } } } }
        "201": { description: "New Credential with one-time secret", content: { application/json: { schema: { $ref: "#/components/schemas/AccessCredentialIssueResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac:
      get: [platform_admin, org_admin, project_admin, project_user]
      post: [platform_admin, org_admin, project_admin, project_user]

  /api/v1/access-grants/{ref}/credentials/{key_id}/rotate:
    post:
      tags: [Admin]
      summary: Rotate one physical secret version within its immutable logical Credential family
      description: Rotation has no caller-editable scope. Name, IPs, models, endpoints and limits are read from the locked family. The successor is created and the exact predecessor is disabled atomically; after commit the old secret fails immediately and the successor is the sole active version. A lost-response replay returns secret-free successor metadata, and recovery uses a new request ID to rotate that successor again.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccessGrantRef"
        - $ref: "#/components/parameters/AccessCredentialVersionId"
        - $ref: "#/components/parameters/RequiredClientRequestId"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessCredentialRotateInput" } } }
      responses:
        "200": { description: "Secret-free idempotent replay", content: { application/json: { schema: { $ref: "#/components/schemas/AccessCredentialRotationResult" } } } }
        "201": { description: "Atomically replaced successor secret version and disabled predecessor metadata", content: { application/json: { schema: { $ref: "#/components/schemas/AccessCredentialRotationResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac: { post: [platform_admin, org_admin, project_admin, project_user] }

  /api/v1/access-grants/{ref}/credentials/{key_id}/revoke:
    post:
      tags: [Admin]
      summary: Permanently revoke a logical Credential family located by one secret version
      description: Revocation disables every active version in the family and returns no secret. Human subjects and project/org/platform administrators may contain a visible family; inaccessible Feed-purpose, foreign and absent locators remain indistinguishable.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccessGrantRef"
        - $ref: "#/components/parameters/AccessCredentialVersionId"
        - $ref: "#/components/parameters/RequiredClientRequestId"
      responses:
        "200":
          description: Logical Credential family revoked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties: { status: { type: string, enum: [revoked] } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac: { post: [platform_admin, org_admin, project_admin, project_user] }

  /api/v1/model-readiness:
    get:
      tags: [Admin]
      summary: Explain platform-model and current-project caller readiness without runtime mutation or external traffic
      description: |
        Returns four independent facts: registered, catalog visible, routable, and callable by the selected current caller. It reuses model governance, pure routing preview, the live AccessGrant boundary, model authorization and distributed-limit selector materialization. It never claims a half-open route lease and sends no Provider, Feed, health-check or upstream request. Unavailable evidence remains `unavailable` rather than being reported as a business blocker. Non-platform responses contain only safe aggregates.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: model
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
        - name: endpoint
          in: query
          required: true
          schema: { type: string, enum: [/v1/chat/completions, /v1/embeddings, /v1/models, /v1/media/jobs] }
        - name: caller
          in: query
          required: true
          schema: { type: string, enum: [self, workload_application] }
        - name: application_ref
          in: query
          description: Required only for caller=workload_application and scoped to the selected project.
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: Read-only readiness evidence
          content: { application/json: { schema: { $ref: "#/components/schemas/ModelReadinessResponse" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac:
      get: [platform_admin, org_admin, org_viewer, project_admin, project_user, project_viewer]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    gatewayKey:
      type: http
      scheme: bearer
      description: UniRouter API key or a signed urc_ Agent capability whose endpoint scope includes the requested model API. Capability calls reserve cost, tokens, rolling rate and concurrency on every signed ancestor before upstream dispatch.
    gatewayRootKey:
      type: http
      scheme: bearer
      description: Long-lived UniRouter API key; Agent capabilities are rejected.
    agentCapability:
      type: http
      scheme: bearer
      bearerFormat: urc_JWT
      description: Five-minute, attenuation-only Agent capability for UniRouter model-gateway authority.
    completedFeedKey:
      type: http
      scheme: bearer
      description: Project-bound, network-bound service key whose exact purpose is xinsight.feed.read. It has no model allowance and is rejected by every non-feed API-key route.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Legacy caller-correlation alias. UniRouter never uses this caller value as the response operation ID or a global financial key.
      schema:
        type: string
        maxLength: 128
    ClientRequestId:
      name: X-UniRouter-Client-Request-ID
      in: header
      required: false
      description: Caller-owned correlation value recorded in operator logs. Do not place secrets or personal data in it. If both this header and legacy X-Request-ID are supplied, they must match.
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Enables 24-hour metadata-only deduplication scoped to organization, API key and canonical request payload. Model responses are not stored or replayed.
      schema:
        type: string
        maxLength: 255
    ResponseCacheOptIn:
      name: X-UniRouter-Response-Cache
      in: header
      required: false
      description: Exact case-insensitive value `allow` opts this request into an otherwise eligible, policy-assigned Exact Response Cache canary. Omission never enables cache reads or writes.
      schema:
        type: string
        enum: [allow]
    PromptCompressionOptIn:
      name: X-UniRouter-Prompt-Compression
      in: header
      required: false
      description: Exact case-insensitive value `allow` permits a policy-assigned Compression canary to apply the reviewed whitespace-only candidate. Shadow never mutates the request.
      schema:
        type: string
        enum: [allow]
    RequestCacheControl:
      name: Cache-Control
      in: header
      required: false
      description: A `no-store` directive always bypasses Exact Response Cache persistence and lookup. `no-cache` alone does not opt in or opt out.
      schema:
        type: string
    InvocationOptimizationPolicyRef:
      name: ref
      in: path
      required: true
      schema:
        type: string
        pattern: '^opt_[a-z0-9][a-z0-9._-]{2,59}$'
    MediaJobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^mediajob_[a-f0-9]{32}$'
    ProjectId:
      name: project_id
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    OrgId:
      name: org_id
      in: query
      required: false
      description: Platform administrators use this to bind the selected project's organization. Other roles remain bound to their authenticated organization.
      schema:
        type: integer
        format: int64
        minimum: 1
    AccessPageLimit:
      name: limit
      in: query
      required: false
      description: Maximum rows in this descending-id keyset page. The server fetches one extra row only to compute has_more; it never silently truncates an unpageable list.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    AccessAfterId:
      name: after_id
      in: query
      required: false
      description: Exclusive stable database id cursor copied from pagination.next_after_id. Results remain ordered by id descending.
      schema:
        type: integer
        format: int64
        minimum: 1
    AccessRequestRef:
      name: ref
      in: path
      required: true
      schema:
        type: string
        pattern: '^req_[a-z0-9][a-z0-9_-]{7,67}$'
    AccessGrantRef:
      name: ref
      in: path
      required: true
      schema:
        type: string
        pattern: '^grant_[a-z0-9][a-z0-9_-]{7,65}$'
    AccessCredentialVersionId:
      name: key_id
      in: path
      required: true
      description: Physical one-time secret version locator. Authorization, scope and quota identity remain bound to its logical Access Credential family.
      schema:
        type: integer
        format: int64
        minimum: 1
    RequiredClientRequestId:
      name: X-UniRouter-Client-Request-ID
      in: header
      required: true
      description: Actor-scoped durable operation key. Identical business intent replays the committed secret-free result; different intent under the same value returns 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'

  headers:
    OperationId:
      description: Server-generated operation identity used across gateway, billing, audit and route attempts.
      schema:
        type: string
        pattern: '^op_[0-9a-f]{32}$'
    ClientRequestId:
      description: Echo of the accepted caller correlation value, when supplied.
      schema:
        type: string
        maxLength: 128
    LimitPolicyVersion:
      description: Sanitized fingerprint of the effective shared limit and workload-admission configuration.
      schema:
        type: string
    WorkloadClass:
      description: Server-derived admission class for the model invocation.
      schema:
        type: string
        enum: [interactive, stream, embedding]
    ResponseCacheOutcome:
      description: Present only when an applicable Exact Response Cache policy was evaluated. HIT served a current zero-token/zero-charge local delivery; MISS owns an upstream fill; BYPASS made no cache read/write claim.
      schema:
        type: string
        enum: [HIT, MISS, BYPASS]
    PromptCompressionOutcome:
      description: SHADOW and CANARY expose the effective policy stage without claiming mutation; only APPLIED means the current request body used the reviewed whitespace-only candidate.
      schema:
        type: string
        enum: [SHADOW, CANARY, APPLIED]

  responses:
    JSON:
      description: JSON response
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: A request, token, concurrency, or weighted workload limit was reached.
      headers:
        Retry-After:
          description: Whole seconds before the caller should retry.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdempotencyConflict:
      description: The key is in progress, completed, failed, or bound to a different request. Scheme A returns metadata only and never replays the model response.
      headers:
        X-UniRouter-Original-Request-ID:
          description: Server operation ID of the original request that owns the idempotency key.
          schema:
            type: string
        Retry-After:
          description: Present for an in-progress request.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CompletedExecutionFeedError:
      description: Bounded completed-execution feed error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompletedExecutionFeedError"

  schemas:
    OrganizationRole:
      type: string
      enum: [platform_admin, org_admin, billing_admin, org_viewer, member]
      description: Canonical organization authority. It is independent from live project membership; compatibility users.role/JWT aliases are not project authority.
    ProjectMembershipRole:
      type: string
      enum: [project_admin, project_user, project_viewer]
      description: Canonical live project_members role. project_user may call and manage their own personal Credential; project_viewer is read-only and cannot call.
    LegacyCredentialSummary:
      type: object
      additionalProperties: false
      required: [key_id, key_prefix, key_type]
      properties:
        key_id: { type: integer, format: int64, minimum: 1 }
        key_prefix: { type: string, description: Sanitized prefix only; no secret or hash is returned. }
        key_type: { type: string, enum: [shared, personal, service] }
        purpose: { type: string, enum: [xinsight.feed.read] }
        project_id: { type: integer, format: int64, minimum: 1 }
        owner_user_id: { type: integer, format: int64, minimum: 1 }
    LegacyAccessClassification:
      type: object
      additionalProperties: false
      required: [object_type, object_id, object_ref, classification, reason_code, migration_status, automatic_migration]
      properties:
        object_type: { type: string, enum: [credential, workload_application] }
        object_id: { type: integer, format: int64, minimum: 1 }
        object_ref: { type: string }
        classification:
          type: string
          enum: [human_personal_candidate, workload_candidate, review_required, connector_separate, grant_bound, linked_to_workload_application, legacy_unbound]
        reason_code:
          type: string
          enum:
            - unambiguous_personal_development_owner_project
            - unambiguous_nonhuman_workload
            - interactive_client_requires_review
            - legacy_application_not_active
            - legacy_project_not_active
            - mixed_current_and_legacy_credentials
            - legacy_key_project_mismatch
            - personal_development_missing_owner
            - personal_development_multiple_owners
            - personal_owner_not_active_or_calling
            - nonhuman_workload_owner_not_active_or_calling
            - nonhuman_workload_mixed_key_ownership
            - unsupported_legacy_identity
            - purpose_credential_excluded
            - current_access_grant
            - classified_at_workload_application
            - unbound_current_or_foreign_workload
            - personal_key_missing_project
            - personal_key_missing_owner
            - personal_key_owner_not_active
            - personal_key_owner_not_calling
            - unambiguous_single_owner_project
            - ordinary_key_without_grant
            - unbound_service_subject_ambiguous
        migration_status: { type: string, enum: [candidate, review_required, excluded, current, linked, legacy_unbound] }
        automatic_migration: { type: boolean, enum: [false] }
        project_id: { type: integer, format: int64, minimum: 1 }
        owner_user_id: { type: integer, format: int64, minimum: 1 }
        workload_application_id: { type: integer, format: int64, minimum: 1 }
        application_ref: { type: string }
        kind: { type: string }
        identity_mode: { type: string, enum: [service_credential, personal_development] }
        environment: { type: string }
        status: { type: string, enum: [active, disabled, archived] }
        client_profiles: { type: array, uniqueItems: true, items: { type: string } }
        linked_credential_count: { type: integer, minimum: 0 }
        linked_credentials: { type: array, items: { $ref: "#/components/schemas/LegacyCredentialSummary" } }
        key_id: { type: integer, format: int64, minimum: 1 }
        key_prefix: { type: string }
    LegacyAccessPreviewResponse:
      type: object
      additionalProperties: false
      required: [mutation, data, total]
      properties:
        mutation: { type: boolean, enum: [false] }
        data: { type: array, items: { $ref: "#/components/schemas/LegacyAccessClassification" } }
        total: { type: integer, minimum: 0 }
    WorkloadApplicationCreateInput:
      type: object
      additionalProperties: false
      required: [org_id, project_id, application_ref, logical_ref, display_name, kind, environment, production_use, identity_mode, client_profiles, owner_team, description, status]
      properties:
        org_id: { type: integer, format: int64, minimum: 1 }
        project_id: { type: integer, format: int64, minimum: 1 }
        application_ref: { type: string, pattern: '^app_[a-z0-9][a-z0-9._-]{2,59}$' }
        logical_ref: { type: string, pattern: '^workload_[a-z0-9][a-z0-9._-]{2,54}$' }
        display_name: { type: string, minLength: 1, maxLength: 160 }
        kind: { type: string, enum: [service, agent, workflow, integration_adapter] }
        environment: { type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$' }
        production_use: { type: boolean, description: Immutable risk classification; it is independent from the environment label. }
        identity_mode: { type: string, enum: [service_credential] }
        client_profiles:
          type: array
          uniqueItems: true
          description: Optional, non-authoritative compatibility profiles. An empty array is valid.
          items: { type: string }
        primary_client_profile: { type: string, description: Optional compatibility shadow; when present it must also appear in client_profiles. }
        owner_team: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 1000 }
        status: { type: string, enum: [active, disabled] }
    WorkloadApplicationUpdateInput:
      type: object
      additionalProperties: false
      required: [org_id, expected_revision, display_name, client_profiles, owner_team, description, status]
      properties:
        org_id: { type: integer, format: int64, minimum: 1 }
        expected_revision: { type: integer, format: int64, minimum: 1 }
        display_name: { type: string, minLength: 1, maxLength: 160 }
        environment: { type: string, description: Optional immutable echo; a changed value returns 409. }
        client_profiles: { type: array, uniqueItems: true, items: { type: string } }
        primary_client_profile: { type: string }
        owner_team: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 1000 }
        status: { type: string, enum: [active, disabled] }
    WorkloadApplication:
      type: object
      additionalProperties: false
      required: [id, org_id, project_id, application_ref, contract_version, identity_contract_version, display_name, kind, environment, production_use, identity_mode, client_profiles, owner_team, description, status, revision, created_by, updated_by, created_at, updated_at, project_name, project_status, credential_count, active_credential_count, identity_classification, can_manage, can_request_access, can_read_credentials]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        org_id: { type: integer, format: int64, minimum: 1 }
        project_id: { type: integer, format: int64, minimum: 1 }
        application_ref: { type: string }
        contract_version: { type: string, enum: [unirouter.workload-application.v1, unirouter.workload-application.v2] }
        identity_contract_version: { type: string, enum: [unirouter.workload-identity.v1, unirouter.workload-identity.v2] }
        logical_ref: { type: string }
        display_name: { type: string }
        kind: { type: string, enum: [service, agent, workflow, integration_adapter, interactive_client] }
        environment: { type: string }
        production_use: { type: boolean }
        identity_mode: { type: string, enum: [service_credential, personal_development] }
        client_profile: { type: string, deprecated: true }
        client_profiles: { type: array, uniqueItems: true, items: { type: string } }
        owner_team: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, disabled, archived] }
        revision: { type: integer, format: int64, minimum: 1 }
        created_by: { type: integer, format: int64, minimum: 1 }
        updated_by: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time }
        project_name: { type: string }
        project_status: { type: string }
        credential_count: { type: integer, minimum: 0, description: Logical credential families; each legacy-unbound key counts as one compatibility seat. }
        active_credential_count: { type: integer, minimum: 0, description: "Runtime-effective logical families, not physical secret-version rows." }
        identity_classification: { type: string, enum: [v2, legacy_v1] }
        compatibility_evidence: { type: string }
        can_manage: { type: boolean }
        can_request_access: { type: boolean }
        can_read_credentials: { type: boolean }
    WorkloadApplicationListResponse:
      type: object
      additionalProperties: false
      required: [data, total]
      properties:
        data: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/WorkloadApplication" } }
        total: { type: integer, minimum: 0, maximum: 200 }
    WorkloadClientProfile:
      type: object
      additionalProperties: false
      required: [profile_id, display_name, client_family, api_style, supported_endpoints, runtime_state, evidence_level, recommended_for_poc, configuration_note]
      properties:
        profile_id: { type: string }
        display_name: { type: string }
        client_family: { type: string }
        api_style: { type: string }
        supported_endpoints: { type: array, items: { type: string } }
        runtime_state: { type: string, enum: [runtime_supported, protocol_compatible, contract_only, adapter_required] }
        evidence_level: { type: string, enum: [verified, protocol_compatible, unsupported] }
        recommended_for_poc: { type: boolean }
        configuration_note: { type: string }
    WorkloadApplicationContract:
      type: object
      additionalProperties: false
      required: [contract_version, readiness_version, client_profiles, identity_authority, tool_or_mcp_authority, legacy_credentials, runtime_mutation]
      properties:
        contract_version: { type: string, enum: [unirouter.workload-application.v2] }
        readiness_version: { type: string }
        client_profiles: { type: array, items: { $ref: "#/components/schemas/WorkloadClientProfile" } }
        identity_authority: { type: string, enum: [product_local_model_execution_only] }
        tool_or_mcp_authority: { type: string, enum: [none] }
        legacy_credentials: { type: string, enum: [legacy_unbound_compatible] }
        runtime_mutation: { type: string, enum: [none] }
    AccessSubject:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: { type: string, enum: [user, workload_application] }
        user_id: { type: integer, format: int64, minimum: 1 }
        workload_application_id: { type: integer, format: int64, minimum: 1 }
      description: Exactly one matching subject id is required. A workload is bound to the exact project and immutable environment recorded by its v2 identity.
    AccessEnvelope:
      type: object
      additionalProperties: false
      required: [project_role, scope_mode, models, endpoints]
      properties:
        project_role: { $ref: "#/components/schemas/ProjectMembershipRole" }
        scope_mode:
          type: string
          enum: [project_default, explicit]
          description: project_default resolves the current approved project catalog and the fixed execution endpoint set; empty arrays never mean every route. explicit requires non-empty reviewed scope.
        models:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200, pattern: '^[^,]+$' }
        endpoints:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [/v1/chat/completions, /v1/embeddings, /v1/models, /v1/media/jobs]
        rpm_limit: { type: integer, minimum: 0, maximum: 2147483647, nullable: true }
        rps_limit: { type: integer, minimum: 0, maximum: 2147483647, nullable: true }
        concurrency_limit: { type: integer, minimum: 0, maximum: 2147483647, nullable: true }
    AccessPolicyReasonCode:
      type: string
      enum:
        - auto_approved_current_project_default
        - auto_approved_workload_project_default
        - project_default_scope
        - first_cross_project
        - role_elevation
        - special_model
        - special_endpoint
        - scope_expansion
        - extra_rate_or_concurrency
        - validity_extension
        - production_workload
        - ambiguous_migration
        - workload_requires_review
        - read_only_subject_cannot_invoke
      description: Immutable deterministic-policy evidence. Manual input cannot add, remove or forge these codes.
    AccessDecisionReasonCode:
      type: string
      enum:
        - manual_approved
        - manual_rejected
        - direct_grant_authorized_nonproduction
        - bootstrap_authorized
        - recovery_authorized
        - requester_cancelled
      description: Stable decision-source evidence, separate from immutable policy reasons. Free-form text is not accepted as a reason code.
    AccessProvisionInput:
      type: object
      additionalProperties: false
      required: [org_id, project_id, subject, request_kind, requested_scope, environment, production_use, submission_mode]
      properties:
        org_id: { type: integer, format: int64, minimum: 1 }
        project_id: { type: integer, format: int64, minimum: 1 }
        subject: { $ref: "#/components/schemas/AccessSubject" }
        request_kind: { type: string, enum: [human_personal, workload_service] }
        requested_scope: { $ref: "#/components/schemas/AccessEnvelope" }
        environment: { type: string, pattern: '^[a-z][a-z0-9_-]{0,31}$' }
        production_use: { type: boolean }
        valid_until:
          type: string
          format: date-time
          description: Optional future UTC expiry. Extending a finite Grant or removing expiry is scope widening and requires the corresponding policy decision.
        submission_mode: { type: string, enum: [self, delegated, direct_grant] }
        sponsor_user_id:
          type: integer
          format: int64
          minimum: 1
          description: Required only for workload_service. Human requests must omit sponsor; actor evidence is submitted_by.
    AccessRequest:
      type: object
      additionalProperties: false
      required: [id, request_ref, client_request_id, semantic_hash, semantic_revision, org_id, project_id, subject, request_kind, requested_scope, environment, production_use, submission_mode, status, decision_mode, policy_reason_codes, decision_reason_codes, policy_version, submitted_by, submitted_at, revision]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        request_ref: { type: string, pattern: '^req_[a-z0-9][a-z0-9_-]{7,67}$' }
        client_request_id: { type: string, maxLength: 128 }
        semantic_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        semantic_revision: { type: integer, format: int64, minimum: 1 }
        org_id: { type: integer, format: int64, minimum: 1 }
        project_id: { type: integer, format: int64, minimum: 1 }
        subject: { $ref: "#/components/schemas/AccessSubject" }
        request_kind: { type: string, enum: [human_personal, workload_service] }
        requested_scope: { $ref: "#/components/schemas/AccessEnvelope" }
        environment: { type: string }
        production_use: { type: boolean }
        requested_valid_until: { type: string, format: date-time }
        submission_mode: { type: string, enum: [self, delegated, direct_grant, migration, bootstrap, recovery] }
        sponsor_user_id: { type: integer, format: int64, minimum: 1 }
        target_access_grant_id: { type: integer, format: int64, minimum: 1 }
        expected_grant_revision: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [approved, needs_review, rejected, cancelled] }
        decision_mode: { type: string, enum: [auto_policy, manual, direct, pending, policy_rejection, requester] }
        policy_reason_codes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/AccessPolicyReasonCode" }
        decision_reason_codes:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/AccessDecisionReasonCode" }
        policy_version: { type: string, enum: [unirouter.enterprise-access-policy.v1] }
        submitted_by: { type: integer, format: int64, minimum: 1 }
        decided_by: { type: integer, format: int64, minimum: 1 }
        cancelled_by: { type: integer, format: int64, minimum: 1 }
        submitted_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
        cancelled_at: { type: string, format: date-time }
        revision: { type: integer, format: int64, minimum: 1 }
        actions:
          allOf: [{ $ref: "#/components/schemas/AccessRequestActions" }]
          description: Present on request detail and list projections. Mutation responses may omit it; callers should refresh the authoritative read model.
    AccessRequestActions:
      type: object
      additionalProperties: false
      required: [can_approve, can_reject, can_cancel, reason_code]
      description: Advisory projection derived from the same reason-scoped rules as mutation. Every action still performs commit-time reauthorization and revision validation.
      properties:
        can_approve: { type: boolean }
        can_reject: { type: boolean }
        can_cancel: { type: boolean }
        reason_code: { type: string, enum: [request_terminal, organization_admin_actionable, project_admin_actionable, requester_actionable, organization_admin_required, not_authorized] }
    AccessGrant:
      type: object
      additionalProperties: false
      required: [id, grant_ref, access_request_id, org_id, project_id, subject, scope, environment, production_use, status, revision, valid_from, decision_mode, policy_reason_codes, decision_reason_codes, policy_version, semantic_hash, created_by, updated_by, created_at, updated_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        grant_ref: { type: string, pattern: '^grant_[a-z0-9][a-z0-9_-]{7,65}$' }
        access_request_id: { type: integer, format: int64, minimum: 1 }
        org_id: { type: integer, format: int64, minimum: 1 }
        project_id: { type: integer, format: int64, minimum: 1 }
        subject: { $ref: "#/components/schemas/AccessSubject" }
        scope: { $ref: "#/components/schemas/AccessEnvelope" }
        environment: { type: string }
        production_use: { type: boolean }
        sponsor_user_id: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [active, suspended, revoked] }
        revision: { type: integer, format: int64, minimum: 1 }
        valid_from: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        decision_mode: { type: string, enum: [auto_policy, manual, direct] }
        policy_reason_codes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/AccessPolicyReasonCode" }
        decision_reason_codes:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/AccessDecisionReasonCode" }
        policy_version: { type: string, enum: [unirouter.enterprise-access-policy.v1] }
        semantic_hash: { type: string, pattern: '^[a-f0-9]{64}$' }
        created_by: { type: integer, format: int64, minimum: 1 }
        updated_by: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AccessProvisionResult:
      type: object
      additionalProperties: false
      required: [request, idempotent]
      properties:
        request: { $ref: "#/components/schemas/AccessRequest" }
        grant: { $ref: "#/components/schemas/AccessGrant" }
        idempotent: { type: boolean }
    AccessRequestDetail:
      type: object
      additionalProperties: false
      required: [request, grant]
      properties:
        request: { $ref: "#/components/schemas/AccessRequest" }
        grant:
          allOf: [{ $ref: "#/components/schemas/AccessGrant" }]
          nullable: true
    AccessDecisionInput:
      type: object
      additionalProperties: false
      required: [expected_revision, decision]
      properties:
        expected_revision: { type: integer, format: int64, minimum: 1 }
        decision: { type: string, enum: [approve, reject] }
        reason_codes:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/AccessDecisionReasonCode" }
    AccessRequestCancelInput:
