        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac:
      get: [platform_admin, org_admin, project_admin, project_user]

  /api/v1/access-requests/{ref}/decision:
    post:
      tags: [Admin]
      summary: Approve or reject one needs-review request with optimistic revision control
      description: |
        Decision authority is reason-scoped. Project administrators can decide only the accepted ordinary non-production cases; role elevation, special scope, production, migration ambiguity and mixed exceptions require organization/platform authority. `needs_review` requires an explicit audited decision but does not impose a hard-coded second-person workflow: an authorized submitter may also decide, with `submitted_by` and `decided_by` preserved as evidence. The required client request ID makes a committed decision replayable after response loss.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccessRequestRef"
        - $ref: "#/components/parameters/RequiredClientRequestId"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessDecisionInput" } } }
      responses:
        "200":
          description: Durable decision result or semantic replay
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessProvisionResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac:
      post: [platform_admin, org_admin, project_admin]

  /api/v1/access-requests/{ref}/cancel:
    post:
      tags: [Admin]
      summary: Cancel one still-pending access request
      description: |
        Only a `needs_review` request may be cancelled. The live submitter, or the live sponsor of a workload request, supplies the expected revision and a client request ID. Cancellation creates immutable requester-cancelled evidence but never creates or revokes membership, Grant, or Credential state. A concurrent decision and cancellation serialize on the same request row and exactly one wins. Hidden and absent references are indistinguishable.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccessRequestRef"
        - $ref: "#/components/parameters/RequiredClientRequestId"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequestCancelInput" } } }
      responses:
        "200":
          description: Durable cancellation result or semantic replay
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessRequestCancelResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac:
      post: [platform_admin, org_admin, project_admin, project_user, member]

