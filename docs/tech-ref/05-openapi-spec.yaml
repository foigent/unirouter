  /api/v1/access-grants/{ref}/credentials:
    get:
      tags: [Admin]
      summary: List logical Access Credentials and nested secret versions
      description: The bounded page is keyed by logical Credential family id, so atomic replacement history never consumes separate page slots. It returns no secret. Platform/org/project administrators can inspect project credentials; a project user can inspect only their own human Grant, and the exact live sponsor of a Workload Grant may inspect that Grant's secret-free Credential family/version metadata for accountability. Sponsor visibility never grants issue, rotate, revoke, or secret access. Viewers and billing administrators cannot inspect credential inventory.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccessGrantRef"
        - $ref: "#/components/parameters/AccessPageLimit"
        - $ref: "#/components/parameters/AccessAfterId"
      responses:
        "200":
          description: Bounded logical Credential family page
          content: { application/json: { schema: { $ref: "#/components/schemas/AccessCredentialPage" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [Admin]
      summary: Issue a new logical Credential and its first one-time secret version
      description: Human personal secrets may be issued only by the exact human subject. Workload secrets are managed by authorized project/org/platform administrators. The requested scope can only narrow the live Grant. A replay returns the same metadata with `secret_available=false`; raw secret material is never persisted for replay.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccessGrantRef"
        - $ref: "#/components/parameters/RequiredClientRequestId"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessCredentialIssueInput" } } }
      responses:
        "200": { description: "Secret-free idempotent replay", content: { application/json: { schema: { $ref: "#/components/schemas/AccessCredentialIssueResult" } } } }
        "201": { description: "New Credential with one-time secret", content: { application/json: { schema: { $ref: "#/components/schemas/AccessCredentialIssueResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac:
      get: [platform_admin, org_admin, project_admin, project_user]
      post: [platform_admin, org_admin, project_admin, project_user]

  /api/v1/access-grants/{ref}/credentials/{key_id}/rotate:
    post:
      tags: [Admin]
      summary: Rotate one physical secret version within its immutable logical Credential family
      description: Rotation has no caller-editable scope. Name, IPs, models, endpoints and limits are read from the locked family. The successor is created and the exact predecessor is disabled atomically; after commit the old secret fails immediately and the successor is the sole active version. A lost-response replay returns secret-free successor metadata, and recovery uses a new request ID to rotate that successor again.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccessGrantRef"
        - $ref: "#/components/parameters/AccessCredentialVersionId"
        - $ref: "#/components/parameters/RequiredClientRequestId"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AccessCredentialRotateInput" } } }
      responses:
        "200": { description: "Secret-free idempotent replay", content: { application/json: { schema: { $ref: "#/components/schemas/AccessCredentialRotationResult" } } } }
        "201": { description: "Atomically replaced successor secret version and disabled predecessor metadata", content: { application/json: { schema: { $ref: "#/components/schemas/AccessCredentialRotationResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac: { post: [platform_admin, org_admin, project_admin, project_user] }

  /api/v1/access-grants/{ref}/credentials/{key_id}/revoke:
    post:
      tags: [Admin]
      summary: Permanently revoke a logical Credential family located by one secret version
      description: Revocation disables every active version in the family and returns no secret. Human subjects and project/org/platform administrators may contain a visible family; inaccessible Feed-purpose, foreign and absent locators remain indistinguishable.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AccessGrantRef"
        - $ref: "#/components/parameters/AccessCredentialVersionId"
        - $ref: "#/components/parameters/RequiredClientRequestId"
      responses:
        "200":
          description: Logical Credential family revoked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties: { status: { type: string, enum: [revoked] } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac: { post: [platform_admin, org_admin, project_admin, project_user] }

  /api/v1/model-readiness:
    get:
      tags: [Admin]
      summary: Explain exact canonical deployment-operation or current-project caller readiness without runtime mutation or external traffic
      description: |
        Contract `unirouter.model-readiness.v2`. `mode=connection` requires one canonical `deployment_id` and checks the endpoint-derived exact `model_operation_id`, Gateway License, provider connection, provider credential and current runtime assignment without requiring a project. `channel_id` is forbidden and no legacy Router preview is used. The default `mode=caller` explains the current canonical Planner/application projection and also evaluates the selected project's caller, AccessGrant, API key, model authorization and distributed-limit evidence. It never claims a half-open route lease and sends no Provider, Feed, health-check or upstream request. Unavailable evidence remains `unavailable` rather than being reported as a business blocker. Non-platform responses contain only safe aggregates.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [caller, connection], default: caller }
        - name: project_id
          in: query
          description: Required for mode=caller and forbidden for mode=connection.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: deployment_id
          in: query
          description: Required for mode=connection and omitted for mode=caller. This is the canonical deployment identity; channel_id is rejected.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: model
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
        - name: endpoint
          in: query
          required: true
          schema: { type: string, enum: [/v1/chat/completions, /v1/embeddings, /v1/responses, /v1/messages, /v1/models, /v1/media/jobs] }
        - name: caller
          in: query
          description: Required for mode=caller and forbidden for mode=connection.
          schema: { type: string, enum: [self, workload_application] }
        - name: application_ref
          in: query
          description: Required only for caller=workload_application and scoped to the selected project.
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: Read-only readiness evidence
          content: { application/json: { schema: { $ref: "#/components/schemas/ModelReadinessResponse" } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    x-unirouter-rbac:
      get: [platform_admin, org_admin, org_viewer, project_admin, project_user, project_viewer]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    gatewayKey:
      type: http
      scheme: bearer
      description: UniRouter API key or a signed urc_ Agent capability whose endpoint scope includes the requested model API. Capability calls reserve cost, tokens, rolling rate and concurrency on every signed ancestor before upstream dispatch.
    gatewayRootKey:
      type: http
      scheme: bearer
      description: Long-lived UniRouter API key; Agent capabilities are rejected.
    anthropicGatewayKey:
      type: apiKey
      in: header
      name: x-api-key
      description: UniRouter API key or a scoped urc_ Agent capability for the Anthropic Messages route. Authorization is forbidden and anthropic-version must be supplied separately.
    agentCapability:
      type: http
      scheme: bearer
      bearerFormat: urc_JWT
      description: Five-minute, attenuation-only Agent capability for UniRouter model-gateway authority.
    completedFeedKey:
      type: http
      scheme: bearer
      description: Project-bound, network-bound service key whose exact purpose is xinsight.feed.read. It has no model allowance and is rejected by every non-feed API-key route.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Legacy caller-correlation alias. UniRouter never uses this caller value as the response operation ID or a global financial key.
      schema:
        type: string
        maxLength: 128
    ClientRequestId:
      name: X-UniRouter-Client-Request-ID
      in: header
      required: false
      description: Caller-owned correlation value recorded in operator logs. Do not place secrets or personal data in it. If both this header and legacy X-Request-ID are supplied, they must match.
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Enables 24-hour metadata-only deduplication scoped to organization, API key and canonical request payload. Model responses are not stored or replayed.
      schema:
        type: string
        maxLength: 255
    AnthropicVersion:
      name: anthropic-version
      in: header
      required: true
      description: Exact supported Anthropic Messages protocol version. Multiple values, comma-joined values, other versions, and anthropic-beta are rejected before database access.
      schema:
        type: string
        enum: [2023-06-01]
    ModelDeploymentReleaseRef:
      name: releaseRef
      in: path
      required: true
      description: Globally unique canonical v2 release reference; the server still applies exact customer-organization ownership before returning any fact.
      schema:
        type: string
        pattern: '^rcr_[a-z0-9][a-z0-9._-]{2,63}$'
    ModelDeploymentLifecycleIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Durable, non-expiring lifecycle mutation identity scoped to the customer organization, actor and lifecycle action. Only a keyed digest is stored; an exact normalized replay in the same action scope returns the frozen receipt and another payload in that same scope returns 409. The same key may be used independently for another lifecycle action.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ModelDeploymentReleaseAuthoringIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Durable, non-expiring atomic release-authoring identity scoped to the customer organization and actor. Only a keyed digest is stored. A later operation with the exact normalized payload returns the frozen original receipt as HTTP 200 while preserving original_http_status 201 and Location; another normalized payload under the same scope returns 409. Commit-ACK recovery inside the same server operation is not labelled as a later replay.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ResponseCacheOptIn:
      name: X-UniRouter-Response-Cache
      in: header
      required: false
      description: Exact case-insensitive value `allow` opts this request into an otherwise eligible, policy-assigned Exact Response Cache canary. Omission never enables cache reads or writes.
      schema:
        type: string
        enum: [allow]
    PromptCompressionOptIn:
      name: X-UniRouter-Prompt-Compression
      in: header
      required: false
      description: Exact case-insensitive value `allow` permits a policy-assigned Compression canary to apply the reviewed whitespace-only candidate. Shadow never mutates the request.
      schema:
        type: string
        enum: [allow]
    RequestCacheControl:
      name: Cache-Control
      in: header
      required: false
      description: A `no-store` directive always bypasses Exact Response Cache persistence and lookup. `no-cache` alone does not opt in or opt out.
      schema:
        type: string
    InvocationOptimizationPolicyRef:
      name: ref
      in: path
      required: true
      schema:
        type: string
        pattern: '^opt_[a-z0-9][a-z0-9._-]{2,59}$'
    LegacyRuntimeChangeRef:
      name: ref
      in: path
      required: true
      description: Immutable legacy runtime release reference retained for read-only history and retired-route compatibility.
      schema:
        type: string
        pattern: '^rcr_[a-z0-9][a-z0-9._-]{2,63}$'
    MediaJobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^mediajob_[a-f0-9]{32}$'
    ProjectId:
      name: project_id
      in: query
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    OrgId:
      name: org_id
      in: query
      required: false
      description: Platform administrators use this to bind the selected project's organization. Other roles remain bound to their authenticated organization.
      schema:
        type: integer
        format: int64
        minimum: 1
    AccessPageLimit:
      name: limit
      in: query
      required: false
      description: Maximum rows in this descending-id keyset page. The server fetches one extra row only to compute has_more; it never silently truncates an unpageable list.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    AccessAfterId:
      name: after_id
      in: query
      required: false
      description: Exclusive stable database id cursor copied from pagination.next_after_id. Results remain ordered by id descending.
      schema:
        type: integer
        format: int64
        minimum: 1
    AccessRequestRef:
      name: ref
      in: path
      required: true
      schema:
        type: string
        pattern: '^req_[a-z0-9][a-z0-9_-]{7,67}$'
    AccessGrantRef:
      name: ref
      in: path
      required: true
      schema:
        type: string
        pattern: '^grant_[a-z0-9][a-z0-9_-]{7,65}$'
    AccessCredentialVersionId:
      name: key_id
      in: path
      required: true
      description: Physical one-time secret version locator. Authorization, scope and quota identity remain bound to its logical Access Credential family.
      schema:
        type: integer
        format: int64
        minimum: 1
    RequiredClientRequestId:
      name: X-UniRouter-Client-Request-ID
      in: header
      required: true
      description: Actor-scoped durable operation key. Identical business intent replays the committed secret-free result; different intent under the same value returns 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'

  headers:
    OperationId:
      description: Server-generated operation identity used across gateway, billing, audit and route attempts.
      schema:
        type: string
        pattern: '^op_[0-9a-f]{32}$'
    ClientRequestId:
      description: Echo of the accepted caller correlation value, when supplied.
      schema:
        type: string
        maxLength: 128
    LimitPolicyVersion:
      description: Sanitized fingerprint of the effective shared limit and workload-admission configuration.
      schema:
        type: string
    WorkloadClass:
      description: Server-derived admission class for the model invocation.
      schema:
        type: string
        enum: [interactive, stream, embedding]
    ResponseCacheOutcome:
      description: Present only when an applicable Exact Response Cache policy was evaluated. HIT served a current zero-token/zero-charge local delivery; MISS owns an upstream fill; BYPASS made no cache read/write claim.
      schema:
        type: string
        enum: [HIT, MISS, BYPASS]
    PromptCompressionOutcome:
      description: SHADOW and CANARY expose the effective policy stage without claiming mutation; only APPLIED means the current request body used the reviewed whitespace-only candidate.
      schema:
        type: string
        enum: [SHADOW, CANARY, APPLIED]

  responses:
    JSON:
      description: JSON response
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    LegacyModelMutationRetired:
      description: Legacy model mutation ingress is permanently retired after authentication and platform RBAC.
      headers:
        Cache-Control:
          description: Always `no-store`.
          schema: { type: string, enum: [no-store] }
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                type: object
                additionalProperties: false
                required: [type, code, message]
                properties:
                  type: { type: string, enum: [gone_error] }
                  code: { type: string, enum: [legacy_model_mutation_retired] }
                  message: { type: string }
    RateLimited:
      description: A request, token, concurrency, or weighted workload limit was reached.
      headers:
        Retry-After:
          description: Whole seconds before the caller should retry.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdempotencyConflict:
      description: The key is in progress, completed, failed, or bound to a different request. Scheme A returns metadata only and never replays the model response.
      headers:
        X-UniRouter-Original-Request-ID:
          description: Server operation ID of the original request that owns the idempotency key.
          schema:
            type: string
        Retry-After:
          description: Present for an in-progress request.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PublicOpenAIError:
      description: Topology-neutral OpenAI-family public execution error. Provider identity, URL, status, and response body are never exposed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicOpenAIErrorEnvelope"
    PublicOpenAIRetryableError:
      description: Retryable topology-neutral OpenAI-family public execution error.
      headers:
        Retry-After:
          description: Whole seconds before retry.
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicOpenAIErrorEnvelope"
    PublicOpenAIRateLimited:
      description: OpenAI-family public request or workload rate limit.
      headers:
        Retry-After:
          description: Whole seconds before retry.
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicOpenAIErrorEnvelope"
    PublicOpenAIIdempotencyConflict:
      description: Metadata-only at-most-once conflict. The original model response is never stored or replayed.
      headers:
        X-UniRouter-Original-Request-ID:
          description: Original server operation ID that owns the key.
          schema: { type: string }
        Retry-After:
          description: Present only while the original request is in progress.
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicOpenAIIdempotencyConflictEnvelope"
    PublicAnthropicError:
      description: Topology-neutral Anthropic error. Provider identity, URL, status, and response body are never exposed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicAnthropicErrorEnvelope"
    PublicAnthropicRetryableError:
      description: Retryable topology-neutral Anthropic error.
      headers:
        Retry-After:
          description: Whole seconds before retry.
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicAnthropicErrorEnvelope"
    PublicAnthropicRateLimited:
      description: Anthropic public request or workload rate limit.
      headers:
        Retry-After:
          description: Whole seconds before retry.
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicAnthropicErrorEnvelope"
    PublicAnthropicIdempotencyConflict:
      description: Metadata-only at-most-once conflict. The original model response is never stored or replayed.
      headers:
        X-UniRouter-Original-Request-ID:
          description: Original server operation ID that owns the key.
          schema: { type: string }
        Retry-After:
          description: Present only while the original request is in progress.
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicAnthropicErrorEnvelope"
    CompletedExecutionFeedError:
      description: Bounded completed-execution feed error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompletedExecutionFeedError"

  schemas:
    ModelDeploymentReleaseBaseline:
      type: object
      additionalProperties: false
      description: Exact server-derived optimistic baseline. `initial` requires expected_slot_version 0 and no stable fields. `stable` and `legacy_cutover` require a positive slot version, stable release reference and stable release version. Clients echo this object from the collection and never construct it.
      required: [kind, expected_slot_version]
      properties:
        kind: { type: string, enum: [initial, stable, legacy_cutover] }
        expected_slot_version: { type: integer, format: int64, minimum: 0 }
        stable_release_ref: { type: string, pattern: '^rcr_[a-z0-9][a-z0-9._-]{2,63}$' }
        expected_stable_release_version: { type: integer, format: int64, minimum: 1 }
    ModelDeploymentReleaseSelection:
      type: object
      additionalProperties: false
      required: [deployment_id, operation_id]
      properties:
        deployment_id: { type: integer, format: int64, minimum: 1 }
        operation_id:
          type: string
          enum: [openai.chat_completions.v1, openai.embeddings.v1, openai.responses.v1, anthropic.messages.v1]
    ModelDeploymentReleaseAuthoringRequest:
      type: object
      additionalProperties: false
      description: Complete caller-owned authoring payload. Every baseline and selection must come from the latest collection response. The server derives all revisions, profiles, paths, public bindings, hashes, parent identities and the release reference. Authoring does not activate the result.
      required: [public_model_id, baseline, selections, reason]
      properties:
        public_model_id: { type: integer, format: int64, minimum: 1 }
        baseline: { $ref: "#/components/schemas/ModelDeploymentReleaseBaseline" }
        selections:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items: { $ref: "#/components/schemas/ModelDeploymentReleaseSelection" }
        reason: { type: string, minLength: 1, maxLength: 500, pattern: '^[^\x00\r\n]+$' }
    ModelDeploymentReleasePublicModelSummary:
      type: object
      additionalProperties: false
      required: [id, model_name, display_name, lifecycle]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        model_name: { type: string }
        display_name: { type: string }
        lifecycle: { type: string }
    ModelDeploymentReleaseSelectionOption:
      type: object
      additionalProperties: false
      description: Tenant-scoped operation that may be selected for authoring. Responses and Messages appear only when their exact current structural qualification exists.
      required: [deployment_id, operation_id]
      properties:
        deployment_id: { type: integer, format: int64, minimum: 1 }
        operation_id: { type: string, enum: [openai.chat_completions.v1, openai.embeddings.v1, openai.responses.v1, anthropic.messages.v1] }
        upstream_model: { type: string }
        connection_name: { type: string }
    ModelDeploymentReleaseSummary:
      type: object
      additionalProperties: false
      description: Bounded release index/parent projection. It may identify a sealed v1 compatibility parent or canonical v2 release; immutable candidate detail remains on the exact v2 release endpoint.
      required: [id, release_ref, public_model_id, model_name, candidate_version, candidate_hash, route_items_hash, route_items_count, stage, version, updated_at]
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        release_ref: { type: string, pattern: '^rcr_[a-z0-9][a-z0-9._-]{2,63}$' }
        public_model_id: { type: integer, format: int64, minimum: 1 }
        model_name: { type: string }
        execution_profile_id: { type: string, description: "M82 sealed execution profile. Present for canonical v2 releases and absent for historical v1 compatibility parents." }
        execution_profile_version: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
        public_context_limit: { type: integer, minimum: 1, description: "Release-pinned customer-visible context upper bound; runtime safety may narrow it." }
        public_output_limit: { type: integer, minimum: 1, description: "Release-pinned customer-visible output upper bound; runtime safety may narrow it." }
        candidate_version: { type: string, enum: [unirouter.runtime-change-candidate.v1, unirouter.runtime-change-candidate.v2] }
        candidate_hash: { type: string }
        route_items_hash: { type: string }
        route_items_count: { type: integer, minimum: 0 }
        route_items_sealed_at: { type: string, format: date-time }
        stage: { type: string, enum: [validated, canary, active, rolled_back] }
        version: { type: integer, format: int64, minimum: 1 }
        parent_stable_release_id: { type: integer, format: int64, minimum: 1 }
        updated_at: { type: string, format: date-time }
    ModelDeploymentReleaseAuthoringDescriptor:
      type: object
      additionalProperties: false
      description: Server-owned authoring preflight for one public model. Available means the current caller may submit the displayed baseline now; POST still revalidates under locks.
      required: [available, reason_code, structurally_available, authorized, licensed, license_feature, method, path, idempotency_required, required_fields, slot]
      properties:
        available: { type: boolean }
        reason_code: { type: string }
        structurally_available: { type: boolean }
        authorized: { type: boolean }
        licensed: { type: boolean }
        license_feature: { type: string, enum: [gateway] }
        method: { type: string, enum: [POST] }
        path: { type: string, enum: [/api/v1/model-deployment-releases] }
        idempotency_required: { type: boolean, enum: [true] }
        required_fields:
          type: array
          minItems: 4
          maxItems: 4
          uniqueItems: true
          items: { type: string, enum: [public_model_id, baseline, selections, reason] }
        baseline:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ModelDeploymentReleaseBaseline" }]
        slot: { $ref: "#/components/schemas/ModelDeploymentLifecycleSlotState" }
        stable_release:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ModelDeploymentReleaseSummary" }]
    ModelDeploymentReleaseAuthoringModelView:
      type: object
      additionalProperties: false
      required: [public_model, authoring, selection_options]
      properties:
        public_model: { $ref: "#/components/schemas/ModelDeploymentReleasePublicModelSummary" }
        authoring: { $ref: "#/components/schemas/ModelDeploymentReleaseAuthoringDescriptor" }
        selection_options:
          type: array
          items: { $ref: "#/components/schemas/ModelDeploymentReleaseSelectionOption" }
    ModelDeploymentReleaseCollectionView:
      type: object
      additionalProperties: false
      required: [contract_version, generated_at, models, releases]
      properties:
        contract_version: { type: string, enum: [unirouter.model-deployment-release-authoring-options.v1] }
        generated_at: { type: string, format: date-time }
        models:
          type: array
          items: { $ref: "#/components/schemas/ModelDeploymentReleaseAuthoringModelView" }
        releases:
          type: array
          items: { $ref: "#/components/schemas/ModelDeploymentReleaseSummary" }
    ModelDeploymentReleaseAuthoringReceipt:
      type: object
      additionalProperties: false
      description: Immutable result of the atomic draft-to-validated command. Same-operation commit-ACK recovery keeps idempotency_replay false; only a later operation observing the winner sets it true. Its versioned v1 release body intentionally omits the M82 execution pins; refresh the exact release/lifecycle projection to inspect those facts without changing historical replay bytes.
      required: [contract_version, receipt_id, customer_org_id, server_operation_id, original_http_status, original_location, idempotency_replay, baseline, selections, release, created_at, completed_at]
      properties:
        contract_version: { type: string, enum: [unirouter.model-deployment-release-authoring-receipt.v1] }
        receipt_id: { type: integer, format: int64, minimum: 1 }
        customer_org_id: { type: integer, format: int64, minimum: 1 }
        actor_user_id: { type: integer, format: int64, minimum: 1 }
        server_operation_id: { type: string, maxLength: 80 }
        original_http_status: { type: integer, enum: [201] }
        original_location: { type: string, pattern: '^/api/v1/model-deployment-releases/rcr_[a-z0-9][a-z0-9._-]{2,63}$' }
        idempotency_replay: { type: boolean }
        baseline: { $ref: "#/components/schemas/ModelDeploymentReleaseBaseline" }
        selections:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/ModelDeploymentReleaseSelection" }
        release: { $ref: "#/components/schemas/ModelDeploymentLifecycleRelease" }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    ModelDeploymentLifecycleActivateInitialRequest:
      type: object
      additionalProperties: false
      required: [expected_release_version]
      properties:
        expected_release_version: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, maxLength: 1000, pattern: '^[^\x00\r\n]*$' }
    ModelDeploymentLifecycleSlotRequest:
      type: object
      additionalProperties: false
      required: [expected_release_version, expected_slot_version]
      properties:
        expected_release_version: { type: integer, format: int64, minimum: 1 }
        expected_slot_version: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, maxLength: 1000, pattern: '^[^\x00\r\n]*$' }
    ModelDeploymentLifecycleStartCanaryRequest:
      type: object
      additionalProperties: false
      required: [expected_release_version, expected_slot_version, canary_basis_points]
      properties:
        expected_release_version: { type: integer, format: int64, minimum: 1 }
        expected_slot_version: { type: integer, format: int64, minimum: 1 }
        canary_basis_points: { type: integer, minimum: 1, maximum: 5000 }
        reason: { type: string, maxLength: 1000, pattern: '^[^\x00\r\n]*$' }
    ModelDeploymentLegacyLifecycleRequest:
      type: object
      additionalProperties: false
      required: [expected_release_version, expected_slot_version, reason]
      properties:
        expected_release_version: { type: integer, format: int64, minimum: 1 }
        expected_slot_version: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 1, maxLength: 1000, pattern: '^[^\x00\r\n]+$' }
    ModelDeploymentLifecycleRoute:
