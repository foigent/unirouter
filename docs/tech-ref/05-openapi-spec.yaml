openapi: 3.0.3
info:
  title: UniRoute API
  version: 1.0.0
  description: |
    Current UniRouter API contract snapshot for active backend routes.

    Route source: `cmd/uniroute/*.go` (including extracted route registrars).
    Route parity guard: `cmd/uniroute/route_parity_test.go`.

    Authentication:
    - Gateway: `Authorization: Bearer ur-XXXX-...`
    - Admin: `Authorization: Bearer <JWT>`

    Request identity:
    - Response `X-Request-ID` is a server-generated operation ID and cannot be overridden by a caller.
    - Caller correlation belongs in `X-UniRouter-Client-Request-ID`; inbound `X-Request-ID` remains a legacy alias only.
    - `Idempotency-Key` enables tenant/API-key/payload-bound metadata-only deduplication for Chat and Embeddings.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Gateway
  - name: Auth
  - name: Admin
  - name: Health
  - name: Observability

paths:
  /:
    get:
      tags: [Health]
      summary: Service metadata
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /docs:
    get:
      tags: [Admin]
      summary: Backend API documentation index
      responses:
        "200":
          description: HTML API contract index
          content:
            text/html:
              schema:
                type: string

  /health/live:
    get:
      tags: [Health]
      summary: Liveness check
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "503":
          $ref: "#/components/responses/JSON"

  /metrics:
    get:
      tags: [Observability]
      summary: Prometheus metrics (runtime-configurable)
      responses:
        "200":
          description: Prometheus metrics text format
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Metrics are disabled or hidden by metrics access policy

  /v1/chat/completions:
    post:
      tags: [Gateway]
      summary: OpenAI-compatible chat completions
      security:
        - gatewayKey: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/ClientRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion or SSE stream
          headers:
            X-Request-ID:
              $ref: "#/components/headers/OperationId"
            X-UniRouter-Client-Request-ID:
              $ref: "#/components/headers/ClientRequestId"
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"

  /v1/embeddings:
    post:
      tags: [Gateway]
      summary: OpenAI-compatible embeddings
      security:
        - gatewayKey: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/ClientRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model:
                  type: string
                input:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                encoding_format:
                  type: string
                  enum: [float, base64]
      responses:
        "200":
          description: Embedding response
          headers:
            X-Request-ID:
              $ref: "#/components/headers/OperationId"
            X-UniRouter-Client-Request-ID:
              $ref: "#/components/headers/ClientRequestId"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "502":
          $ref: "#/components/responses/Error"

  /v1/models:
    get:
      tags: [Gateway]
      summary: OpenAI-compatible model list
      security:
        - gatewayKey: []
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/oidc/config:
    get:
      tags: [Auth]
      summary: OIDC public login configuration
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/auth/oidc/start:
    get:
      tags: [Auth]
      summary: Start OIDC login flow
      responses:
        "302":
          description: Redirects to the configured OIDC identity provider
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/auth/oidc/callback:
    get:
      tags: [Auth]
      summary: OIDC callback
      responses:
        "302":
          description: Redirects to the frontend after successful browser login
        "200":
          $ref: "#/components/responses/JSON"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/me:
    get:
      tags: [Admin]
      summary: Current admin user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/me/password:
    put:
      tags: [Admin]
      summary: Change current admin user password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
                  minLength: 6
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/channels:
    get: { $ref: "#/components/pathItems/ListChannels" }
    post: { $ref: "#/components/pathItems/CreateChannel" }

  /api/v1/channels/{id}:
    get: { $ref: "#/components/pathItems/GetById" }
    put: { $ref: "#/components/pathItems/UpdateById" }
    delete: { $ref: "#/components/pathItems/DeleteById" }

  /api/v1/channels/{id}/test:
    post:
      tags: [Admin]
      summary: Test channel connectivity
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/keys:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/keys/{id}:
    get: { $ref: "#/components/pathItems/GetById" }
    put: { $ref: "#/components/pathItems/UpdateById" }

  /api/v1/keys/{id}/disable:
    post:
      tags: [Admin]
      summary: Disable API key
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/projects:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/projects/{id}:
    get: { $ref: "#/components/pathItems/GetById" }
    put: { $ref: "#/components/pathItems/UpdateById" }

  /api/v1/projects/{id}/model-sets:
    get: { $ref: "#/components/pathItems/ListById" }
    put: { $ref: "#/components/pathItems/UpdateById" }

  /api/v1/channel-keys:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/channel-keys/{id}:
    put: { $ref: "#/components/pathItems/UpdateById" }
    delete: { $ref: "#/components/pathItems/DeleteById" }

  /api/v1/wallet:
    get: { $ref: "#/components/pathItems/Get" }

  /api/v1/wallet/topup:
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/wallet/adjust:
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/wallet/transactions:
    get: { $ref: "#/components/pathItems/List" }

  /api/v1/wallet/transactions/export:
    get:
      tags: [Admin]
      summary: Export wallet transactions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Export file or JSON payload

  /api/v1/logs:
    get:
      tags: [Admin]
      summary: Tenant-scoped call logs with operation and correlation filters
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: request_id, in: query, schema: { type: string }, description: Exact server operation ID }
        - { name: client_request_id, in: query, schema: { type: string }, description: Exact caller correlation ID }
        - { name: trace_id, in: query, schema: { type: string }, description: Exact trace ID }
        - { name: workflow_id, in: query, schema: { type: string }, description: Exact trusted workflow ID }
        - { name: agent_id, in: query, schema: { type: string }, description: Exact trusted Agent ID }
        - { name: attempt_id, in: query, schema: { type: string }, description: Exact provider-attempt ID }
        - { name: upstream_request_id, in: query, schema: { type: string }, description: Exact provider request ID }
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/logs/{id}:
    get: { $ref: "#/components/pathItems/GetById" }

  /api/v1/logs/{id}/trace:
    get:
      tags: [Admin]
      summary: Request trace events for a call log
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/data-exchange/items:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/data-exchange/items/{id}:
    put: { $ref: "#/components/pathItems/UpdateById" }

  /api/v1/data-exchange/exchanges:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/data-exchange/exchanges/{id}/activity:
    get: { $ref: "#/components/pathItems/GetById" }

  /api/v1/data-exchange/exchanges/{id}/deliveries:
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/data-exchange/exchanges/{id}/receipts:
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/data-exchange/exchanges/{id}/artifact-delete:
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/dashboard/stats:
    get: { $ref: "#/components/pathItems/Get" }

  /api/v1/usage/analytics:
    get:
      tags: [Admin]
      summary: Usage analytics aggregation and CSV export
      security:
        - bearerAuth: []
      parameters:
        - name: group_by
          in: query
          schema:
            type: string
            enum: [overall, project, key, model, alias, provider, channel, status, usage_source]
        - name: format
          in: query
          schema:
            type: string
            enum: [csv]
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/internal-status:
    get:
      tags: [Admin]
      summary: Event-derived internal status
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/runtime/status:
    get:
      tags: [Admin]
      summary: Runtime environment, capacity, and external monitoring status
      description: Returns runtime metadata, dependency/capacity health, traffic summary, Prometheus/Grafana integration states, and effective-config.v1. The typed registry includes the versioned startup routing policy (retry, circuit, half-open probe, cooldown, and provider-key failure thresholds) plus the active project-scoped budget-alert contract. It contains no credential or webhook values; route-decision traces record the same configuration version and routing scalars.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/error-docs:
    get:
      tags: [Admin]
      summary: Error documentation registry
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/model-prices:
    x-unirouter-rbac:
      get: [platform_admin, org_admin]
      post: [platform_admin]
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/model-prices/{id}:
    x-unirouter-rbac:
      put: [platform_admin]
      delete: [platform_admin]
    put: { $ref: "#/components/pathItems/UpdateById" }
    delete: { $ref: "#/components/pathItems/DeleteById" }

  /api/v1/model-names:
    get: { $ref: "#/components/pathItems/Get" }

  /api/v1/model-registry:
    x-unirouter-rbac:
      get: [platform_admin, org_admin]
      post: [platform_admin, org_admin]
    description: |
      Organization-scoped model registry. Organization administrators always use the
      organization in their JWT; a foreign org_id query or request-body value returns
      403, and a missing/zero JWT organization fails closed. Platform administrators
      (including the normalized legacy admin role) may explicitly select a positive
      org_id; otherwise their positive JWT organization is used. No organization is
      selected by database order or a hard-coded fallback.
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/model-registry/{id}:
    x-unirouter-rbac:
      put: [platform_admin, org_admin]
    description: |
      Organization-scoped global-ID mutation. Organization administrators are bound to
      their JWT organization; a foreign org_id query returns 403, while a foreign or
      nonexistent record ID returns 404 without revealing which case occurred. A
      platform administrator (including normalized legacy admin) may select org_id in
      the query; when omitted, the existing record supplies the explicit target
      organization. A missing/zero tenant JWT organization fails closed.
    put: { $ref: "#/components/pathItems/UpdateById" }

  /api/v1/model-catalog:
    x-unirouter-rbac:
      get: [platform_admin, org_admin, project_admin, developer, viewer]
    description: |
      Organization-scoped approved catalog. Organization administrators are bound to
      their JWT organization and platform administrators (including normalized legacy
      admin) may explicitly select org_id. When project_id is present, the project's
      organization is canonical and any explicit org_id mismatch is rejected. Project-
      scoped roles must provide project_id and have membership in that project. Foreign
      organization selection returns 403; missing/zero tenant organization fails closed.
    get: { $ref: "#/components/pathItems/List" }

  /api/v1/model-aliases:
    x-unirouter-rbac:
      get: [platform_admin, org_admin]
      post: [platform_admin, org_admin]
    description: |
      Organization-scoped model aliases. Organization administrators always use their
      JWT organization; a foreign org_id query or request-body value returns 403, and a
      missing/zero JWT organization fails closed. Platform administrators (including
      normalized legacy admin) may explicitly select a positive org_id; otherwise their
      positive JWT organization is used. No implicit organization fallback is used.
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/model-aliases/{id}:
    x-unirouter-rbac:
      put: [platform_admin, org_admin]
    description: |
      Organization-scoped global-ID mutation. Organization administrators are bound to
      their JWT organization; a foreign org_id query returns 403, while a foreign or
      nonexistent record ID returns 404 without revealing which case occurred. A
      platform administrator (including normalized legacy admin) may select org_id in
      the query; when omitted, the existing record supplies the explicit target
      organization. A missing/zero tenant JWT organization fails closed.
    put: { $ref: "#/components/pathItems/UpdateById" }

  /api/v1/model-sets:
    x-unirouter-rbac:
      get: [platform_admin, org_admin]
      post: [platform_admin, org_admin]
    description: |
      Organization-scoped model sets. Organization administrators always use their JWT
      organization; a foreign org_id query or request-body value returns 403, and a
      missing/zero JWT organization fails closed. Platform administrators (including
      normalized legacy admin) may explicitly select a positive org_id; otherwise their
      positive JWT organization is used. Creating a set and all of its initial items is
      one transaction: either the whole model set is committed or none of it is.
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/model-sets/{id}/items:
    x-unirouter-rbac:
      get: [platform_admin, org_admin]
      put: [platform_admin, org_admin]
    description: |
      Organization-scoped global-ID access. Organization administrators are bound to
      their JWT organization; a foreign org_id query returns 403, while a foreign or
      nonexistent set ID returns 404 without revealing which case occurred. A platform
      administrator (including normalized legacy admin) may select org_id in the query;
      when omitted, the existing model set supplies the explicit target organization.
      Replacing items is atomic: readers see either the old complete set or the new
      complete set, never a partial replacement. Missing/zero tenant JWT organization
      fails closed.
    get: { $ref: "#/components/pathItems/ListById" }
    put: { $ref: "#/components/pathItems/UpdateById" }

  /api/v1/org-model-prices:
    x-unirouter-rbac:
      get: [platform_admin, org_admin]
      post: [platform_admin]
    description: Organization administrators read only their JWT organization; platform administrators may select an explicit org_id.
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/org-model-prices/{id}:
    x-unirouter-rbac:
      put: [platform_admin]
      delete: [platform_admin]
    put: { $ref: "#/components/pathItems/UpdateById" }
    delete: { $ref: "#/components/pathItems/DeleteById" }

  /api/v1/reconciliation:
    get: { $ref: "#/components/pathItems/List" }

  /api/v1/users:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/users/{id}:
    put: { $ref: "#/components/pathItems/UpdateById" }
    delete: { $ref: "#/components/pathItems/DeleteById" }

  /api/v1/grants:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/notification-events:
    get: { $ref: "#/components/pathItems/List" }

  /api/v1/notification-deliveries:
    get: { $ref: "#/components/pathItems/List" }

  /api/v1/notification-webhooks:
    get: { $ref: "#/components/pathItems/List" }
    post: { $ref: "#/components/pathItems/Create" }

  /api/v1/notification-webhooks/{id}:
    put: { $ref: "#/components/pathItems/UpdateById" }

  /api/v1/notification-webhooks/{id}/verify-scope:
    post: { $ref: "#/components/pathItems/UpdateById" }

  /api/v1/audit-logs:
    get:
      tags: [Admin]
      summary: Tenant-scoped control-plane audit log
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - { name: request_id, in: query, schema: { type: string }, description: Exact server operation ID }
        - { name: client_request_id, in: query, schema: { type: string }, description: Exact caller correlation ID }
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/settings:
    x-unirouter-rbac:
      get: [platform_admin]
    description: Deployment-wide settings. Dedicated license and sensitive-word values are redacted. Retired global budget-alert keys are marked retired/effective=false with their project and notification API replacements; their historical values have no runtime effect.
    get: { $ref: "#/components/pathItems/List" }

  /api/v1/settings/{key}:
    x-unirouter-rbac:
      put: [platform_admin]
    description: Deployment-wide setting update. license.* and sensitive_words must use their dedicated endpoints. Retired budget_alert_webhook_url, budget_alert_threshold_cents, and budget_cents keys return 409 and direct callers to project budgets and tenant-scoped notification webhooks.
    put:
      tags: [Admin]
      summary: Update setting
      security:
        - bearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  nullable: true
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/license:
    x-unirouter-rbac:
      get: [platform_admin]
      put: [platform_admin]
    get: { $ref: "#/components/pathItems/Get" }
    put:
      tags: [Admin]
      summary: Import offline license
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license]
              properties:
                license:
                  oneOf:
                    - type: object
                    - type: string
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/sensitive-words:
    x-unirouter-rbac:
      get: [platform_admin]
      post: [platform_admin]
      put: [platform_admin]
      delete: [platform_admin]
    description: Deployment-wide input blocking word list. The handling instance reloads after commit; other instances converge through the existing periodic reload.
    get: { $ref: "#/components/pathItems/List" }
    post:
      tags: [Admin]
      summary: Add sensitive words
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensitiveWordsMutation"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    put:
      tags: [Admin]
      summary: Replace sensitive words
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensitiveWordsMutation"
      responses:
        "200":
          $ref: "#/components/responses/JSON"
    delete:
      tags: [Admin]
      summary: Delete sensitive words
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensitiveWordsMutation"
      responses:
        "200":
          $ref: "#/components/responses/JSON"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    gatewayKey:
      type: http
      scheme: bearer

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Legacy caller-correlation alias. UniRouter never uses this caller value as the response operation ID or a global financial key.
      schema:
        type: string
        maxLength: 128
    ClientRequestId:
      name: X-UniRouter-Client-Request-ID
      in: header
      required: false
      description: Caller-owned correlation value recorded in operator logs. Do not place secrets or personal data in it. If both this header and legacy X-Request-ID are supplied, they must match.
      schema:
        type: string
        maxLength: 128
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Enables 24-hour metadata-only deduplication scoped to organization, API key and canonical request payload. Model responses are not stored or replayed.
      schema:
        type: string
        maxLength: 255

  headers:
    OperationId:
      description: Server-generated operation identity used across gateway, billing, audit and route attempts.
      schema:
        type: string
        pattern: '^op_[0-9a-f]{32}$'
    ClientRequestId:
      description: Echo of the accepted caller correlation value, when supplied.
      schema:
        type: string
        maxLength: 128

  responses:
    JSON:
      description: JSON response
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdempotencyConflict:
      description: The key is in progress, completed, failed, or bound to a different request. Scheme A returns metadata only and never replays the model response.
      headers:
        X-UniRouter-Original-Request-ID:
          description: Server operation ID of the original request that owns the idempotency key.
          schema:
            type: string
        Retry-After:
          description: Present for an in-progress request.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

