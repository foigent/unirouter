        token_format: ur-xf1-hex256.v1
        verifier_scheme: receiver_sha256_v1
        key_prefix: ur-xf1-0000000000000
        verifier_sha256: d14985e8cedc38985529b846e34f152448401b2b2e5e28db0f64bd8727c1ff07
        operation_id: 00000000000000000000000000000000
      required: [schema_version, token_format, verifier_scheme, key_prefix, verifier_sha256, operation_id]
      properties:
        schema_version:
          type: string
          enum: [unirouter.xinsight.feed-credential-registration.v1]
        token_format:
          type: string
          enum: [ur-xf1-hex256.v1]
        verifier_scheme:
          type: string
          enum: [receiver_sha256_v1]
        key_prefix:
          type: string
          pattern: '^ur-xf1-[0-9a-f]{13}$'
        verifier_sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        operation_id:
          type: string
          pattern: '^[0-9a-f]{32}$'
    XInsightStagedCredentialReference:
      type: object
      additionalProperties: false
      required: [staged_credential_id]
      properties:
        staged_credential_id: { type: integer, format: int64, minimum: 1 }
    CompletedExecutionFeedPage:
      type: object
      additionalProperties: false
      required: [schema_version, source_instance, generated_at, items, next_cursor, high_watermark, has_more]
      properties:
        schema_version:
          type: string
          enum: [xinsight.completed-execution-feed.v1]
        source_instance:
          type: string
          minLength: 1
          maxLength: 128
        generated_at:
          type: string
          format: date-time
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/CompletedExecutionFeedItem"
        next_cursor:
          type: string
          maxLength: 512
        high_watermark:
          type: string
          maxLength: 512
        has_more:
          type: boolean
    CompletedExecutionFeedItem:
      type: object
      additionalProperties: false
      required: [request_id, terminal_available_at, revision, timeline_complete, snapshot_sha256, snapshot]
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 64
        terminal_available_at:
          type: string
          format: date-time
        revision:
          type: string
          enum: ["1"]
        timeline_complete:
          type: boolean
          enum: [true]
        snapshot_sha256:
          type: string
          pattern: '^sha256:[a-f0-9]{64}$'
        snapshot:
          $ref: "#/components/schemas/CompletedExecutionSnapshot"
    CompletedExecutionSnapshot:
      type: object
      additionalProperties: false
      required: [schema_version, request_id, org_id, project_id, terminal, usage, money, capture_gaps]
      properties:
        schema_version:
          type: string
          enum: [unirouter.completed-execution.v1]
        request_id:
          type: string
          minLength: 1
          maxLength: 64
        org_id:
          type: integer
          format: int64
          minimum: 1
        project_id:
          type: integer
          format: int64
          minimum: 1
        terminal:
          type: object
          additionalProperties: false
          required: [status, available_at]
          properties:
            status:
              type: string
              enum: [settled, cancelled]
            available_at:
              type: string
              format: date-time
        usage:
          type: object
          additionalProperties: false
          required: [model, prompt_tokens, uncached_prompt_tokens, cache_read_tokens, cache_creation_tokens, completion_tokens, source, authority, purpose, finality, contract_version, cache_usage_schema, cache_usage_status]
          properties:
            model: { type: string, minLength: 1, maxLength: 100 }
            prompt_tokens: { type: integer, minimum: 0 }
            uncached_prompt_tokens: { type: integer, minimum: 0 }
            cache_read_tokens: { type: integer, minimum: 0 }
            cache_creation_tokens: { type: integer, minimum: 0 }
            completion_tokens: { type: integer, minimum: 0 }
            source: { type: string, maxLength: 32 }
            authority: { type: string, maxLength: 64 }
            purpose: { type: string, maxLength: 64 }
            finality: { type: string, maxLength: 64 }
            contract_version: { type: string, maxLength: 80 }
            estimate_version: { type: string, maxLength: 80 }
            cache_usage_schema: { type: string, maxLength: 80 }
            cache_usage_status: { type: string, maxLength: 40 }
        money:
          type: object
          additionalProperties: false
          required: [schema, currency, amount_scale, calculated_cost_micros, charged_cost_micros, pricing_version]
          properties:
            schema: { type: string, enum: [micro-cny.v1] }
            currency: { type: string, enum: [CNY] }
            amount_scale: { type: integer, format: int64, enum: [1000000] }
            calculated_cost_micros: { type: string, pattern: '^(0|[1-9][0-9]{0,18})$' }
            charged_cost_micros: { type: string, pattern: '^(0|[1-9][0-9]{0,18})$' }
            pricing_version: { type: string, maxLength: 80 }
        capture_gaps:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required: [source, reason]
            properties:
              source:
                type: string
                enum: [call_log, request_trace, client_ip_presence, upstream_error_presence]
              reason:
                type: string
                enum: [not_available_at_billing_terminal]
    CompletedExecutionFeedError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
    LicenseCapabilityFeatures:
      type: object
      additionalProperties: false
      required: [gateway, agent_capabilities, oidc, guardrails, notifications, model_governance, data_exchange]
      description: Effective authorization results. Guardrails, notifications, and model governance are true for every enforceable commercial License; the remaining capabilities require their signed feature item or wildcard.
      properties:
        gateway: { type: boolean }
        agent_capabilities: { type: boolean }
        oidc: { type: boolean }
        guardrails: { type: boolean }
        notifications: { type: boolean }
        model_governance: { type: boolean }
        data_exchange: { type: boolean }
    LicenseCapabilityProjection:
      type: object
      additionalProperties: false
      required: [status, enforceable, features]
      description: Non-sensitive, fail-closed feature authorization projection. It never includes the signed License, customer or deployment identity, key ID, signature, expiry metadata, or resource limits.
      properties:
        status:
          type: string
          enum: [missing, active, expiring, expired, invalid, not_yet_valid, deployment_mismatch]
        enforceable: { type: boolean }
        features: { $ref: "#/components/schemas/LicenseCapabilityFeatures" }
    CurrentUserProfile:
      type: object
      additionalProperties: false
      required: [id, username, organization_role, role, status, org_id, org_name, email, auth_provider, created_at, navigation_capabilities, license_access]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        organization_role: { $ref: "#/components/schemas/OrganizationRole" }
        role:
          allOf: [{ $ref: "#/components/schemas/CompatibilityUserRole" }]
          deprecated: true
          description: Version-2 compatibility shadow. It is not authoritative for project access; use live project membership.
        status: { type: string, enum: [active, disabled] }
        org_id: { type: integer, format: int64 }
        org_name: { type: string }
        email: { type: string }
        auth_provider: { type: string, description: "`local` for password-managed users; otherwise the configured external identity provider." }
        created_at: { type: string, format: date-time }
        navigation_capabilities: { $ref: "#/components/schemas/NavigationCapabilities" }
        license_access: { $ref: "#/components/schemas/LicenseCapabilityProjection" }
    NavigationCapabilities:
      type: object
      additionalProperties: false
      required: [has_live_project_membership, has_project_admin_membership, can_discover_access_review, can_discover_workloads]
      description: Shell-only capability projection. It enables discoverability but never replaces endpoint authorization or a live project membership check.
      properties:
        has_live_project_membership: { type: boolean }
        has_project_admin_membership: { type: boolean }
        can_discover_access_review: { type: boolean }
        can_discover_workloads: { type: boolean }
    OrganizationRole:
      type: string
      enum: [platform_admin, org_admin, billing_admin, org_viewer, member]
    CompatibilityUserRole:
      type: string
      enum: [admin, platform_admin, org_admin, billing_admin, org_viewer, member, project_admin, developer, viewer]
      description: Temporary users.role/JWT-v2 shadow. New clients must not use it as project authorization evidence.
    UserRole:
      allOf: [{ $ref: "#/components/schemas/CompatibilityUserRole" }]
      deprecated: true
    ProjectMembershipRole:
      type: string
      enum: [project_admin, project_user, project_viewer]
      description: Canonical live per-project role, independent from organization_role and users.role.
    ProjectMembershipRoleInput:
      type: string
      enum: [project_admin, project_user, project_viewer, project_developer, developer, viewer]
      description: Canonical roles plus compatibility aliases. Responses always normalize aliases to project_user/project_viewer.
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        org_id: { type: integer, format: int64, minimum: 1, description: Required for a platform administrator; organization administrators are constrained to their JWT organization. }
        username: { type: string, minLength: 1, description: Deployment-global local login ID. Outer Unicode whitespace is removed before storage and uniqueness ignores case; an unavailable ID returns a generic 409 response. }
        password:
          type: string
          minLength: 12
          description: At least 12 Unicode characters and at most 72 UTF-8 bytes. Creates a local identity under the shared backend, recovery CLI, and UI password policy; externally managed identities are provisioned through OIDC.
          x-unirouter-max-utf8-bytes: 72
        organization_role:
          allOf: [{ $ref: "#/components/schemas/OrganizationRole" }]
          default: member
        role:
          allOf: [{ $ref: "#/components/schemas/OrganizationRole" }]
          deprecated: true
          description: Compatibility input alias for organization_role only; project-role values are rejected.
        status: { type: string, enum: [active, disabled], default: active }
    UserUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one of organization_role, the deprecated organization-only role alias, or status is required.
      properties:
        organization_role: { $ref: "#/components/schemas/OrganizationRole" }
        role:
          allOf: [{ $ref: "#/components/schemas/OrganizationRole" }]
          deprecated: true
          description: Compatibility input alias for organization_role only; project-role values are rejected.
        status: { type: string, enum: [active, disabled] }
    UserMutationResponse:
      type: object
      additionalProperties: false
      properties:
        id: { type: integer, format: int64, description: Present on create. }
        success: { type: boolean, description: Present on update. }
        organization_role: { $ref: "#/components/schemas/OrganizationRole" }
        role:
          allOf: [{ $ref: "#/components/schemas/CompatibilityUserRole" }]
          deprecated: true
    ProjectMember:
      type: object
      additionalProperties: false
      required: [user_id, username, email, auth_provider, organization_role, role, user_role, status, membership_role, created_at, updated_at]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        username: { type: string }
        email: { type: string }
        auth_provider: { type: string }
        organization_role: { $ref: "#/components/schemas/OrganizationRole" }
        role: { $ref: "#/components/schemas/CompatibilityUserRole" }
        user_role: { $ref: "#/components/schemas/CompatibilityUserRole", deprecated: true }
        status: { type: string, enum: [active, disabled] }
        membership_role: { $ref: "#/components/schemas/ProjectMembershipRole" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EligibleProjectUser:
      type: object
      additionalProperties: false
      required: [user_id, username, email, organization_role, role, user_role, status]
      properties:
        user_id: { type: integer, format: int64, minimum: 1 }
        username: { type: string }
        email: { type: string }
        organization_role: { $ref: "#/components/schemas/OrganizationRole" }
        role: { $ref: "#/components/schemas/CompatibilityUserRole" }
        user_role: { $ref: "#/components/schemas/CompatibilityUserRole", deprecated: true }
        status: { type: string, enum: [active, disabled] }
    ProjectMemberListResponse:
      type: object
      additionalProperties: false
      required: [data, total, page, page_size, eligible_users, eligible_total, project_id, project_name]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ProjectMember" }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        eligible_users:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/EligibleProjectUser" }
        eligible_total: { type: integer, minimum: 0 }
        project_id: { type: integer, format: int64, minimum: 1 }
        project_name: { type: string }
    ProjectBudget:
      type: object
      additionalProperties: false
      required: [project_id, org_id, project_name, budget_cents, budget_period]
      properties:
        project_id: { type: integer, format: int64, minimum: 1 }
        org_id: { type: integer, format: int64, minimum: 1 }
        project_name: { type: string }
        status: { type: string, enum: [active, disabled, archived], description: Present on GET. }
        budget_cents: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
        budget_period: { type: string, enum: [none, daily, monthly] }
    ProjectBudgetMutation:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one of budget_cents or budget_period is required. No other project field is accepted.
      properties:
        budget_cents: { type: integer, format: int64, minimum: 0, maximum: 2147483647 }
        budget_period: { type: string, enum: [none, daily, monthly] }
    CommercialLicensePayload:
      type: object
      additionalProperties: false
      required: [license_id, customer, deployment_id, tier, issued_at, not_before, expires_at, features]
      properties:
        license_id: { type: string, minLength: 1, maxLength: 128 }
        customer: { type: string, minLength: 1, maxLength: 256 }
        deployment_id: { type: string, minLength: 1, maxLength: 128 }
        tier: { type: string, minLength: 1, maxLength: 64 }
        issued_at: { type: string, format: date-time }
        not_before: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        features:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            enum: ['*', gateway, agent_capabilities, oidc, guardrails, notifications, model_governance, data_exchange]
        limits:
          type: object
          additionalProperties: false
          description: Optional signed positive ceilings. Missing fields are unlimited by this document; zero is not a valid signed limit.
          properties:
            active_api_keys: { type: integer, format: int64, minimum: 1, description: Active logical access-credential families plus active unbound legacy API keys. }
            active_users: { type: integer, format: int64, minimum: 1, description: Active user accounts. }
            active_projects: { type: integer, format: int64, minimum: 1, description: Active projects. }
            active_channels: { type: integer, format: int64, minimum: 1, description: "Commercial field name retained for License v1 compatibility; schema M79 counts enabled canonical provider_connections, not legacy channels." }
        metadata:
          type: object
          maxProperties: 32
          additionalProperties: { type: string, maxLength: 512 }
    CommercialLicenseDocument:
      type: object
      additionalProperties: false
      required: [schema_version, key_id, payload, signature]
      properties:
        schema_version: { type: string, enum: [unirouter.license.v1] }
        key_id: { type: string, pattern: '^[A-Za-z0-9_.-]{1,64}$' }
        payload: { $ref: "#/components/schemas/CommercialLicensePayload" }
        signature: { type: string, description: Base64 Ed25519 signature; accepted on PUT but never returned by GET. }
    LicenseStatus:
      type: object
      additionalProperties: false
      required: [status, valid, enforceable, commercial, signature_valid, deployment_match, warning, days_until_expiry, checked_at, verifier_configured]
      properties:
        status: { type: string, enum: [missing, active, expiring, expired, invalid, not_yet_valid, deployment_mismatch] }
        valid: { type: boolean }
        enforceable: { type: boolean }
        commercial: { type: boolean }
        signature_valid: { type: boolean }
        deployment_match: { type: boolean }
        warning: { type: boolean }
        days_until_expiry: { type: integer }
        checked_at: { type: string, format: date-time }
        verifier_configured: { type: boolean }
        schema_version: { type: string }
        key_id: { type: string }
        expected_deployment_id: { type: string }
        license:
          description: Non-secret signed payload metadata; never the document signature. Commercial=true responses follow CommercialLicensePayload, whose active_channels field counts enabled canonical provider connections under M79. Historical non-enforceable PRD2 evidence may contain legacy keys.
          oneOf:
            - $ref: "#/components/schemas/CommercialLicensePayload"
            - type: object
              additionalProperties: true
        error: { type: string }
    CanonicalMicros:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)$'
      description: Signed canonical integer micro-CNY text. Leading plus signs and leading zeroes are invalid.
    NonnegativeCanonicalMicros:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: Nonnegative canonical integer micro-CNY text.
    PublicPriceDecimalInput:
      description: Exact CNY per 1,000,000 tokens with at most five fractional digits, bounded so the canonical micro-CNY price fits signed int64 (maximum 9223372036854.77580). Prefer the string form; the numeric form is compatibility input parsed from JSON text.
      oneOf:
        - type: string
          pattern: '^[0-9]+(?:\.[0-9]{1,5})?$'
          maxLength: 64
        - type: number
          minimum: 0
          maximum: 9223372036854.7758
          multipleOf: 0.00001
    CachePriceRatioInput:
      description: Exact provider Prompt Cache price multiplier with at most six fractional digits.
      oneOf:
        - type: string
          pattern: '^[0-9]+(?:\.[0-9]{1,6})?$'
          maxLength: 64
        - type: number
          minimum: 0
          maximum: 100
          multipleOf: 0.000001
    OrgPriceMultiplierInput:
      description: Exact organization price multiplier with at most three fractional digits.
      oneOf:
        - type: string
          pattern: '^[0-9]+(?:\.[0-9]{1,3})?$'
          maxLength: 64
        - type: number
          minimum: 0.001
          maximum: 99.999
          multipleOf: 0.001
    WalletResponse:
      type: object
      required: [id, org_id, org_name, exists, balance_micros, granted_balance_micros, frozen_micros, total_spent_micros, threshold_micros, currency, amount_scale, auto_freeze, low_balance_threshold_cents, is_admin, can_top_up, can_adjust, can_export_transactions, can_select_org, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        org_id: { type: integer, format: int64 }
        org_name: { type: string }
        exists: { type: boolean, description: False only when the organization exists but no runtime settlement-wallet row has been provisioned. }
        balance_micros: { $ref: "#/components/schemas/CanonicalMicros" }
        granted_balance_micros: { $ref: "#/components/schemas/CanonicalMicros" }
        frozen_micros: { $ref: "#/components/schemas/CanonicalMicros" }
        total_spent_micros: { $ref: "#/components/schemas/CanonicalMicros" }
        threshold_micros: { $ref: "#/components/schemas/CanonicalMicros" }
        currency: { type: string, enum: [CNY] }
        amount_scale: { type: integer, format: int64, enum: [1000000] }
        auto_freeze: { type: boolean }
        low_balance_threshold_cents: { type: integer, format: int64, minimum: 0 }
        is_admin: { type: boolean, description: Actor has a wallet-management organization role; this does not imply that a wallet exists. }
        can_top_up: { type: boolean, description: True only when the actor is authorized and the wallet exists. }
        can_adjust: { type: boolean, description: True only when the actor is authorized and the wallet exists. }
        can_export_transactions: { type: boolean, description: Read-only export authority; an unprovisioned wallet yields an empty transaction history rather than disabling this read. }
        can_select_org: { type: boolean }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
      additionalProperties: true
    WalletMutationResponse:
      type: object
      required: [org_id, balance_micros, currency, amount_scale, client_request_id, idempotent_replay]
      properties:
        org_id: { type: integer, format: int64 }
        previous_balance_micros: { $ref: "#/components/schemas/CanonicalMicros" }
        balance_micros: { $ref: "#/components/schemas/CanonicalMicros" }
        delta_micros: { $ref: "#/components/schemas/CanonicalMicros" }
        currency: { type: string, enum: [CNY] }
        amount_scale: { type: integer, format: int64, enum: [1000000] }
        client_request_id: { type: string }
        idempotent_replay: { type: boolean }
      additionalProperties: true
    ModelPrice:
      type: object
      required: [id, model_name, input_price_cny_per_million_tokens, output_price_cny_per_million_tokens, cache_read_ratio, cache_creation_ratio, currency, price_basis_tokens]
      properties:
        id: { type: integer, format: int64 }
        model_name: { type: string }
        input_price_cny_per_million_tokens: { type: string, pattern: '^(0|[1-9][0-9]{0,12})(?:\.[0-9]{1,5})?$' }
        output_price_cny_per_million_tokens: { type: string, pattern: '^(0|[1-9][0-9]{0,12})(?:\.[0-9]{1,5})?$' }
        cache_read_ratio: { type: string, pattern: '^(0|[1-9][0-9]*)(?:\.[0-9]{1,6})?$' }
        cache_creation_ratio: { type: string, pattern: '^(0|[1-9][0-9]*)(?:\.[0-9]{1,6})?$' }
        currency: { type: string, enum: [CNY] }
        price_basis_tokens: { type: integer, format: int64, enum: [1000000] }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    ExactTokenCount:
      type: integer
      format: int32
      minimum: 0
      maximum: 2147483647
      description: Exact canonical token count. Zero means unknown or not declared. K/M shorthand is a UI-only decimal-SI input convenience and is not valid JSON API input.
    ModelRegistryMutation:
      type: object
      properties:
        model_name: { type: string, minLength: 1 }
        display_name: { type: string }
        provider_family: { type: string }
