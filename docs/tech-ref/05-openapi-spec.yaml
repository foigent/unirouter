openapi: 3.0.3
info:
  title: UniRouter API
  version: 1.4.0
  description: |
    Current UniRouter API contract snapshot for active backend routes.

    Route source: `cmd/uniroute/*.go` (including extracted route registrars).
    Route parity guard: `cmd/uniroute/route_parity_test.go`.

    Authentication:
    - Gateway model calls: `Authorization: Bearer ur-XXXX-...` or a scoped `urc_...` Agent capability.
    - Async image jobs: project-bound root UniRouter API key only; Agent capabilities are rejected.
    - Agent capability exchange/revoke: root UniRouter API key only.
    - Agent capability delegate/refresh: authenticated parent/current Agent capability only.
    - Admin: `Authorization: Bearer <JWT>`
    - X-Insight completed-execution feed: project-bound `service` key with purpose `xinsight.feed.read` and an exact IP/CIDR binding. The credential is rejected by every model route.

    Request identity:
    - Response `X-Request-ID` is a server-generated operation ID and cannot be overridden by a caller.
    - Caller correlation belongs in `X-UniRouter-Client-Request-ID`; inbound `X-Request-ID` remains a legacy alias only.
    - `Idempotency-Key` enables tenant/API-key/payload-bound metadata-only deduplication for Chat, Embeddings, and async image-job admission. Image jobs return the same job identity but never replay output bytes in the admission response.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Gateway
  - name: Async Media
  - name: Agent Capability
  - name: Private Integration
  - name: Auth
  - name: Admin
  - name: Health
  - name: Observability

# OpenAPI 3.0 has no reusable Operation Object component. These YAML anchors
# keep the serialized document DRY while every path method still expands to a
# real Operation Object for standards-compliant tooling.
x-unirouter-operation-templates:
  Get: &operation_get
    tags: [Admin]
    summary: Get resource
    security:
      - bearerAuth: []
    responses:
      "200":
        $ref: "#/components/responses/JSON"
  List: &operation_list
    tags: [Admin]
    summary: List resources
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PageSize"
    responses:
      "200":
        $ref: "#/components/responses/JSON"
  ListById: &operation_list_by_id
    tags: [Admin]
    summary: List nested resources by parent ID
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PageSize"
    responses:
      "200":
        $ref: "#/components/responses/JSON"
  ListChannels: &operation_list_channels
    tags: [Admin]
    summary: List channels
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PageSize"
    responses:
      "200":
        $ref: "#/components/responses/JSON"
  Create: &operation_create
    tags: [Admin]
    summary: Create resource
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    responses:
      "200":
        $ref: "#/components/responses/JSON"
      "201":
        $ref: "#/components/responses/JSON"
  CreateChannel: &operation_create_channel
    tags: [Admin]
    summary: Create channel
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    responses:
      "201":
        $ref: "#/components/responses/JSON"
  GetById: &operation_get_by_id
    tags: [Admin]
    summary: Get resource by ID
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/Id"
    responses:
      "200":
        $ref: "#/components/responses/JSON"
  UpdateById: &operation_update_by_id
    tags: [Admin]
    summary: Update resource by ID
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/Id"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    responses:
      "200":
        $ref: "#/components/responses/JSON"
  DeleteById: &operation_delete_by_id
    tags: [Admin]
    summary: Delete resource by ID
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/Id"
    responses:
      "200":
        $ref: "#/components/responses/JSON"
      "204":
        description: Deleted

paths:
  /:
    get:
      tags: [Health]
      summary: Service metadata
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /docs:
    get:
      tags: [Admin]
      summary: Backend API documentation index
      responses:
        "200":
          description: HTML API contract index
          content:
            text/html:
              schema:
                type: string

  /health/live:
    get:
      tags: [Health]
      summary: Liveness check
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "503":
          $ref: "#/components/responses/JSON"

  /metrics:
    get:
      tags: [Observability]
      summary: Prometheus metrics (runtime-configurable)
      responses:
        "200":
          description: Prometheus metrics text format
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Metrics are disabled or hidden by metrics access policy

  /v1/chat/completions:
    post:
      tags: [Gateway]
      summary: OpenAI-compatible chat completions
      security:
        - gatewayKey: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/ClientRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ResponseCacheOptIn"
        - $ref: "#/components/parameters/PromptCompressionOptIn"
        - $ref: "#/components/parameters/RequestCacheControl"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion or SSE stream. The final `_uniroute.provider_prompt_cache` object reports only provider-authoritative Prompt Cache token classes, status/schema, and frozen pricing evidence; it is not a UniRouter response-cache signal. Unknown provider fields never receive a cache discount.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/OperationId"
            X-UniRouter-Client-Request-ID:
              $ref: "#/components/headers/ClientRequestId"
            X-UniRouter-Limit-Policy-Version:
              $ref: "#/components/headers/LimitPolicyVersion"
            X-UniRouter-Workload-Class:
              $ref: "#/components/headers/WorkloadClass"
            X-UniRouter-Response-Cache:
              $ref: "#/components/headers/ResponseCacheOutcome"
            X-UniRouter-Prompt-Compression:
              $ref: "#/components/headers/PromptCompressionOutcome"
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/embeddings:
    post:
      tags: [Gateway]
      summary: OpenAI-compatible embeddings
      security:
        - gatewayKey: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/ClientRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model:
                  type: string
                input:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                encoding_format:
                  type: string
                  enum: [float, base64]
      responses:
        "200":
          description: Embedding response. When the provider returns an authoritative Prompt Cache usage contract, `_uniroute.provider_prompt_cache` contains the normalized token partition and frozen pricing evidence; otherwise its status is `not_reported` and all prompt tokens remain ordinary input.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/OperationId"
            X-UniRouter-Client-Request-ID:
              $ref: "#/components/headers/ClientRequestId"
            X-UniRouter-Limit-Policy-Version:
              $ref: "#/components/headers/LimitPolicyVersion"
            X-UniRouter-Workload-Class:
              $ref: "#/components/headers/WorkloadClass"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/models:
    get:
      tags: [Gateway]
      summary: OpenAI-compatible model list
      security:
        - gatewayKey: []
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /v1/media/jobs:
    post:
      tags: [Async Media]
      summary: Submit one asynchronous text-to-image job
      description: |
        Creates one GPT Image V1 job in the API key's exact organization and project.
        Admission requires both the isolated media runtime and its explicit
        new-job admission control to be enabled. New work is capped at 10
        nonterminal jobs per project and 100 per organization. An exact
        idempotent replay is resolved before admission/capacity checks and can
        therefore return its existing job while new admissions are paused or
        capacity is full.
        Prompt bytes are encrypted while work is nonterminal and erased from the
        database at terminal state. This operation never debits the text-token wallet.
      security:
        - gatewayRootKey: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/ClientRequestId"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: Tenant, project, API-key and payload-bound job identity. Reuse with different request bytes returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaJobSubmitRequest"
      responses:
        "200":
          description: Existing job returned for an exact idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJobCreateResult"
        "202":
          description: New job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJobCreateResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Error"

  /v1/media/jobs/{id}:
    get:
      tags: [Async Media]
      summary: Read one image job in the API key's project
      security:
        - gatewayRootKey: []
      parameters:
        - $ref: "#/components/parameters/MediaJobId"
      responses:
        "200":
          description: Image job metadata without prompt, credentials, object locator, or output bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/media/jobs/{id}/cancel:
    post:
      tags: [Async Media]
      summary: Request cancellation without implying a refund
      security:
        - gatewayRootKey: []
      parameters:
        - $ref: "#/components/parameters/MediaJobId"
      responses:
        "200":
          description: Cancellation result; a raced terminal success is reported as too_late
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaCancellationResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/media/jobs/{id}/content:
    get:
      tags: [Async Media]
      summary: Read authenticated image bytes before fixed expiry
      description: No public or presigned object URL is returned. Reads fail with 410 at the seven-day deadline even while physical deletion is retrying.
      security:
        - gatewayRootKey: []
      parameters:
        - $ref: "#/components/parameters/MediaJobId"
      responses:
        "200":
          description: Persisted PNG, JPEG, or WebP bytes
          headers:
            Cache-Control:
              schema: { type: string, enum: ["private, no-store"] }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"

  /v1/agent-capabilities/exchange:
    post:
      tags: [Agent Capability]
      summary: Explicitly register a root Agent workflow and exchange a root API key for a five-minute capability
      security:
        - gatewayRootKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCapabilityExchangeRequest"
      responses:
        "201":
          description: Root Agent capability; response is non-cacheable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCapabilityTokenResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/agent-capabilities/delegate:
    post:
      tags: [Agent Capability]
      summary: Explicitly register one child Agent with attenuation-only authority
      security:
        - agentCapability: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCapabilityDelegateRequest"
      responses:
        "201":
          description: Child Agent capability; response is non-cacheable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCapabilityTokenResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/agent-capabilities/refresh:
    post:
      tags: [Agent Capability]
      summary: Refresh a capability near minute three without extending the independent workflow lifetime
      security:
        - agentCapability: []
      responses:
        "200":
          description: Refreshed five-minute capability; concurrent refreshes converge on one token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCapabilityTokenResponse"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/agent-capabilities/revoke:
    post:
      tags: [Agent Capability]
      summary: Revoke a registered Agent workflow for all new admissions
      security:
        - gatewayRootKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow_id]
              properties:
                workflow_id:
                  type: string
                  pattern: '^capwf_[0-9a-f]{32}$'
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/integrations/xinsight/completed-executions:
    get:
      tags: [Private Integration]
      summary: Pull immutable final completed-execution metadata
      description: |
        Private, activation-forward V1 pull feed. An omitted or empty cursor
        establishes the current project high-watermark and returns no items.
        Subsequent opaque cursors provide a retained seven-day replay window.
        A cursor ahead of the current source high-watermark fails permanently
        with 409; it is never auto-reset or treated as an idle page.
        A valid active or staged feed credential receives a strict retryable
        503 while its project connection is paused. A staged credential can
        never receive data and is denied if the connection is active.
        Pages contain at most 50 items and are always smaller than 8 MiB.
      security:
        - completedFeedKey: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
      responses:
        "200":
          description: One immutable page from a repeatable-read source snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletedExecutionFeedPage"
        "400":
          $ref: "#/components/responses/CompletedExecutionFeedError"
        "401":
          $ref: "#/components/responses/CompletedExecutionFeedError"
        "403":
          $ref: "#/components/responses/CompletedExecutionFeedError"
        "409":
          $ref: "#/components/responses/CompletedExecutionFeedError"
        "410":
          $ref: "#/components/responses/CompletedExecutionFeedError"
        "503":
          $ref: "#/components/responses/CompletedExecutionFeedError"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Admin login
      description: Password login applies only to local identities. The local login ID is deployment-global, ignores case and outer Unicode whitespace, and cannot resolve to an external identity with the same displayed username. A successful response returns the stored username rather than the submitted spelling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: Local login ID. Matching ignores case and outer Unicode whitespace.
                password:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current admin session
      description: Idempotently revokes the authenticated session. A retry with the same otherwise-valid session token returns success without creating a duplicate audit event.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/auth/oidc/config:
    get:
      tags: [Auth]
      summary: OIDC public login configuration
      description: |-
        Returns only public login capability. Provisioning resolves organization roles independently from live project membership: organization roles never imply project access; project role inputs create organization_role=member and one canonical membership in the configured default project. Legacy developer/project_developer/viewer inputs are compatibility aliases only.
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/auth/oidc/start:
    get:
      tags: [Auth]
      summary: Start OIDC login flow
      description: Starts authentication only. First-login provisioning uses the same two-axis organization-role and default-project-membership contract described by the public OIDC configuration.
      responses:
        "302":
          description: Redirects to the configured OIDC identity provider
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/auth/oidc/callback:
    get:
      tags: [Auth]
      summary: OIDC callback
      responses:
        "302":
          description: Redirects to the frontend after successful browser login
        "200":
          $ref: "#/components/responses/JSON"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/me:
    get:
      tags: [Admin]
      summary: Current admin user profile
      description: Returns the authenticated profile plus a non-sensitive, fail-closed commercial License capability projection. The projection contains no signed payload, customer identity, key ID, signature, or resource limits.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user profile and seven-feature License projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserProfile"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/me/password:
    put:
      tags: [Admin]
      summary: Change current admin user password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
                  description: At least 12 Unicode characters and at most 72 UTF-8 bytes.
                  x-unirouter-max-utf8-bytes: 72
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          description: Password is managed by an external identity provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/channels:
    get: *operation_list_channels
    post: *operation_create_channel

  /api/v1/channels/{id}:
    get: *operation_get_by_id
    put: *operation_update_by_id
    delete: *operation_delete_by_id

  /api/v1/channels/{id}/test:
    post:
      tags: [Admin]
      summary: Test channel connectivity
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/provider-packs:
    get:
      tags: [Admin]
      summary: List immutable fixture-verified Provider Conformance Packs
      description: Returns credential-free offline compatibility claims and exact manifest/schema digests. It is not live network, account, billing or production evidence.
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /api/v1/routing/preview:
    get:
      tags: [Admin]
      summary: Preview credential-free routing-policy.v1 candidates and exclusions
      security:
        - bearerAuth: []
      parameters:
        - name: model
          in: query
          required: true
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "400":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/keys:
    get: *operation_list
    post: *operation_create

  /api/v1/keys/{id}:
    x-unirouter-rbac:
      get: [platform_admin, org_admin, project_admin, project_user, project_viewer]
      put: [platform_admin, org_admin, project_admin, project_user]
    description: Project roles are resolved from the current project_members row. A project_user may update only their own personal credential; users.role compatibility shadow is never an authorization source. An absent ID and an ID outside the actor's credential-metadata or mutation scope both return the same stable 404 API key not found response; object existence and purpose are not disclosed before authorization.
    get: *operation_get_by_id
    put: *operation_update_by_id

  /api/v1/keys/{id}/disable:
    x-unirouter-rbac:
      post: [platform_admin, org_admin, project_admin, project_user]
    post:
      tags: [Admin]
      summary: Disable API key
      description: |
        project_admin and project_user here are live project-membership roles,
        not account/JWT organization roles. A project user may disable only
        their own personal credential while that exact membership remains
        callable. Organization-role accounts with an explicit membership use
        the same rule; their users.role compatibility shadow is never an
        authorization source. An absent ID and an ID outside that live scope
