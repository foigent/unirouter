openapi: 3.0.3
info:
  title: UniRouter API
  version: 1.5.0
  description: |
    Current UniRouter API contract snapshot for active backend routes.

    Route source: `cmd/uniroute/*.go` (including extracted route registrars).
    Route parity guard: `cmd/uniroute/route_parity_test.go`.

    Authentication:
    - OpenAI-family Gateway calls: `Authorization: Bearer ur-XXXX-...` or a scoped `urc_...` Agent capability. `/v1/responses` rejects Anthropic credential/version headers.
    - Anthropic Messages: exactly one `x-api-key` containing a UniRouter API key or scoped `urc_...` Agent capability, plus exactly `anthropic-version: 2023-06-01`. `Authorization` and `anthropic-beta` are rejected.
    - Async image jobs: project-bound root UniRouter API key only; Agent capabilities are rejected.
    - Agent capability exchange/revoke: root UniRouter API key only.
    - Agent capability delegate/refresh: authenticated parent/current Agent capability only.
    - Admin: `Authorization: Bearer <JWT>`
    - X-Insight completed-execution feed: project-bound `service` key with purpose `xinsight.feed.read` and an exact IP/CIDR binding. The credential is rejected by every model route.

    Request identity:
    - Response `X-Request-ID` is a server-generated operation ID and cannot be overridden by a caller.
    - Caller correlation belongs in `X-UniRouter-Client-Request-ID`; inbound `X-Request-ID` remains a legacy alias only.
    - `Idempotency-Key` enables tenant/API-key/payload-bound metadata-only deduplication for Chat, Embeddings, Responses, Messages, and async image-job admission. Model response bytes are never stored or replayed; public non-stream calls implement `unirouter.public-at-most-once.v1`.
    - Canonical model-deployment creation requires `Idempotency-Key`; its separate 24-hour actor-scoped mutation receipt stores no request body, provider secret, or response body. Exact replay returns 200 and `X-UniRouter-Idempotency-Replayed: true`; reuse with another normalized payload returns 409.
    - Canonical sealed-release authoring and lifecycle writes require `Idempotency-Key`. Authoring accepts only a public model, exact server-derived baseline, deployment/operation selections and reason, then commits its immutable receipt, server-projected evidence/events/audit and one sealed validated release in one repeatable-read transaction; it never activates traffic. A fresh author returns 201 plus `Location`; a later exact replay returns 200, the same `Location`, and replay headers.
    - Lifecycle writes commit the release pair when applicable, runtime slot, lifecycle events, qualification snapshot, immutable receipt and audit in one repeatable-read transaction. Authoring and lifecycle bodies are each one strict JSON object limited to 16384 bytes; duplicate or unknown members and trailing values are rejected before receipt access. Lifecycle exact replay returns the original 200 status and frozen receipt. Canary cancellation and legacy rollback are no-License safety contractions; authoring and every expansion require the Gateway feature.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Gateway
  - name: Async Media
  - name: Agent Capability
  - name: Private Integration
  - name: Auth
  - name: Admin
  - name: Health
  - name: Observability

# OpenAPI 3.0 has no reusable Operation Object component. These YAML anchors
# keep the serialized document DRY while every path method still expands to a
# real Operation Object for standards-compliant tooling.
x-unirouter-operation-templates:
  Get: &operation_get
    tags: [Admin]
    summary: Get resource
    security:
      - bearerAuth: []
    responses:
      "200":
        $ref: "#/components/responses/JSON"
  List: &operation_list
    tags: [Admin]
    summary: List resources
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PageSize"
    responses:
      "200":
        $ref: "#/components/responses/JSON"
  ListById: &operation_list_by_id
    tags: [Admin]
    summary: List nested resources by parent ID
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PageSize"
    responses:
      "200":
        $ref: "#/components/responses/JSON"
  ListChannels: &operation_list_channels
    tags: [Admin]
    summary: List legacy channel history for migration diagnostics
    description: Read-only compatibility projection. It is not canonical current route, readiness, Dashboard or License authority.
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PageSize"
    responses:
      "200":
        $ref: "#/components/responses/JSON"
  Create: &operation_create
    tags: [Admin]
    summary: Create resource
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    responses:
      "200":
        $ref: "#/components/responses/JSON"
      "201":
        $ref: "#/components/responses/JSON"
  CreateChannel: &operation_create_channel
    tags: [Admin]
    summary: Create channel
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    responses:
      "201":
        $ref: "#/components/responses/JSON"
  GetById: &operation_get_by_id
    tags: [Admin]
    summary: Get resource by ID
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/Id"
    responses:
      "200":
        $ref: "#/components/responses/JSON"
  UpdateById: &operation_update_by_id
    tags: [Admin]
    summary: Update resource by ID
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/Id"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    responses:
      "200":
        $ref: "#/components/responses/JSON"
  DeleteById: &operation_delete_by_id
    tags: [Admin]
    summary: Delete resource by ID
    security:
      - bearerAuth: []
    parameters:
      - $ref: "#/components/parameters/Id"
    responses:
      "200":
        $ref: "#/components/responses/JSON"
      "204":
        description: Deleted
  RetiredLegacyModelMutation: &operation_legacy_model_mutation_retired
    tags: [Admin]
    summary: Legacy model mutation is permanently retired
    description: Authenticated platform RBAC is evaluated first. Authentication and customer/RBAC context may read their own security state, but the retirement handler then fails before License admission, request-body parsing, any business-data query, secret access, probe execution, or runtime mutation. No MODEL_ROUTE_AUTHORITY or compatibility setting re-enables this operation; use the canonical model-deployment and release APIs.
    security:
      - bearerAuth: []
    responses:
      "410":
        $ref: "#/components/responses/LegacyModelMutationRetired"

paths:
  /:
    get:
      tags: [Health]
      summary: Service metadata
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /docs:
    get:
      tags: [Admin]
      summary: Backend API documentation index
      responses:
        "200":
          description: HTML API contract index
          content:
            text/html:
              schema:
                type: string

  /health/live:
    get:
      tags: [Health]
      summary: Liveness check
      responses:
        "200":
          $ref: "#/components/responses/JSON"

  /health/ready:
    get:
      tags: [Health]
      summary: Readiness check
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "503":
          $ref: "#/components/responses/JSON"

  /metrics:
    get:
      tags: [Observability]
      summary: Prometheus metrics (runtime-configurable)
      responses:
        "200":
          description: Prometheus metrics text format
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Metrics are disabled or hidden by metrics access policy

  /v1/chat/completions:
    post:
      tags: [Gateway]
      summary: OpenAI-compatible chat completions
      security:
        - gatewayKey: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/ClientRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ResponseCacheOptIn"
        - $ref: "#/components/parameters/PromptCompressionOptIn"
        - $ref: "#/components/parameters/RequestCacheControl"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion or SSE stream. The final `_uniroute.provider_prompt_cache` object reports only provider-authoritative Prompt Cache token classes, status/schema, and frozen pricing evidence; it is not a UniRouter response-cache signal. Unknown provider fields never receive a cache discount.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/OperationId"
            X-UniRouter-Client-Request-ID:
              $ref: "#/components/headers/ClientRequestId"
            X-UniRouter-Limit-Policy-Version:
              $ref: "#/components/headers/LimitPolicyVersion"
            X-UniRouter-Workload-Class:
              $ref: "#/components/headers/WorkloadClass"
            X-UniRouter-Response-Cache:
              $ref: "#/components/headers/ResponseCacheOutcome"
            X-UniRouter-Prompt-Compression:
              $ref: "#/components/headers/PromptCompressionOutcome"
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/embeddings:
    post:
      tags: [Gateway]
      summary: OpenAI-compatible embeddings
      security:
        - gatewayKey: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/ClientRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model:
                  type: string
                input:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                encoding_format:
                  type: string
                  enum: [float, base64]
      responses:
        "200":
          description: Embedding response. When the provider returns an authoritative Prompt Cache usage contract, `_uniroute.provider_prompt_cache` contains the normalized token partition and frozen pricing evidence; otherwise its status is `not_reported` and all prompt tokens remain ordinary input.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/OperationId"
            X-UniRouter-Client-Request-ID:
              $ref: "#/components/headers/ClientRequestId"
            X-UniRouter-Limit-Policy-Version:
              $ref: "#/components/headers/LimitPolicyVersion"
            X-UniRouter-Workload-Class:
              $ref: "#/components/headers/WorkloadClass"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Error"
        "402":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/responses:
    post:
      tags: [Gateway]
      summary: Strict OpenAI Responses text execution
      description: |
        Executes only an exact M77-qualified public Responses profile. V1 remains strict non-stream text. Current Sol/Terra/Luna Responses `@1.3.0` pin `unirouter.openai.responses.text.v2@1.0.0` and additionally admit exact core-text SSE when `stream=true`. The caller's public model remains the downstream identity; provider mapping is private. The retained request budget is 8 MiB and the endpoint-protocol document is limited to 2 MiB. All three current Profiles admit only `reasoning.effort=none|low|medium|high|xhigh|max`; omission preserves the provider default. Tools, state/replay, reasoning summaries or encrypted output, background work, structured or multimodal input/output, include expansions, prompt templates, and unknown root or nested members fail before provider dispatch. Exact text SSE validates event order, sequence, response identity, final usage and guarded text reconciliation; failed or incomplete streams do not settle. Response cache reads and writes are always bypassed. `Idempotency-Key` reserves metadata at most once for 24 hours and never stores or replays response bytes.
      security:
        - gatewayKey: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/ClientRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicResponsesRequest"
      responses:
        "200":
          description: Completed, guard-approved canonical Responses body with the caller's public model and exact provider-reported usage. Unknown provider fields are never delivered.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/OperationId"
            X-UniRouter-Client-Request-ID:
              $ref: "#/components/headers/ClientRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicResponsesResponse"
            text/event-stream:
              schema:
                type: string
                description: Exact Responses v2 core-text SSE; available only when the selected immutable Profile supports streaming.
        "400": { $ref: "#/components/responses/PublicOpenAIError" }
        "401": { $ref: "#/components/responses/PublicOpenAIError" }
        "403": { $ref: "#/components/responses/PublicOpenAIError" }
        "409": { $ref: "#/components/responses/PublicOpenAIIdempotencyConflict" }
        "413": { $ref: "#/components/responses/PublicOpenAIError" }
        "429": { $ref: "#/components/responses/PublicOpenAIRateLimited" }
        "500": { $ref: "#/components/responses/PublicOpenAIError" }
        "502": { $ref: "#/components/responses/PublicOpenAIError" }
        "503": { $ref: "#/components/responses/PublicOpenAIRetryableError" }

  /v1/messages:
    post:
      tags: [Gateway]
      summary: Strict Anthropic Messages non-stream text execution
      description: |
        Executes only the exact M77-qualified `unirouter.anthropic.messages.text.v1` public profile. The caller's public model remains the downstream identity; provider mapping is private. The retained request budget is 8 MiB and the endpoint-protocol document is limited to 2 MiB. Messages are exact `user` or `assistant` string-content objects with an optional string system prompt. Tools, cache controls, beta features, thinking, structured or multimodal content, streaming, and unknown root or nested members fail before provider dispatch. Response cache reads and writes are always bypassed. `Idempotency-Key` reserves metadata at most once for 24 hours and never stores or replays response bytes.
      security:
        - anthropicGatewayKey: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/ClientRequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AnthropicVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicMessagesRequest"
      responses:
        "200":
          description: Completed, guard-approved canonical Anthropic message with the caller's public model and exact provider-reported usage. Unknown provider fields are never delivered.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/OperationId"
            request-id:
              $ref: "#/components/headers/OperationId"
            X-UniRouter-Client-Request-ID:
              $ref: "#/components/headers/ClientRequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMessagesResponse"
        "400": { $ref: "#/components/responses/PublicAnthropicError" }
        "401": { $ref: "#/components/responses/PublicAnthropicError" }
        "403": { $ref: "#/components/responses/PublicAnthropicError" }
        "409": { $ref: "#/components/responses/PublicAnthropicIdempotencyConflict" }
        "413": { $ref: "#/components/responses/PublicAnthropicError" }
        "429": { $ref: "#/components/responses/PublicAnthropicRateLimited" }
        "500": { $ref: "#/components/responses/PublicAnthropicError" }
        "502": { $ref: "#/components/responses/PublicAnthropicError" }
        "503": { $ref: "#/components/responses/PublicAnthropicRetryableError" }

  /v1/models:
    get:
      tags: [Gateway]
      summary: OpenAI-compatible model list
      description: |
        Returns only models callable by the authenticated key after lifecycle,
        project model-set and model-authorization filtering. By default the
        response keeps the ordinary OpenAI-compatible list shape and does not
        incur an execution-profile lookup. `include=execution_profile` adds a
        non-secret `x_unirouter_execution` projection for client configuration
        sync. Only repository-reviewed executable capabilities receive limits;
        unregistered, unverified or invalid profile bindings are explicitly
        labeled and never inherit provider-advertised capabilities.
      security:
        - gatewayKey: []
      parameters:
        - name: include
          in: query
          required: false
          schema: { type: string, enum: [execution_profile] }
          description: Opt in to the versioned executable-profile projection used by supported client sync tools.
      responses:
        "200":
          description: Authorized model list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicModelList" }

  /v1/media/jobs:
    post:
      tags: [Async Media]
      summary: Submit one asynchronous text-to-image job
      description: |
        Creates one GPT Image V1 job in the API key's exact organization and project.
        Admission requires both the isolated media runtime and its explicit
        new-job admission control to be enabled. New work is capped at 10
        nonterminal jobs per project and 100 per organization. An exact
        idempotent replay is resolved before admission/capacity checks and can
        therefore return its existing job while new admissions are paused or
        capacity is full.
        Prompt bytes are encrypted while work is nonterminal and erased from the
        database at terminal state. This operation never debits the text-token wallet.
      security:
        - gatewayRootKey: []
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/ClientRequestId"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: Tenant, project, API-key and payload-bound job identity. Reuse with different request bytes returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaJobSubmitRequest"
      responses:
        "200":
          description: Existing job returned for an exact idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJobCreateResult"
        "202":
          description: New job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJobCreateResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Error"

  /v1/media/jobs/{id}:
    get:
      tags: [Async Media]
      summary: Read one image job in the API key's project
      security:
        - gatewayRootKey: []
      parameters:
        - $ref: "#/components/parameters/MediaJobId"
      responses:
        "200":
          description: Image job metadata without prompt, credentials, object locator, or output bytes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaJob"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/media/jobs/{id}/cancel:
    post:
      tags: [Async Media]
      summary: Request cancellation without implying a refund
      security:
        - gatewayRootKey: []
      parameters:
        - $ref: "#/components/parameters/MediaJobId"
      responses:
        "200":
          description: Cancellation result; a raced terminal success is reported as too_late
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaCancellationResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/media/jobs/{id}/content:
    get:
      tags: [Async Media]
      summary: Read authenticated image bytes before fixed expiry
      description: No public or presigned object URL is returned. Reads fail with 410 at the seven-day deadline even while physical deletion is retrying.
      security:
        - gatewayRootKey: []
      parameters:
        - $ref: "#/components/parameters/MediaJobId"
      responses:
        "200":
          description: Persisted PNG, JPEG, or WebP bytes
          headers:
            Cache-Control:
              schema: { type: string, enum: ["private, no-store"] }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"

  /v1/agent-capabilities/exchange:
    post:
      tags: [Agent Capability]
      summary: Explicitly register a root Agent workflow and exchange a root API key for a five-minute capability
      security:
        - gatewayRootKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCapabilityExchangeRequest"
      responses:
        "201":
          description: Root Agent capability; response is non-cacheable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCapabilityTokenResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/agent-capabilities/delegate:
    post:
      tags: [Agent Capability]
      summary: Explicitly register one child Agent with attenuation-only authority
      security:
        - agentCapability: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCapabilityDelegateRequest"
      responses:
        "201":
          description: Child Agent capability; response is non-cacheable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCapabilityTokenResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/agent-capabilities/refresh:
    post:
      tags: [Agent Capability]
      summary: Refresh a capability near minute three without extending the independent workflow lifetime
      security:
        - agentCapability: []
      responses:
        "200":
          description: Refreshed five-minute capability; concurrent refreshes converge on one token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCapabilityTokenResponse"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/agent-capabilities/revoke:
    post:
      tags: [Agent Capability]
      summary: Revoke a registered Agent workflow for all new admissions
      security:
        - gatewayRootKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow_id]
              properties:
                workflow_id:
                  type: string
                  pattern: '^capwf_[0-9a-f]{32}$'
      responses:
        "200":
          $ref: "#/components/responses/JSON"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/integrations/xinsight/completed-executions:
    get:
      tags: [Private Integration]
      summary: Pull immutable final completed-execution metadata
      description: |
        Private, activation-forward V1 pull feed. An omitted or empty cursor
        establishes the current project high-watermark and returns no items.
        Subsequent opaque cursors provide a retained seven-day replay window.
        A cursor ahead of the current source high-watermark fails permanently
        with 409; it is never auto-reset or treated as an idle page.
        A valid active or staged feed credential receives a strict retryable
        503 while its project connection is paused. A staged credential can
        never receive data and is denied if the connection is active.
        Pages contain at most 50 items and are always smaller than 8 MiB.
      security:
        - completedFeedKey: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
