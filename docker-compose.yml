x-unirouter-json-logging: &unirouter-json-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: "${DOCKER_LOG_MAX_FILES:-3}"

services:
  postgres:
    image: postgres:16-alpine
    container_name: uniroute-postgres
    environment:
      POSTGRES_USER: uniroute
      POSTGRES_PASSWORD: uniroute_pass_2024
      POSTGRES_DB: uniroute
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *unirouter-json-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniroute"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uniroute-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    logging: *unirouter-json-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    # Must exceed the effective application drain reported by /health/ready.
    stop_grace_period: ${UNIROUTER_STOP_GRACE_PERIOD:-35m}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME_VERSION: ${RUNTIME_VERSION:-local}
        RUNTIME_COMMIT: ${RUNTIME_COMMIT:-unknown}
        RUNTIME_TREE: ${RUNTIME_TREE:-unknown}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        # Source Compose is development-only. Customer/release images are built
        # separately with immutable embedded License and upgrade trust roots.
        UNIROUTER_RELEASE_TRUST_MODE: development
    container_name: uniroute-api
    ports:
      - "8080:8080"
    volumes:
      - ./migrations:/app/migrations:ro
    environment:
      LISTEN_PORT: 8080
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-120}
      DB_DSN: postgres://uniroute:uniroute_pass_2024@postgres:5432/uniroute?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JWT_SECRET: ${JWT_SECRET}
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      RESPONSE_CACHE_INDEX_KEY: ${RESPONSE_CACHE_INDEX_KEY:-}
      RESPONSE_CACHE_ENCRYPTION_KEY: ${RESPONSE_CACHE_ENCRYPTION_KEY:-}
      RESPONSE_CACHE_KEY_VERSION: ${RESPONSE_CACHE_KEY_VERSION:-}
      UNIROUTE_NOTIFICATION_WEBHOOK_SIGNING_SECRET: ${UNIROUTE_NOTIFICATION_WEBHOOK_SIGNING_SECRET:-}
      ADMIN_CORS_ALLOWED_ORIGINS: ${ADMIN_CORS_ALLOWED_ORIGINS:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_ALLOWED_CIDRS: ${METRICS_ALLOWED_CIDRS:-}
      TRACE_EVENTS_ENABLED: ${TRACE_EVENTS_ENABLED:-true}
      TRACE_EVENT_SAMPLE_RATE: ${TRACE_EVENT_SAMPLE_RATE:-1}
      TRACE_EVENT_RETENTION_DAYS: ${TRACE_EVENT_RETENTION_DAYS:-30}
      PAYLOAD_CAPTURE_MODE: ${PAYLOAD_CAPTURE_MODE:-metadata_only}
      UNIROUTE_OTEL_EXPORT_ENABLED: ${UNIROUTE_OTEL_EXPORT_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      UNIROUTE_OTEL_EXPORT_QUEUE_SIZE: ${UNIROUTE_OTEL_EXPORT_QUEUE_SIZE:-256}
      UNIROUTE_OTEL_EXPORT_BATCH_SIZE: ${UNIROUTE_OTEL_EXPORT_BATCH_SIZE:-32}
      UNIROUTE_OTEL_EXPORT_FLUSH_INTERVAL_MS: ${UNIROUTE_OTEL_EXPORT_FLUSH_INTERVAL_MS:-500}
      UNIROUTE_OTEL_EXPORT_TIMEOUT_MS: ${UNIROUTE_OTEL_EXPORT_TIMEOUT_MS:-2000}
      UNIROUTE_OTEL_EXPORT_MAX_RETRIES: ${UNIROUTE_OTEL_EXPORT_MAX_RETRIES:-2}
      EVIDENCE_CONTEXT_TRUST_SECRET: ${EVIDENCE_CONTEXT_TRUST_SECRET:-}
      RUNTIME_ENVIRONMENT: ${RUNTIME_ENVIRONMENT:-local}
      RUNTIME_DEPLOYMENT_MODE: ${RUNTIME_DEPLOYMENT_MODE:-docker-compose}
      RUNTIME_DEPLOYMENT_ROLE: ${RUNTIME_DEPLOYMENT_ROLE:-stable}
      MODEL_ROUTE_AUTHORITY: ${MODEL_ROUTE_AUTHORITY:-canonical}
      MODEL_ROUTE_COMPATIBILITY_ENABLED: ${MODEL_ROUTE_COMPATIBILITY_ENABLED:-false}
      RUNTIME_VERSION: ${RUNTIME_VERSION:-}
      RUNTIME_COMMIT: ${RUNTIME_COMMIT:-}
      RUNTIME_TREE: ${RUNTIME_TREE:-}
      RUNTIME_IMAGE_DIGEST: ${RUNTIME_IMAGE_DIGEST:-}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      GRAFANA_URL: ${GRAFANA_URL:-http://grafana:3000}
      COMPLETED_EXECUTION_FEED_ENABLED: ${COMPLETED_EXECUTION_FEED_ENABLED:-false}
      SOURCE_FACTS_ENABLED: ${SOURCE_FACTS_ENABLED:-false}
      SOURCE_OBSERVATIONS_ENABLED: ${SOURCE_OBSERVATIONS_ENABLED:-false}
      SOURCE_BUDGET_SNAPSHOTS_ENABLED: ${SOURCE_BUDGET_SNAPSHOTS_ENABLED:-false}
      SOURCE_CONTENT_ENABLED: ${SOURCE_CONTENT_ENABLED:-false}
      SOURCE_CONTENT_FULL_ENABLED: ${SOURCE_CONTENT_FULL_ENABLED:-false}
      SOURCE_CONTENT_STORAGE_ROOT: ${SOURCE_CONTENT_STORAGE_ROOT:-}
      SOURCE_CONTENT_STORAGE_IDENTITY: ${SOURCE_CONTENT_STORAGE_IDENTITY:-}
      SOURCE_CONTENT_STORAGE_TOKEN_FILE: ${SOURCE_CONTENT_STORAGE_TOKEN_FILE:-}
      COMPLETED_EXECUTION_FEED_SOURCE_INSTANCE: ${COMPLETED_EXECUTION_FEED_SOURCE_INSTANCE:-}
      COMPLETED_EXECUTION_FEED_REFERENCE_MODE: ${COMPLETED_EXECUTION_FEED_REFERENCE_MODE:-legacy}
      XINSIGHT_CONNECTOR_AGENT_ENABLED: ${XINSIGHT_CONNECTOR_AGENT_ENABLED:-false}
      XINSIGHT_CONNECTOR_CONTROL_ORIGIN: ${XINSIGHT_CONNECTOR_CONTROL_ORIGIN:-}
      XINSIGHT_CONNECTOR_POLL_MILLISECONDS: ${XINSIGHT_CONNECTOR_POLL_MILLISECONDS:-1000}
      XINSIGHT_CONNECTOR_REQUEST_TIMEOUT_MILLISECONDS: ${XINSIGHT_CONNECTOR_REQUEST_TIMEOUT_MILLISECONDS:-5000}
      XINSIGHT_CONNECTOR_RECEIVER_BINDINGS_JSON: '${XINSIGHT_CONNECTOR_RECEIVER_BINDINGS_JSON:-[]}'
      ASYNC_MEDIA_ENABLED: ${ASYNC_MEDIA_ENABLED:-false}
      ASYNC_MEDIA_ADMISSION_ENABLED: ${ASYNC_MEDIA_ADMISSION_ENABLED:-}
      ASYNC_MEDIA_S3_REGION: ${ASYNC_MEDIA_S3_REGION:-us-east-1}
      ASYNC_MEDIA_S3_BUCKET: ${ASYNC_MEDIA_S3_BUCKET:-}
      ASYNC_MEDIA_S3_ENDPOINT: ${ASYNC_MEDIA_S3_ENDPOINT:-}
      ASYNC_MEDIA_S3_PREFIX: ${ASYNC_MEDIA_S3_PREFIX:-unirouter-media}
      ASYNC_MEDIA_S3_FORCE_PATH_STYLE: ${ASYNC_MEDIA_S3_FORCE_PATH_STYLE:-false}
      ASYNC_MEDIA_WORKER_ID: ${ASYNC_MEDIA_WORKER_ID:-}
      ASYNC_MEDIA_LEASE_SECONDS: ${ASYNC_MEDIA_LEASE_SECONDS:-300}
      ASYNC_MEDIA_PURGE_LEASE_SECONDS: ${ASYNC_MEDIA_PURGE_LEASE_SECONDS:-60}
      ASYNC_MEDIA_POLL_MILLISECONDS: ${ASYNC_MEDIA_POLL_MILLISECONDS:-500}
      ASYNC_MEDIA_PROVIDER_TIMEOUT_SECONDS: ${ASYNC_MEDIA_PROVIDER_TIMEOUT_SECONDS:-180}
      ASYNC_MEDIA_MAX_ATTEMPTS: ${ASYNC_MEDIA_MAX_ATTEMPTS:-3}
      LOGIN_RATE_LIMIT_ENABLED: ${LOGIN_RATE_LIMIT_ENABLED:-true}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      LOGIN_RATE_LIMIT_IP_REQUESTS: ${LOGIN_RATE_LIMIT_IP_REQUESTS:-30}
      LOGIN_RATE_LIMIT_USER_REQUESTS: ${LOGIN_RATE_LIMIT_USER_REQUESTS:-10}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.250.10/32,172.30.250.11/32}
      STREAM_MAX_SSE_LINE_BYTES: ${STREAM_MAX_SSE_LINE_BYTES:-2097152}
      STREAM_WRITE_IDLE_TIMEOUT_SECONDS: ${STREAM_WRITE_IDLE_TIMEOUT_SECONDS:-30}
      STREAM_HEARTBEAT_SECONDS: ${STREAM_HEARTBEAT_SECONDS:-15}
      STREAM_MAX_DURATION_SECONDS: ${STREAM_MAX_DURATION_SECONDS:-1800}
      WORKLOAD_GLOBAL_CAPACITY: ${WORKLOAD_GLOBAL_CAPACITY:-100}
      WORKLOAD_ORG_CAPACITY: ${WORKLOAD_ORG_CAPACITY:-10}
      WORKLOAD_GLOBAL_SHORT_RESERVE: ${WORKLOAD_GLOBAL_SHORT_RESERVE:-10}
      WORKLOAD_ORG_SHORT_RESERVE: ${WORKLOAD_ORG_SHORT_RESERVE:-2}
      WORKLOAD_INTERACTIVE_WEIGHT: ${WORKLOAD_INTERACTIVE_WEIGHT:-1}
      WORKLOAD_STREAM_WEIGHT: ${WORKLOAD_STREAM_WEIGHT:-4}
      WORKLOAD_EMBEDDING_WEIGHT: ${WORKLOAD_EMBEDDING_WEIGHT:-1}
      WORKLOAD_INTERACTIVE_MAX_WAIT_MS: ${WORKLOAD_INTERACTIVE_MAX_WAIT_MS:-50}
      WORKLOAD_STREAM_MAX_WAIT_MS: ${WORKLOAD_STREAM_MAX_WAIT_MS:-250}
      WORKLOAD_EMBEDDING_MAX_WAIT_MS: ${WORKLOAD_EMBEDDING_MAX_WAIT_MS:-50}
      GUARDRAIL_ORG_ACTIVE_POLICY_LIMIT: ${GUARDRAIL_ORG_ACTIVE_POLICY_LIMIT:-256}
      GUARDRAIL_PLATFORM_ACTIVE_POLICY_LIMIT: ${GUARDRAIL_PLATFORM_ACTIVE_POLICY_LIMIT:-256}
      GUARDRAIL_CACHED_POLICY_LIMIT: ${GUARDRAIL_CACHED_POLICY_LIMIT:-4096}
      GUARDRAIL_CACHED_TENANT_LIMIT: ${GUARDRAIL_CACHED_TENANT_LIMIT:-4096}
      CHAT_REQUEST_MAX_BYTES: ${CHAT_REQUEST_MAX_BYTES:-8388608}
      EMBEDDINGS_REQUEST_MAX_BYTES: ${EMBEDDINGS_REQUEST_MAX_BYTES:-16777216}
      NONSTREAM_RESPONSE_MAX_BYTES: ${NONSTREAM_RESPONSE_MAX_BYTES:-16777216}
      PAYLOAD_NODE_INFLIGHT_BYTES: ${PAYLOAD_NODE_INFLIGHT_BYTES:-268435456}
      PAYLOAD_ORG_INFLIGHT_BYTES: ${PAYLOAD_ORG_INFLIGHT_BYTES:-67108864}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      LICENSE_PUBLIC_KEYS: ${LICENSE_PUBLIC_KEYS:-}
      LICENSE_DEPLOYMENT_ID: ${LICENSE_DEPLOYMENT_ID:-}
      LICENSE_EXPIRY_WARNING_DAYS: ${LICENSE_EXPIRY_WARNING_DAYS:-30}
      LICENSE_REFRESH_SECONDS: ${LICENSE_REFRESH_SECONDS:-30}
      UPGRADE_PUBLIC_KEYS: ${UPGRADE_PUBLIC_KEYS:-}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-OIDC}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid,email,profile}
      OIDC_ALLOWED_EMAIL_DOMAIN: ${OIDC_ALLOWED_EMAIL_DOMAIN:-}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-false}
      OIDC_DEFAULT_ORG_ID: ${OIDC_DEFAULT_ORG_ID:-}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-viewer}
      OIDC_DEFAULT_PROJECT_SLUG: ${OIDC_DEFAULT_PROJECT_SLUG:-default}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-preferred_username}
      OIDC_EMAIL_CLAIM: ${OIDC_EMAIL_CLAIM:-email}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-uniroute_role}
      OIDC_ORG_ID_CLAIM: ${OIDC_ORG_ID_CLAIM:-uniroute_org_id}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *unirouter-json-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_DEPLOY_ENV: ${VITE_DEPLOY_ENV:-}
    container_name: uniroute-frontend
    ports:
      - "3000:80"
    networks:
      default:
        ipv4_address: ${UNIROUTER_FRONTEND_PROXY_IP:-172.30.250.10}
    depends_on:
      - backend
    logging: *unirouter-json-logging

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: uniroute-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *unirouter-json-logging

  grafana:
    image: grafana/grafana:11.0.0
    container_name: uniroute-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env before starting Grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    logging: *unirouter-json-logging

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    ipam:
      config:
        - subnet: ${UNIROUTER_INTERNAL_NETWORK_CIDR:-172.30.250.0/24}
          gateway: ${UNIROUTER_INTERNAL_NETWORK_GATEWAY:-172.30.250.1}
