version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: uniroute-postgres
    environment:
      POSTGRES_USER: uniroute
      POSTGRES_PASSWORD: uniroute_pass_2024
      POSTGRES_DB: uniroute
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniroute"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uniroute-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uniroute-api
    ports:
      - "8080:8080"
    volumes:
      - ./migrations:/app/migrations:ro
    environment:
      LISTEN_PORT: 8080
      DB_DSN: postgres://uniroute:uniroute_pass_2024@postgres:5432/uniroute?sslmode=disable
      MIGRATIONS_DIR: /app/migrations
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JWT_SECRET: dev_jwt_secret_change_in_prod
      ENCRYPTION_KEY: dev_enc_key_32bytes_change_me!!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uniroute-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
