# UniRouter Canary Testing Override
# 使用方式：docker compose -f docker-compose.yml -f docker-compose.canary.yml up -d
# 前提：docker-compose.yml 中的服务必须先正常运行

x-unirouter-json-logging: &unirouter-json-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
    max-file: "${DOCKER_LOG_MAX_FILES:-3}"

services:
  # --- 外层 Nginx：TLS 终止 + canary 路由 ---
  nginx:
    image: nginx:1.30.3-alpine
    container_name: uniroute-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The default canary overlay is HTTP-only so local/staging smoke can run
      # without TLS certificates. Mount nginx/nginx.conf instead for TLS.
      - ./nginx/nginx.http-canary.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS 证书（共享 staging 环境挂载）
      # - /etc/letsencrypt/live/your-domain/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      # - /etc/letsencrypt/live/your-domain/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    depends_on:
      - backend
      - backend-canary
      - frontend
    networks:
      default:
        ipv4_address: ${UNIROUTER_CANARY_PROXY_IP:-172.30.250.11}
    restart: unless-stopped
    logging: *unirouter-json-logging

  # --- 遮蔽原有端口暴露（避免与 nginx 冲突） ---
  # 注意：docker compose override 不能直接"移除" ports，
  # 共享 staging 环境应将 docker-compose.yml 中的 ports 注释掉，
  # 或使用 profiles 机制。
  # 此处保留原端口用于直接调试，staging 部署时注释掉。
  frontend:
    # staging 环境注释掉 ports，只通过 nginx 访问
    # ports:
    #   - "3000:80"
    restart: unless-stopped
    logging: *unirouter-json-logging

  backend:
    restart: unless-stopped
    logging: *unirouter-json-logging

  # --- Canary 后端实例 ---
  backend-canary:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        RUNTIME_VERSION: ${RUNTIME_VERSION:-local}
        RUNTIME_COMMIT: ${RUNTIME_COMMIT:-unknown}
        RUNTIME_TREE: ${RUNTIME_TREE:-unknown}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        # Keep the source canary on the same explicit development trust mode as
        # stable. Customer releases never use this source-build overlay.
        UNIROUTER_RELEASE_TRUST_MODE: development
    container_name: uniroute-api-canary
    # Expose a direct debug/smoke port. Shared staging deployments may remove
    # this and route canary traffic only through the load balancer.
    ports:
      - "8081:8080"
    environment:
      LISTEN_PORT: 8080
      SHUTDOWN_TIMEOUT_SECONDS: ${SHUTDOWN_TIMEOUT_SECONDS:-120}
      DB_DSN: ${DB_DSN:-postgres://uniroute:uniroute_pass_2024@postgres:5432/uniroute?sslmode=disable}
      MIGRATIONS_DIR: ${MIGRATIONS_DIR:-/app/migrations}
      SKIP_MIGRATION: "true"
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      JWT_SECRET: ${JWT_SECRET}
      API_KEY_HASH_SECRET: ${API_KEY_HASH_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      RESPONSE_CACHE_INDEX_KEY: ${RESPONSE_CACHE_INDEX_KEY:-}
      RESPONSE_CACHE_ENCRYPTION_KEY: ${RESPONSE_CACHE_ENCRYPTION_KEY:-}
      RESPONSE_CACHE_KEY_VERSION: ${RESPONSE_CACHE_KEY_VERSION:-}
      # Both replicas read the same deployment-level HMAC secret.
      UNIROUTE_NOTIFICATION_WEBHOOK_SIGNING_SECRET: ${UNIROUTE_NOTIFICATION_WEBHOOK_SIGNING_SECRET:-}
      ADMIN_CORS_ALLOWED_ORIGINS: ${ADMIN_CORS_ALLOWED_ORIGINS:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_ALLOWED_CIDRS: ${METRICS_ALLOWED_CIDRS:-}
      TRACE_EVENTS_ENABLED: ${TRACE_EVENTS_ENABLED:-true}
      TRACE_EVENT_SAMPLE_RATE: ${TRACE_EVENT_SAMPLE_RATE:-1}
      TRACE_EVENT_RETENTION_DAYS: ${TRACE_EVENT_RETENTION_DAYS:-30}
      PAYLOAD_CAPTURE_MODE: ${PAYLOAD_CAPTURE_MODE:-metadata_only}
      EVIDENCE_CONTEXT_TRUST_SECRET: ${EVIDENCE_CONTEXT_TRUST_SECRET:-}
      RUNTIME_ENVIRONMENT: ${RUNTIME_ENVIRONMENT:-local}
      RUNTIME_DEPLOYMENT_MODE: ${RUNTIME_DEPLOYMENT_MODE:-docker-compose}
      RUNTIME_DEPLOYMENT_ROLE: canary
      MODEL_ROUTE_AUTHORITY: ${MODEL_ROUTE_AUTHORITY:-canonical}
      MODEL_ROUTE_COMPATIBILITY_ENABLED: ${MODEL_ROUTE_COMPATIBILITY_ENABLED:-false}
      RUNTIME_VERSION: ${RUNTIME_VERSION:-}
      RUNTIME_COMMIT: ${RUNTIME_COMMIT:-}
      RUNTIME_TREE: ${RUNTIME_TREE:-}
      RUNTIME_IMAGE_DIGEST: ${RUNTIME_IMAGE_DIGEST:-}
      COMPLETED_EXECUTION_FEED_ENABLED: ${COMPLETED_EXECUTION_FEED_ENABLED:-false}
      COMPLETED_EXECUTION_FEED_SOURCE_INSTANCE: ${COMPLETED_EXECUTION_FEED_SOURCE_INSTANCE:-}
      COMPLETED_EXECUTION_FEED_REFERENCE_MODE: ${COMPLETED_EXECUTION_FEED_REFERENCE_MODE:-legacy}
      # Stable is the single Connector control-plane writer. A canary may read
      # the shared database/feed state but must never poll the same installation.
      XINSIGHT_CONNECTOR_AGENT_ENABLED: "false"
      XINSIGHT_CONNECTOR_CONTROL_ORIGIN: ${XINSIGHT_CONNECTOR_CONTROL_ORIGIN:-}
      XINSIGHT_CONNECTOR_POLL_MILLISECONDS: ${XINSIGHT_CONNECTOR_POLL_MILLISECONDS:-1000}
      XINSIGHT_CONNECTOR_REQUEST_TIMEOUT_MILLISECONDS: ${XINSIGHT_CONNECTOR_REQUEST_TIMEOUT_MILLISECONDS:-5000}
      XINSIGHT_CONNECTOR_RECEIVER_BINDINGS_JSON: '${XINSIGHT_CONNECTOR_RECEIVER_BINDINGS_JSON:-[]}'
      ASYNC_MEDIA_ENABLED: ${ASYNC_MEDIA_ENABLED:-false}
      ASYNC_MEDIA_ADMISSION_ENABLED: ${ASYNC_MEDIA_ADMISSION_ENABLED:-}
      ASYNC_MEDIA_S3_REGION: ${ASYNC_MEDIA_S3_REGION:-us-east-1}
      ASYNC_MEDIA_S3_BUCKET: ${ASYNC_MEDIA_S3_BUCKET:-}
      ASYNC_MEDIA_S3_ENDPOINT: ${ASYNC_MEDIA_S3_ENDPOINT:-}
      ASYNC_MEDIA_S3_PREFIX: ${ASYNC_MEDIA_S3_PREFIX:-unirouter-media}
      ASYNC_MEDIA_S3_FORCE_PATH_STYLE: ${ASYNC_MEDIA_S3_FORCE_PATH_STYLE:-false}
      ASYNC_MEDIA_WORKER_ID: ${ASYNC_MEDIA_WORKER_ID:-}
      ASYNC_MEDIA_LEASE_SECONDS: ${ASYNC_MEDIA_LEASE_SECONDS:-300}
      ASYNC_MEDIA_PURGE_LEASE_SECONDS: ${ASYNC_MEDIA_PURGE_LEASE_SECONDS:-60}
      ASYNC_MEDIA_POLL_MILLISECONDS: ${ASYNC_MEDIA_POLL_MILLISECONDS:-500}
      ASYNC_MEDIA_PROVIDER_TIMEOUT_SECONDS: ${ASYNC_MEDIA_PROVIDER_TIMEOUT_SECONDS:-180}
      ASYNC_MEDIA_MAX_ATTEMPTS: ${ASYNC_MEDIA_MAX_ATTEMPTS:-3}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      GRAFANA_URL: ${GRAFANA_URL:-http://grafana:3000}
      LOGIN_RATE_LIMIT_ENABLED: ${LOGIN_RATE_LIMIT_ENABLED:-true}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      LOGIN_RATE_LIMIT_IP_REQUESTS: ${LOGIN_RATE_LIMIT_IP_REQUESTS:-30}
      LOGIN_RATE_LIMIT_USER_REQUESTS: ${LOGIN_RATE_LIMIT_USER_REQUESTS:-10}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.250.10/32,172.30.250.11/32}
      CHAT_REQUEST_MAX_BYTES: ${CHAT_REQUEST_MAX_BYTES:-8388608}
      EMBEDDINGS_REQUEST_MAX_BYTES: ${EMBEDDINGS_REQUEST_MAX_BYTES:-16777216}
      NONSTREAM_RESPONSE_MAX_BYTES: ${NONSTREAM_RESPONSE_MAX_BYTES:-16777216}
      PAYLOAD_NODE_INFLIGHT_BYTES: ${PAYLOAD_NODE_INFLIGHT_BYTES:-268435456}
      PAYLOAD_ORG_INFLIGHT_BYTES: ${PAYLOAD_ORG_INFLIGHT_BYTES:-67108864}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      LICENSE_PUBLIC_KEYS: ${LICENSE_PUBLIC_KEYS:-}
      LICENSE_DEPLOYMENT_ID: ${LICENSE_DEPLOYMENT_ID:-}
      LICENSE_EXPIRY_WARNING_DAYS: ${LICENSE_EXPIRY_WARNING_DAYS:-30}
      LICENSE_REFRESH_SECONDS: ${LICENSE_REFRESH_SECONDS:-30}
      UPGRADE_PUBLIC_KEYS: ${UPGRADE_PUBLIC_KEYS:-}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-OIDC}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid,email,profile}
      OIDC_ALLOWED_EMAIL_DOMAIN: ${OIDC_ALLOWED_EMAIL_DOMAIN:-}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-false}
      OIDC_DEFAULT_ORG_ID: ${OIDC_DEFAULT_ORG_ID:-}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-viewer}
      OIDC_DEFAULT_PROJECT_SLUG: ${OIDC_DEFAULT_PROJECT_SLUG:-default}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-preferred_username}
      OIDC_EMAIL_CLAIM: ${OIDC_EMAIL_CLAIM:-email}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-uniroute_role}
      OIDC_ORG_ID_CLAIM: ${OIDC_ORG_ID_CLAIM:-uniroute_org_id}
      # canary 实例独立日志级别（可选，便于排查）
      LOG_LEVEL: ${CANARY_LOG_LEVEL:-debug}
    volumes:
      - ./migrations:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *unirouter-json-logging
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
