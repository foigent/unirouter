name: Publish accepted community images (existing public packages)
run-name: Publish exact record-bound accepted community images
on:
  workflow_dispatch:
    inputs:
      stage_record_b64:
        description: Exact reviewed stage record, canonical URL-safe base64
        required: true
        type: string
      stage_record_sha256:
        description: SHA256 of the decoded exact stage record
        required: true
        type: string
      expected_workflow_commit:
        description: Exact reviewed protected-main workflow program commit
        required: true
        type: string
      admission_sha256:
        description: Existing exact authorization, budget and queue admission digest
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: ur-public-image-publication
  cancel-in-progress: false
jobs:
  publish-public:
    # GitHub draft releases require push access, including for reads.
    permissions:
      contents: write
      packages: write
    if: github.repository == 'foigent/unirouter' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && github.actor_id == '252312344'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGE_RECORD_B64: ${{ inputs.stage_record_b64 }}
      STAGE_RECORD_SHA256: ${{ inputs.stage_record_sha256 }}
      EXPECTED_WORKFLOW_COMMIT: ${{ inputs.expected_workflow_commit }}
      ADMISSION_SHA256: ${{ inputs.admission_sha256 }}
    steps:
      - name: Check out exact reviewed publisher program
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate exact publisher stage before token or downloads
        run: python3 -I -B .github/tests/community-stage-record.py validate --stage publisher --dispatch
      - name: Upload exact accepted image bytes to existing public packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B .github/tests/community-image-publisher.py --execute-approved-public-stage
