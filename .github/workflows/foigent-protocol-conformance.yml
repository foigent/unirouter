name: Foigent Protocol Conformance

on:
  pull_request:
    branches: [main]
    paths:
      - contracts/foigent/event-connector-protocol.pin.json
      - contracts/foigent/connector-registry.pin.v1.json
      - contracts/completed-execution/v1/**
      - internal/eventconnector/**
      - internal/eventconnectorshadow/**
      - internal/completedfeed/reference_bridge.go
      - internal/completedfeed/reference_bridge_test.go
      - go.mod
      - go.sum
      - .github/workflows/foigent-protocol-conformance.yml
  push:
    branches: [main]
    paths:
      - contracts/foigent/event-connector-protocol.pin.json
      - contracts/foigent/connector-registry.pin.v1.json
      - contracts/completed-execution/v1/**
      - internal/eventconnector/**
      - internal/eventconnectorshadow/**
      - internal/completedfeed/reference_bridge.go
      - internal/completedfeed/reference_bridge_test.go
      - go.mod
      - go.sum
      - .github/workflows/foigent-protocol-conformance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-pin:
    name: UniRouter Protocol Pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout UniRouter
        uses: actions/checkout@v4

      - name: Verify Foigent protocol release and UniRouter pin
        uses: foigent/event-connector-spec@c09bc93cc7750e2333752655d6b4e69802e6769d
        with:
          pin: contracts/foigent/event-connector-protocol.pin.json
          product: unirouter

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache: false

      - name: Verify Source bridge and neutral Connector conformance
        run: >-
          go test ./internal/eventconnector/... ./internal/eventconnectorshadow ./internal/completedfeed
          -run '^(TestReferenceEnvelope|TestPhase2B)'
          -count=1
