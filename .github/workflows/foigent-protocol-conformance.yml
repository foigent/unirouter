name: Foigent Protocol Conformance

on:
  pull_request:
    branches: [main]
    paths:
      - contracts/foigent/event-connector-protocol.pin.json
      - contracts/foigent/connector-registry.pin.v1.json
      - contracts/completed-execution/v1/**
      - internal/eventconnector/**
      - internal/eventconnectorshadow/**
      - internal/provenancepassport/**
      - internal/completedfeed/reference_bridge.go
      - internal/completedfeed/reference_bridge_test.go
      - internal/completedfeed/reference_runtime.go
      - internal/completedfeed/reference_runtime_test.go
      - internal/completedfeed/handler.go
      - internal/completedfeed/handler_test.go
      - internal/completedfeed/service.go
      - internal/completedfeed/metrics.go
      - internal/config/config.go
      - internal/config/config_test.go
      - cmd/uniroute/main.go
      - cmd/uniroute/frontend_nginx_contract_test.go
      - docker-compose.yml
      - docker-compose.canary.yml
      - deploy/customer/docker-compose.yml
      - .env.example
      - deploy/customer/.env.example
      - go.mod
      - go.sum
      - .github/workflows/foigent-protocol-conformance.yml
  push:
    branches: [main]
    paths:
      - contracts/foigent/event-connector-protocol.pin.json
      - contracts/foigent/connector-registry.pin.v1.json
      - contracts/completed-execution/v1/**
      - internal/eventconnector/**
      - internal/eventconnectorshadow/**
      - internal/provenancepassport/**
      - internal/completedfeed/reference_bridge.go
      - internal/completedfeed/reference_bridge_test.go
      - internal/completedfeed/reference_runtime.go
      - internal/completedfeed/reference_runtime_test.go
      - internal/completedfeed/handler.go
      - internal/completedfeed/handler_test.go
      - internal/completedfeed/service.go
      - internal/completedfeed/metrics.go
      - internal/config/config.go
      - internal/config/config_test.go
      - cmd/uniroute/main.go
      - cmd/uniroute/frontend_nginx_contract_test.go
      - docker-compose.yml
      - docker-compose.canary.yml
      - deploy/customer/docker-compose.yml
      - .env.example
      - deploy/customer/.env.example
      - go.mod
      - go.sum
      - .github/workflows/foigent-protocol-conformance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-pin:
    name: UniRouter Protocol Pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout UniRouter
        uses: actions/checkout@v7

      - name: Run pinned cross-language Conformance kit and verify UniRouter pin
        uses: foigent/event-connector-spec/actions/source-neutral-v2@e01527350ab38d02c2bfdefe090ff72d6e48e749
        with:
          pin: contracts/foigent/event-connector-protocol.pin.json
          product: unirouter

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.12'
          cache: false

      - name: Verify Source bridge and neutral Connector conformance
        run: >-
          go test ./internal/eventconnector/... ./internal/eventconnectorshadow ./internal/completedfeed ./internal/config ./cmd/uniroute
          -run '^(TestReferenceEnvelope|TestReferenceRuntime|TestReferenceProjection|TestHandlerReference|TestHandlerCanary|TestPhase2B|TestPhase2C|TestLoadCompletedExecutionFeedReferenceMode|TestSourceComposeBackendsShareCompletedExecutionFeedEnvironment|TestCompletedExecutionFeedReferenceModesStayAligned)'
          -count=1

      - name: Verify product protocol evidence remains runtime-neutral
        run: go test ./internal/provenancepassport -count=1
