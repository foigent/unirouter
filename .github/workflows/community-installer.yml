name: Community Installer Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/community-installer.yml
      - .github/tests/community-installer.py
      - .github/tests/test-community-installer.py
      - .github/tests/community-install-descriptor.py
      - .github/tests/test-community-install-descriptor.py
      - .github/tests/community-release-acceptance.py
      - deploy/customer/**
      - deploy/community/**
      - scripts/test-community-bootstrap.py
      - cmd/uniroute/fresh_install_cli.go
      - cmd/uniroute/cli.go
      - cmd/uniroute/first_customer_upgrade_history_integration_test.go
      - cmd/uniroute/upgrade_cli.go
      - cmd/uniroute/community_maintenance_cli.go
      - internal/schemaauthority/**
      - internal/runtimegeneration/**
      - migrations/**
      - scripts/source-budget-restore-rebase.sql
      - cmd/uniroute-upgrade/**
      - internal/installstate/**
      - internal/migrate/fresh_install.go
      - internal/admin/first_customer_bootstrap_handlers.go
      - internal/admin/auth_handlers.go
      - internal/admin/audit_handlers.go
      - Dockerfile
      - frontend/Dockerfile
      - frontend/nginx.conf
      - infra/prometheus/**
      - infra/grafana/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  linux-install:
    name: Linux Installer (synthetic release)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 500 && 36 || 45 }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.25.12'
          cache: false

      - name: Set up supported Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Check native fixture against shipped bootstrap offline
        run: |
          python3 -I -B .github/tests/test-community-install-descriptor.py
          python3 -I -B .github/tests/test-community-installer.py

      - name: Test real signed installation and recovery
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git cat-file -e d92abe0a5bd4b997893ba6043a213d1a98108883^{commit}
          sudo env PATH="$PATH" GITHUB_ACTIONS=true \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_TEMP="$RUNNER_TEMP" \
            python3 -B .github/tests/community-installer.py \
            --expected-commit "$EXPECTED_COMMIT" \
            --report "$RUNNER_TEMP/ur-community-native-report.json"

      - name: Freeze complete acceptance report within the ZIP budget
        id: report_snapshot
        if: always()
        run: python3 -I -B .github/tests/action-artifact-snapshot.py installer "$RUNNER_TEMP/ur-community-native-report.json"

      - name: Retain only allowlisted acceptance facts
        if: ${{ always() && steps.report_snapshot.outcome == 'success' && steps.report_snapshot.outputs.path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: community-installer-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ steps.report_snapshot.outputs.path }}
          if-no-files-found: error
          retention-days: 7
