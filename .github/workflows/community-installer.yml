name: Community Installer Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/community-installer.yml
      - .github/tests/community-installer.py
      - .github/tests/test-community-installer.py
      - .github/tests/community-install-descriptor.py
      - .github/tests/test-community-install-descriptor.py
      - .github/tests/community-release-acceptance.py
      - deploy/customer/**
      - deploy/community/**
      - scripts/test-community-bootstrap.py
      - cmd/uniroute/fresh_install_cli.go
      - cmd/uniroute/upgrade_cli.go
      - cmd/uniroute-upgrade/**
      - internal/installstate/**
      - internal/migrate/fresh_install.go
      - Dockerfile
      - frontend/Dockerfile
      - frontend/nginx.conf
      - infra/prometheus/**
      - infra/grafana/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  linux-install:
    name: Linux Installer (synthetic release)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.12'
          cache: false

      - name: Set up supported Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Check native fixture against shipped bootstrap offline
        run: |
          python3 -I -B .github/tests/test-community-install-descriptor.py
          python3 -I -B .github/tests/test-community-installer.py

      - name: Test real signed installation and recovery
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          sudo env PATH="$PATH" GITHUB_ACTIONS=true \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_TEMP="$RUNNER_TEMP" \
            python3 -B .github/tests/community-installer.py \
            --expected-commit "$EXPECTED_COMMIT" \
            --report "$RUNNER_TEMP/ur-community-native-report.json"

      - name: Check acceptance report size
        id: report_size
        if: always()
        shell: bash
        run: |
          python3 -I -B - <<'PYBOUND'
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'ur-community-native-report.json'
          if path.is_symlink() or (path.exists() and (not path.is_file() or path.stat().st_size > 1024 * 1024)):
              raise SystemExit('Retain the complete allowlisted report, at most 1 MiB; never truncate it.')
          PYBOUND

      - name: Retain only allowlisted acceptance facts
        if: ${{ always() && steps.report_size.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: community-installer-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/ur-community-native-report.json
          if-no-files-found: warn
          retention-days: 7
