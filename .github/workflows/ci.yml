name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Change Routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      docker: ${{ steps.classify.outputs.docker }}
      delivery_preflight_failed: ${{ steps.delivery_python.outcome == 'failure' || steps.delivery_preflight.outcome == 'failure' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          backend=false
          frontend=false
          docker=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            backend=true
            frontend=true
            docker=true
          else
            if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Unable to resolve pull-request base/head commits" >&2
              exit 1
            fi

            # Fail closed if either commit cannot be resolved before routing.
            # Keep both sides of cross-surface renames visible to the router.
            # Otherwise a Go file renamed into docs/ is reported only by its
            # new docs path and can incorrectly skip the backend gate.
            git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" >/dev/null
            while IFS= read -r -d '' file; do
              printf 'changed=%q\n' "$file"
              case "$file" in
                docs/tech-ref/05-openapi-spec.yaml)
                  # This contract is consumed by backend route-parity tests.
                  backend=true
                  ;;
                capability-bundles/*.json)
                  # Data delivery still receives Backend contract validation;
                  # it does not produce a new backend/frontend image.
                  backend=true
                  ;;
                docs/*|*.md|LICENSE*|.github/ISSUE_TEMPLATE/*|.github/PULL_REQUEST_TEMPLATE*)
                  ;;
                .dockerignore|Dockerfile|frontend/.dockerignore)
                  docker=true
                  ;;
                frontend/*)
                  frontend=true
                  docker=true
                  ;;
                deploy/customer/*)
                  docker=true
                  ;;
                *.go|go.mod|go.sum|migrations/*|cmd/*|internal/*)
                  backend=true
                  docker=true
                  ;;
                *)
                  # Unknown paths fail safe by exercising the complete build.
                  backend=true
                  frontend=true
                  docker=true
                  ;;
              esac
            done < <(git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA")
          fi

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "docker=$docker"
          } >> "$GITHUB_OUTPUT"

      - name: Test release metadata policy
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-release-metadata.py

      - name: Validate product version and release notes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-release-metadata.sh

      - name: Set up delivery preflight Python
        id: delivery_python
        if: steps.classify.outputs.docker == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Check delivery compatibility before expensive jobs
        id: delivery_preflight
        if: steps.classify.outputs.docker == 'true'
        run: |
          python3 -B scripts/test-internal-target-rollout.py
          python3 -B scripts/test-runtime-ingress.py
          python3 -B scripts/test-internal-target-build-images.py
          python3 -B scripts/internal-target-rollout.py environment-check

  backend:
    name: Backend Tests
    needs: changes
    if: >-
      always() && needs.changes.outputs.delivery_preflight_failed != 'true' &&
      (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-backend
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uniroute
          POSTGRES_PASSWORD: uniroute
          POSTGRES_DB: uniroute_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uniroute"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    env:
      TEST_DATABASE_URL: postgres://uniroute:uniroute@localhost:5432/uniroute_test?sslmode=disable
      DB_DSN: postgres://uniroute:uniroute@localhost:5432/uniroute_test?sslmode=disable
      REDIS_ADDR: localhost:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JWT_SECRET: test_jwt_secret_32bytes_long!!
      ENCRYPTION_KEY: test_enc_key_32bytes_long!!!!
      MIGRATIONS_DIR: ./migrations
      GOTOOLCHAIN: local
    
    steps:
      - name: Validate change routing
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Mint read-only Neutral N1 installation token
        id: integration-control-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.INTEGRATION_CONTROL_APP_ID }}
          private-key: ${{ secrets.INTEGRATION_CONTROL_APP_PRIVATE_KEY }}
          owner: foigent
          repositories: integration-control
          permission-contents: read

      - name: Checkout exact Neutral D1 qualifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: foigent/integration-control
          ref: db10730d64a9302887ad59c53921e98c757927e7
          token: ${{ steps.integration-control-token.outputs.token }}
          persist-credentials: false
          path: .integration-control-n1-d1

      - name: Qualify and materialize exact Neutral N1 release
        env:
          GH_TOKEN: ${{ steps.integration-control-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          readonly repository="foigent/integration-control"
          readonly qualifier_commit="db10730d64a9302887ad59c53921e98c757927e7"
          readonly qualifier_tree="1d91cdecc5ea6c587b6bd03706f0f873657c12e3"
          readonly qualifier_root="$GITHUB_WORKSPACE/.integration-control-n1-d1"
          readonly asset_dir="$RUNNER_TEMP/integration-control-n1-assets"
          readonly consumer_dir="$RUNNER_TEMP/integration-control-n1-consumer"
          readonly release_metadata="$RUNNER_TEMP/integration-control-n1-release.json"

          fail() {
            echo "Neutral N1 orchestration failed: $*" >&2
            exit 1
          }

          [[ -n "$GH_TOKEN" ]] || fail "read-only installation token is unavailable"
          [[ "$(git -C "$qualifier_root" rev-parse HEAD)" == "$qualifier_commit" ]] || fail "qualifier commit drift"
          [[ "$(git -C "$qualifier_root" rev-parse HEAD^{tree})" == "$qualifier_tree" ]] || fail "qualifier tree drift"
          # The exact Neutral-owned library is the authority for release assets,
          # hashes, archive layout and the qualifier's verification semantics.
          . "$qualifier_root/scripts/n1-distribution-lib.sh"

          [[ ! -e "$asset_dir" && ! -L "$asset_dir" ]] || fail "asset directory already exists"
          [[ ! -e "$consumer_dir" && ! -L "$consumer_dir" ]] || fail "consumer directory already exists"
          [[ ! -e "$release_metadata" && ! -L "$release_metadata" ]] || fail "release metadata path already exists"
          mkdir "$asset_dir"

          tag_identity="$(gh api "repos/$repository/git/ref/tags/$N1_TAG" --jq '[.object.type,.object.sha] | join(" ")')"
          [[ "$tag_identity" == "commit $N1_RELEASE_COMMIT" ]] || fail "release tag target drift"
          gh api "repos/$repository/releases/tags/$N1_TAG" >"$release_metadata"
          jq -e --arg tag "$N1_TAG" --arg release "$N1_RELEASE_COMMIT" \
            '.tag_name == $tag and .target_commitish == $release and .draft == false and .prerelease == false' \
            "$release_metadata" >/dev/null || fail "release coordinate drift"
          gh release download "$N1_TAG" --repo "$repository" --dir "$asset_dir"
          "$qualifier_root/scripts/qualify-n1-release.sh" "$asset_dir" "$consumer_dir"

          readonly n1_root="$consumer_dir/source/$N1_ARCHIVE_ROOT"
          [[ "$(uname -s):$(uname -m)" == "Linux:x86_64" ]] || fail "backend runner platform drift"
          [[ -d "$n1_root" && ! -L "$n1_root" ]] || fail "qualified source root is unavailable"
          mkdir -p "$n1_root/dist" "$n1_root/releases/$N1_VERSION"
          install -m 0500 "$consumer_dir/bin/foigent-integration-control" "$n1_root/dist/$N1_LINUX_ASSET"
          install -m 0400 "$asset_dir/$N1_MANIFEST_ASSET" "$n1_root/releases/$N1_VERSION/$N1_MANIFEST_ASSET"
          install -m 0400 "$asset_dir/$N1_SUMS_ASSET" "$n1_root/releases/$N1_VERSION/$N1_SUMS_ASSET"
          echo "UNIROUTE_INTEGRATION_CONTROL_N1_ROOT=$n1_root" >>"$GITHUB_ENV"
          echo "Neutral N1 qualified by exact D1 commit $qualifier_commit"
          echo "Neutral N1 release manifest SHA-256: $N1_MANIFEST_SHA256"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.12'
          cache: false

      - name: Restore shared Go cache
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: unirouter-go-v1-${{ runner.os }}-${{ runner.arch }}-go1.25.12-${{ hashFiles('go.sum') }}
          restore-keys: |
            unirouter-go-v1-${{ runner.os }}-${{ runner.arch }}-go1.25.12-
      
      - name: Download dependencies
        run: go mod download
      
      - name: Run go vet
        run: go vet ./...

      - name: Check independent source page and consumer fixtures
        run: |
          python3 -m pip --isolated --disable-pip-version-check install \
            --only-binary=:all: --require-hashes --index-url https://pypi.org/simple \
            --target "$RUNNER_TEMP/source-schema-validator" \
            -r contracts/source-facts/v1/requirements-schema.txt
          PYTHONPATH="$RUNNER_TEMP/source-schema-validator" PYTHONDONTWRITEBYTECODE=1 \
            python3 contracts/source-facts/v1/check_schema.py
          PYTHONDONTWRITEBYTECODE=1 python3 contracts/source-facts/v1/check_pages.py

      - name: Check runtime ingress failure recovery
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-runtime-ingress.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-internal-target-rollout.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-runtime-generation-retire.py
          python3 -B scripts/test-go-test-summary.py
          python3 -B scripts/test-backend-integration-runner.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-capability-carrier.py

      - name: Validate tracked capability Bundle sources
        run: |
          set -euo pipefail
          go build -o /tmp/unirouter-bundle-check ./cmd/uniroute-capability-bundle-check
          while IFS= read -r -d '' file; do
            /tmp/unirouter-bundle-check < "$file"
          done < <(git ls-files -z -- 'capability-bundles/*.json')
      
      - name: Run tests
        # Includes the untagged 000039 tenant-isolation migration regression.
        run: go test -v -race -coverprofile=coverage.out -timeout=20m ./...

      - name: Run exact Neutral N1 conformance tests
        run: >-
          go test -race ./internal/sourceevidence
          -run '^(TestPinnedN1ExactReleaseAndWholeCompatibility|TestProductCompatibleConformanceFixturesCloseNeutralAndPackageChain)$'
          -count=1

      - name: Run Source-evidence PostgreSQL 16 integration tests
        env:
          REQUIRE_TEST_DATABASE: "1"
        run: go test -tags=integration -race ./internal/sourceevidence -count=1 -timeout=20m

      - name: Run X-Insight snapshot producer contract tests
        run: go test scripts/prd5_xinsight_snapshot.go scripts/prd5_xinsight_snapshot_test.go -count=1

      - name: Run admin integration tests
        env:
          REQUIRE_TEST_DATABASE: "1"
        # Integration test names are enforced by TestAdminIntegrationFilesUseIntegrationSuffix.
        # This lane includes TestCanonicalDeploymentLifecycleHTTPApplicationIntegration.
        # Avoid rerunning the ordinary admin unit suite already covered above.
        run: go test -tags=integration -race ./internal/admin -run 'Integration$' -count=1 -timeout=20m

      - name: Run consolidated backend integration and feature gates
        env:
          REQUIRE_TEST_DATABASE: "1"
        # Keep the accepted named integration selectors, but start each selected
        # package only once. The ordinary unit/race suite above already covers
        # admin and other untagged feature tests.
        run: bash scripts/test-backend-integration.sh
      
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

      - name: Save shared Go cache from trusted main dispatch
        if: >-
          success() &&
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          steps.go-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: unirouter-go-v1-${{ runner.os }}-${{ runner.arch }}-go1.25.12-${{ hashFiles('go.sum') }}

  frontend:
    name: Frontend Build
    needs: changes
    if: >-
      always() && needs.changes.outputs.delivery_preflight_failed != 'true' &&
      (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-frontend
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Validate change routing
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run type-check

      - name: Frontend tests
        run: npm test -- --run

      - name: Build frontend runtime image
        run: docker build --build-arg VITE_DEPLOY_ENV=development -t unirouter-frontend:test .

      - name: Validate frontend Nginx configuration
        # The runtime hostname is supplied by Compose service discovery. The
        # standalone syntax check still needs a resolvable placeholder, but it
        # never connects to the address while evaluating `nginx -t`.
        run: docker run --rm --add-host backend:127.0.0.1 --entrypoint nginx unirouter-frontend:test -t

  pr4-browser:
    name: PR4 Browser E2E
    needs: changes
    if: >-
      always() && needs.changes.outputs.delivery_preflight_failed != 'true' &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-pr4-browser
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uniroute
          POSTGRES_PASSWORD: uniroute
          POSTGRES_DB: uniroute_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uniroute"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://uniroute:uniroute@localhost:5432/uniroute_test?sslmode=disable
      REDIS_ADDR: localhost:6379
      REDIS_PASSWORD: ""
      REQUIRE_TEST_DATABASE: "1"
      GOTOOLCHAIN: local

    steps:
      - name: Validate change routing
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.12'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Download Go dependencies
        run: go mod download

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build exact-head frontend
        working-directory: frontend
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run real-backend browser acceptances
        run: >-
          go test -tags=integration,pr4browser ./cmd/uniroute
          -run '^(TestPR4AccessUXModelReadinessBrowserE2E|TestModelEndpointOnboardingBrowserE2E|TestSourceBudgetManagementBrowserE2E)$'
          -count=1 -timeout=20m -v

  docker:
    name: Docker Build
    if: >-
      always() && needs.changes.outputs.delivery_preflight_failed != 'true' &&
      (needs.changes.result != 'success' ||
       needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.docker == 'true')
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend, pr4-browser]
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-docker
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    
    steps:
      - name: Validate routed prerequisites
        if: >-
          needs.changes.result != 'success' ||
          (needs.changes.outputs.backend == 'true' && needs.backend.result != 'success') ||
          (needs.changes.outputs.frontend == 'true' && needs.frontend.result != 'success') ||
          ((needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') &&
           needs.pr4-browser.result != 'success')
        run: exit 1

      - name: Checkout code
        if: needs.changes.outputs.docker == 'true'
        uses: actions/checkout@v7

      - name: Build backend image and verify Docker contexts
        if: needs.changes.outputs.docker == 'true'
        shell: bash
        run: |
          set -euo pipefail

          test ! -e .env.production
          test ! -e frontend/.env
          test ! -e frontend/.env.local
          test ! -e frontend/docker-context-regression.pem
          test ! -e frontend/src/docker-context-regression.pem
          test ! -e frontend/src/docker-context-regression.key
          test ! -e frontend/docker-context-regression.private
          test ! -e frontend/src/docker-context-regression.private
          test ! -e frontend/secrets
          test ! -e release-signing-regression.private
          git check-ignore -q release-signing-regression.private
          git check-ignore -q frontend/docker-context-regression.private
          git check-ignore -q frontend/src/docker-context-regression.private

          compose_config="$(
            GRAFANA_ADMIN_PASSWORD=ci-compose-validation \
            JWT_SECRET=ci-compose-validation \
            ENCRYPTION_KEY=ci-compose-validation \
            UNIROUTE_NOTIFICATION_WEBHOOK_SIGNING_SECRET=0123456789abcdef0123456789abcdef \
            VITE_DEPLOY_ENV=development \
            docker compose config
          )"
          grep -F 'VITE_DEPLOY_ENV: development' <<< "$compose_config"
          grep -F 'UNIROUTER_RELEASE_TRUST_MODE: development' <<< "$compose_config"
          grep -F 'ARG VITE_DEPLOY_ENV=' frontend/Dockerfile
          grep -F 'ENV VITE_DEPLOY_ENV=${VITE_DEPLOY_ENV}' frontend/Dockerfile
          grep -F 'ARG VITE_APP_VERSION=' frontend/Dockerfile
          grep -F 'ENV VITE_APP_VERSION=${VITE_APP_VERSION}' frontend/Dockerfile

          canary_compose="$(
            GRAFANA_ADMIN_PASSWORD=ci-compose-validation \
            JWT_SECRET=ci-compose-validation \
            ENCRYPTION_KEY=ci-compose-validation \
            UNIROUTE_NOTIFICATION_WEBHOOK_SIGNING_SECRET=0123456789abcdef0123456789abcdef \
            VITE_DEPLOY_ENV=development \
            docker compose -f docker-compose.yml -f docker-compose.canary.yml config
          )"
          test "$(grep -Fc 'UNIROUTER_RELEASE_TRUST_MODE: development' <<< "$canary_compose")" -eq 2
          test "$(grep -Fc 'UNIROUTE_NOTIFICATION_WEBHOOK_SIGNING_SECRET: 0123456789abcdef0123456789abcdef' <<< "$canary_compose")" -eq 2

          export UNIROUTER_BACKEND_IMAGE=unirouter/backend@sha256:5555555555555555555555555555555555555555555555555555555555555555
          export UNIROUTER_FRONTEND_IMAGE=unirouter/frontend@sha256:6666666666666666666666666666666666666666666666666666666666666666
          export POSTGRES_IMAGE=postgres@sha256:1111111111111111111111111111111111111111111111111111111111111111
          export REDIS_IMAGE=redis@sha256:2222222222222222222222222222222222222222222222222222222222222222
          export PROMETHEUS_IMAGE=prom/prometheus@sha256:3333333333333333333333333333333333333333333333333333333333333333
          export GRAFANA_IMAGE=grafana/grafana@sha256:4444444444444444444444444444444444444444444444444444444444444444
          export POSTGRES_PASSWORD=ci-compose-validation
          export DB_DSN='postgres://uniroute:ci-compose-validation@postgres:5432/uniroute?sslmode=disable'
          export REDIS_PASSWORD=ci-compose-validation
          export JWT_SECRET=ci-jwt-secret-0123456789abcdef0123456789abcdef
          export API_KEY_HASH_SECRET=ci-api-key-hash-0123456789abcdef0123456789abcdef
          export ENCRYPTION_KEY=0123456789abcdef0123456789abcdef
          export UNIROUTE_NOTIFICATION_WEBHOOK_SIGNING_SECRET=0123456789abcdef0123456789abcdef
          export GRAFANA_ADMIN_PASSWORD=ci-compose-validation
          export LICENSE_DEPLOYMENT_ID=ci-deployment
          export UNIROUTER_LISTEN_ADDRESS=127.0.0.1
          export UNIROUTER_INTERNAL_NETWORK_CIDR=172.30.250.0/24
          export UNIROUTER_INTERNAL_NETWORK_GATEWAY=172.30.250.1
          export UNIROUTER_FRONTEND_PROXY_IP=172.30.250.10
          export TRUSTED_PROXY_CIDRS=172.30.250.10/32,172.30.250.1/32

          for lifecycle_script in \
            scripts/internal-target-build-images.sh \
            scripts/docker-image-retention-report.sh \
            scripts/docker-image-retention-maintenance.sh \
            scripts/docker-storage-preflight.sh \
            scripts/release-retention-common.sh \
            scripts/release-worktree-retention-report.sh \
            scripts/release-worktree-retention-maintenance.sh \
            scripts/test-release-worktree-retention.sh \
            scripts/test-docker-image-retention-report.sh; do
            bash -n "${lifecycle_script}"
          done
          scripts/internal-target-build-images.sh --help >/dev/null
          scripts/docker-image-retention-report.sh --help >/dev/null
          scripts/docker-image-retention-maintenance.sh --help >/dev/null
          scripts/docker-storage-preflight.sh --help >/dev/null
          scripts/release-worktree-retention-report.sh --help >/dev/null
          scripts/release-worktree-retention-maintenance.sh --help >/dev/null
          scripts/test-release-worktree-retention.sh
          scripts/test-docker-image-retention-report.sh
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/test-internal-target-build-images.py
          grep -F 'location = /favicon.ico' frontend/nginx.conf
          grep -F 'return 204;' frontend/nginx.conf
          internal_target_compose="$(docker compose \
            -f docker-compose.yml \
            -f docker-compose.canary.yml \
            -f deploy/internal-target-images.override.yml config)"
          test "$(grep -Fc 'image: unirouter/backend@sha256:5555555555555555555555555555555555555555555555555555555555555555' <<< "$internal_target_compose")" -eq 2
          test "$(grep -Fc 'image: unirouter/frontend@sha256:6666666666666666666666666666666666666666666666666666666666666666' <<< "$internal_target_compose")" -eq 1
          if grep -Fq 'build:' <<< "$internal_target_compose"; then
            echo 'internal Target image overlay must remove every source build context' >&2
            exit 1
          fi
          internal_target_compose_json="$(docker compose \
            -f docker-compose.yml \
            -f docker-compose.canary.yml \
            -f deploy/internal-target-images.override.yml config --format json)"
          test "$(jq '[.services[] | select(
            .logging.driver == "json-file" and
            .logging.options["max-size"] == "20m" and
            .logging.options["max-file"] == "3"
          )] | length' <<< "$internal_target_compose_json")" -eq 8
          test "$(jq '[.services["backend-canary"].ports[]? | select(
            .host_ip == "127.0.0.1" and
            (.published | tostring) == "8081" and
            (.target | tostring) == "8080"
          )] | length' <<< "$internal_target_compose_json")" -eq 1
          test "$(jq '[.services.backend, .services["backend-canary"]] | all(
            .environment.MODEL_ROUTE_AUTHORITY == "canonical" and
            .environment.MODEL_ROUTE_COMPATIBILITY_ENABLED == "false"
          )' <<< "$internal_target_compose_json")" = true

          customer_compose="$(docker compose -f deploy/customer/docker-compose.yml config)"
          customer_compose_json="$(docker compose -f deploy/customer/docker-compose.yml config --format json)"
          test "$(jq '[.services[] | select(
            .logging.driver == "json-file" and
            .logging.options["max-size"] == "20m" and
            .logging.options["max-file"] == "3"
          )] | length' <<< "$customer_compose_json")" -eq 6
          grep -F 'image: unirouter/backend@sha256:5555555555555555555555555555555555555555555555555555555555555555' <<< "$customer_compose"
          grep -F 'image: unirouter/frontend@sha256:6666666666666666666666666666666666666666666666666666666666666666' <<< "$customer_compose"
          grep -F 'image: postgres@sha256:1111111111111111111111111111111111111111111111111111111111111111' <<< "$customer_compose"
          grep -F 'image: redis@sha256:2222222222222222222222222222222222222222222222222222222222222222' <<< "$customer_compose"
          grep -F 'image: prom/prometheus@sha256:3333333333333333333333333333333333333333333333333333333333333333' <<< "$customer_compose"
          grep -F 'image: grafana/grafana@sha256:4444444444444444444444444444444444444444444444444444444444444444' <<< "$customer_compose"
          grep -F 'ipv4_address: 172.30.250.10' <<< "$customer_compose"
          grep -F 'TRUSTED_PROXY_CIDRS: 172.30.250.10/32,172.30.250.1/32' <<< "$customer_compose"
          grep -F 'MODEL_ROUTE_AUTHORITY: canonical' <<< "$customer_compose"
          grep -F 'MODEL_ROUTE_COMPATIBILITY_ENABLED: "false"' <<< "$customer_compose"
          grep -Fx 'MODEL_ROUTE_AUTHORITY=legacy' deploy/customer/.env.example
          grep -Fx 'MODEL_ROUTE_COMPATIBILITY_ENABLED=true' deploy/customer/.env.example
          if grep -Fq 'build:' <<< "$customer_compose"; then
            echo 'customer Compose must not contain build contexts' >&2
            exit 1
          fi
          deploy/customer/preflight.sh /dev/null
          SOURCE_FACTS_ENABLED=true SOURCE_OBSERVATIONS_ENABLED=true SOURCE_BUDGET_SNAPSHOTS_ENABLED=true \
            COMPLETED_EXECUTION_FEED_SOURCE_INSTANCE=synthetic-customer-preflight deploy/customer/preflight.sh /dev/null
          if SOURCE_FACTS_ENABLED=false SOURCE_BUDGET_SNAPSHOTS_ENABLED=true deploy/customer/preflight.sh /dev/null; then
            echo 'budget snapshots must require source facts' >&2
            exit 1
          fi
          if SOURCE_BUDGET_SNAPSHOTS_ENABLED=yes deploy/customer/preflight.sh /dev/null; then
            echo 'budget snapshots must reject a non-exact boolean' >&2
            exit 1
          fi
          for invalid_runtime_environment in local dev test; do
            if RUNTIME_ENVIRONMENT="${invalid_runtime_environment}" deploy/customer/preflight.sh /dev/null; then
              echo "formal customer preflight must reject RUNTIME_ENVIRONMENT=${invalid_runtime_environment}" >&2
              exit 1
            fi
          done
          RESPONSE_CACHE_INDEX_KEY=iiiiiiiiiiiiiiiiiiiiiiiiiiiiiiii \
          RESPONSE_CACHE_ENCRYPTION_KEY=eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee \
          RESPONSE_CACHE_KEY_VERSION=cache-key-v1 \
            deploy/customer/preflight.sh /dev/null
          if RESPONSE_CACHE_INDEX_KEY=iiiiiiiiiiiiiiiiiiiiiiiiiiiiiiii deploy/customer/preflight.sh /dev/null; then
            echo 'customer preflight must reject a partial response-cache key binding' >&2
            exit 1
          fi
          if RESPONSE_CACHE_INDEX_KEY=iiiiiiiiiiiiiiiiiiiiiiiiiiiiiiii \
             RESPONSE_CACHE_ENCRYPTION_KEY=short \
             RESPONSE_CACHE_KEY_VERSION=cache-key-v1 \
             deploy/customer/preflight.sh /dev/null; then
            echo 'customer preflight must reject an invalid response-cache encryption key' >&2
            exit 1
          fi
          if DOCKER_LOG_MAX_SIZE=unbounded deploy/customer/preflight.sh /dev/null; then
            echo 'customer preflight must reject an invalid Docker log size' >&2
            exit 1
          fi
          if DOCKER_LOG_MAX_FILES=0 deploy/customer/preflight.sh /dev/null; then
            echo 'customer preflight must reject an invalid Docker log file count' >&2
            exit 1
          fi
          if MODEL_ROUTE_AUTHORITY=auto deploy/customer/preflight.sh /dev/null; then
            echo 'customer preflight must reject an unknown model route authority' >&2
            exit 1
          fi
          if MODEL_ROUTE_AUTHORITY=verify deploy/customer/preflight.sh /dev/null; then
            echo 'verify authority must require the explicit compatibility switch' >&2
            exit 1
          fi
          verify_route_authority_preflight="$(MODEL_ROUTE_AUTHORITY=verify MODEL_ROUTE_COMPATIBILITY_ENABLED=true deploy/customer/preflight.sh /dev/null 2>&1)"
          grep -F 'backend database startup gate (this config preflight is not readiness)' <<< "$verify_route_authority_preflight"
          if MODEL_ROUTE_AUTHORITY=legacy deploy/customer/preflight.sh /dev/null; then
            echo 'legacy authority must require the explicit compatibility switch' >&2
            exit 1
          fi
          fresh_bootstrap_route_authority_preflight="$(MODEL_ROUTE_AUTHORITY=legacy MODEL_ROUTE_COMPATIBILITY_ENABLED=true deploy/customer/preflight.sh /dev/null 2>&1)"
          grep -F 'full legacy runtime, not a bootstrap-only listener' <<< "$fresh_bootstrap_route_authority_preflight"
          if MODEL_ROUTE_COMPATIBILITY_ENABLED=yes deploy/customer/preflight.sh /dev/null; then
            echo 'customer preflight must reject a non-exact compatibility boolean' >&2
            exit 1
          fi
          if MODEL_ROUTE_AUTHORITY=canonical MODEL_ROUTE_COMPATIBILITY_ENABLED=true deploy/customer/preflight.sh /dev/null; then
            echo 'canonical authority must reject the legacy compatibility runtime' >&2
            exit 1
          fi
          if MODEL_ROUTE_AUTHORITY=canonical ASYNC_MEDIA_ENABLED=true deploy/customer/preflight.sh /dev/null; then
            echo 'canonical authority must reject legacy async-media routing' >&2
            exit 1
          fi
          canonical_route_authority_preflight="$(MODEL_ROUTE_AUTHORITY=canonical MODEL_ROUTE_COMPATIBILITY_ENABLED=false ASYNC_MEDIA_ENABLED=false deploy/customer/preflight.sh /dev/null 2>&1)"
          grep -F 'backend database startup gate (this config preflight is not readiness)' <<< "$canonical_route_authority_preflight"
          if JWT_SECRET=short deploy/customer/preflight.sh /dev/null; then
            echo 'customer preflight must reject a short JWT secret' >&2
            exit 1
          fi
          if API_KEY_HASH_SECRET=short deploy/customer/preflight.sh /dev/null; then
            echo 'customer preflight must reject a short API-key hash secret' >&2
            exit 1
          fi
          if UNIROUTE_NOTIFICATION_WEBHOOK_SIGNING_SECRET=short deploy/customer/preflight.sh /dev/null; then
            echo 'customer preflight must reject a short notification Webhook signing secret' >&2
            exit 1
          fi
          if ENCRYPTION_KEY=short deploy/customer/preflight.sh /dev/null; then
            echo 'customer preflight must reject an invalid AES-256 encryption key' >&2
            exit 1
          fi
          if JWT_SECRET=REPLACE_WITH_32_BYTE_RANDOM_VALUE deploy/customer/preflight.sh /dev/null; then
            echo 'customer preflight must reject an unreplaced secret placeholder' >&2
            exit 1
          fi
          if DB_DSN='postgres://uniroute:REPLACE_WITH_URL_ENCODED_PASSWORD@postgres:5432/uniroute?sslmode=disable' deploy/customer/preflight.sh /dev/null; then
            echo 'customer preflight must reject an embedded configuration placeholder' >&2
            exit 1
          fi
          if TRUSTED_PROXY_CIDRS=172.30.250.1/32 deploy/customer/preflight.sh /dev/null; then
            echo 'customer preflight must require the fixed frontend proxy /32' >&2
            exit 1
          fi
          if UNIROUTER_FRONTEND_PROXY_IP=172.30.251.10 TRUSTED_PROXY_CIDRS=172.30.251.10/32 deploy/customer/preflight.sh /dev/null; then
            echo 'customer preflight must reject a frontend proxy IP outside the internal subnet' >&2
            exit 1
          fi
          if UNIROUTER_LISTEN_ADDRESS=0.0.0.0 deploy/customer/preflight.sh /dev/null; then
            echo 'customer preflight must keep the formal frontend bind behind loopback TLS ingress' >&2
            exit 1
          fi
          if UNIROUTER_BACKEND_IMAGE=unirouter/backend:latest deploy/customer/preflight.sh /dev/null; then
            echo 'customer preflight must reject a mutable image tag' >&2
            exit 1
          fi

          printf 'docker-context-regression-marker\n' > .env.production
          printf 'docker-context-regression-marker\n' > frontend/.env
          printf 'docker-context-regression-marker\n' > frontend/.env.local
          printf 'docker-context-regression-marker\n' > frontend/docker-context-regression.pem
          printf 'docker-context-regression-marker\n' > frontend/src/docker-context-regression.pem
          printf 'docker-context-regression-marker\n' > frontend/src/docker-context-regression.key
          printf 'docker-context-regression-marker\n' > frontend/docker-context-regression.private
          printf 'docker-context-regression-marker\n' > frontend/src/docker-context-regression.private
          printf 'docker-context-regression-marker\n' > release-signing-regression.private
          mkdir frontend/secrets
          printf 'docker-context-regression-marker\n' > frontend/secrets/docker-context-regression.txt

          if docker build \
            --build-arg UNIROUTER_RELEASE_TRUST_MODE=release \
            --build-arg UNIROUTER_LICENSE_TRUST_BUNDLE_B64=eyJsaWNlbnNlLWNpIjoiM2JvVTZyMWtOMXhNY1VtMmh0cFk4ZE0zR3A2ZVE2ZHFiVnZjT1hKWm5qTT0ifQ \
            --build-arg UNIROUTER_UPGRADE_TRUST_BUNDLE_B64=eyJ1cGdyYWRlLWNpIjoiaTlRLzlSVm5YNjlqZDhNbWJzWVdCa1RIOHRIWk9rdng2c3l4cTJvNjFlMD0ifQ \
            -t unirouter-missing-release-identity:test .; then
            echo 'release image build must reject missing immutable version/commit metadata' >&2
            exit 1
          fi

          if docker build \
            --build-arg RUNTIME_VERSION=1.0.0-ci \
            --build-arg RUNTIME_COMMIT=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --build-arg RUNTIME_TREE=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --build-arg UNIROUTER_RELEASE_TRUST_MODE=release \
            --build-arg UNIROUTER_LICENSE_TRUST_BUNDLE_B64=eyJsaWNlbnNlLWNpIjoiM2JvVTZyMWtOMXhNY1VtMmh0cFk4ZE0zR3A2ZVE2ZHFiVnZjT1hKWm5qTT0ifQ \
            --build-arg 'UNIROUTER_UPGRADE_TRUST_BUNDLE_B64=invalid -X injected=value' \
            -t unirouter-unsafe-release-argument:test .; then
            echo 'release image build must reject linker-argument injection through trust metadata' >&2
            exit 1
          fi

          docker build \
            --build-arg RUNTIME_VERSION=1.0.0-ci \
            --build-arg RUNTIME_COMMIT=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --build-arg RUNTIME_TREE=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --build-arg UNIROUTER_RELEASE_TRUST_MODE=release \
            --build-arg UNIROUTER_LICENSE_TRUST_BUNDLE_B64=eyJsaWNlbnNlLWNpIjoiM2JvVTZyMWtOMXhNY1VtMmh0cFk4ZE0zR3A2ZVE2ZHFiVnZjT1hKWm5qTT0ifQ \
            --build-arg UNIROUTER_UPGRADE_TRUST_BUNDLE_B64=eyJ1cGdyYWRlLWNpIjoiaTlRLzlSVm5YNjlqZDhNbWJzWVdCa1RIOHRIWk9rdng2c3l4cTJvNjFlMD0ifQ \
            -t unirouter:test .

          if release_smoke="$(
            docker run --rm \
              -e JWT_SECRET=ci-jwt-secret-0123456789abcdef0123456789abcdef \
              -e API_KEY_HASH_SECRET=ci-api-key-hash-0123456789abcdef0123456789abcdef \
              -e ENCRYPTION_KEY=0123456789abcdef0123456789abcdef \
              -e UNIROUTE_NOTIFICATION_WEBHOOK_SIGNING_SECRET=0123456789abcdef0123456789abcdef \
              --entrypoint ./uniroute unirouter:test admin 2>&1
          )"; then
            echo 'release image smoke command must stop at the intentional admin usage error' >&2
            exit 1
          fi
          grep -F 'Release trust mode: release license_keys=1 upgrade_keys=1' <<< "$release_smoke"
          grep -F 'usage: uniroute admin <create|set-password>' <<< "$release_smoke"

          docker build -t unirouter-frontend-context:test -f - frontend <<'DOCKERFILE'
          FROM alpine:3.23
          WORKDIR /app
          COPY . .
          RUN test -e /app/package.json \
              && test ! -e /app/.env \
              && test ! -e /app/.env.local \
              && test ! -e /app/docker-context-regression.pem \
              && test ! -e /app/src/docker-context-regression.pem \
              && test ! -e /app/src/docker-context-regression.key \
              && test ! -e /app/docker-context-regression.private \
              && test ! -e /app/src/docker-context-regression.private \
              && test ! -d /app/secrets
          DOCKERFILE
      
      - name: Verify image
        run: docker images unirouter:test

      - name: Set up Target-compatible Python
        if: needs.changes.outputs.docker == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Verify bounded Artifact control owner
        if: needs.changes.outputs.docker == 'true'
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 10)'
          python3 -B scripts/test-internal-target-rollout.py
          python3 -B scripts/test-runtime-ingress.py
          python3 -B scripts/test-artifact-owner-docker.py --image unirouter:test
