name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uniroute
          POSTGRES_PASSWORD: uniroute
          POSTGRES_DB: uniroute_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uniroute"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    env:
      TEST_DATABASE_URL: postgres://uniroute:uniroute@localhost:5432/uniroute_test?sslmode=disable
      DB_DSN: postgres://uniroute:uniroute@localhost:5432/uniroute_test?sslmode=disable
      REDIS_ADDR: localhost:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      JWT_SECRET: test_jwt_secret_32bytes_long!!
      ENCRYPTION_KEY: test_enc_key_32bytes_long!!!!
      MIGRATIONS_DIR: ./migrations
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      
      - name: Download dependencies
        run: go mod download
      
      - name: Run go vet
        run: go vet ./...
      
      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Run admin integration tests
        env:
          REQUIRE_TEST_DATABASE: "1"
        run: go test -tags=integration -race ./internal/admin -count=1

      - name: Run routing policy integration tests
        env:
          REQUIRE_TEST_DATABASE: "1"
        run: go test -tags=integration -race ./internal/gateway -run 'Test(RoutingPolicyPostgresStateTransitions|P6F08RoutingPolicyV1)' -count=1

      - name: Run budget alert contract integration tests
        env:
          REQUIRE_TEST_DATABASE: "1"
        run: go test -tags=integration -race ./internal/billing -run TestEventService_CheckProjectBudgetTenantScope_Integration -count=1

      - name: Run multiplier freeze integration tests
        env:
          REQUIRE_TEST_DATABASE: "1"
        run: go test -race ./internal/billing -run TestP6F06 -count=1

      - name: Run stream transport safety tests
        run: go test -race ./internal/gateway ./internal/middleware -run 'Test(P6StreamTransport|SSEStreamWriter|MetricsMiddleware_ResponseController)' -count=1

      - name: Run Agent capability authority and runtime integration tests
        env:
          REQUIRE_TEST_DATABASE: "1"
        run: go test -tags=integration -race ./internal/agentcap -count=1

      - name: Run distributed limit-policy integration tests
        env:
          REQUIRE_TEST_DATABASE: "1"
        run: go test -tags=integration -race ./internal/limitpolicy -count=1

      - name: Run weighted workload admission integration tests
        run: go test -tags=integration -race ./internal/workloadadmission -run TestP6F21 -count=1

      - name: Run distributed limit-policy migration rollback tests
        env:
          REQUIRE_TEST_DATABASE: "1"
        run: go test -tags=integration -race ./internal/migrate -run TestP6F07DistributedLimitPolicyMigrationUpDownGuardAndRollForward -count=1

      - name: Run routing-policy migration rollback tests
        env:
          REQUIRE_TEST_DATABASE: "1"
        run: go test -tags=integration -race ./internal/migrate -run TestP6F08RoutingPolicyV1MigrationUpDownGuardAndRollForward -count=1

      - name: Run prompt-cache billing integration tests
        env:
          REQUIRE_TEST_DATABASE: "1"
        run: go test -race ./internal/billing -run TestP6F09 -count=1

      - name: Run prompt-cache billing migration rollback tests
        env:
          REQUIRE_TEST_DATABASE: "1"
        run: go test -tags=integration -race ./internal/migrate -run TestP6F09PromptCacheBillingMigrationUpDownGuardAndRollForward -count=1

      - name: Run durable internal outbox and terminal recovery tests
        env:
          REQUIRE_TEST_DATABASE: "1"
        run: go test -race ./internal/outbox ./internal/billing ./internal/gateway ./internal/admin ./internal/terminalhook ./internal/capbilling ./internal/policybilling ./internal/limitpolicy ./internal/workloadadmission -run TestP6F20 -count=1

      - name: Run durable internal outbox migration rollback tests
        env:
          REQUIRE_TEST_DATABASE: "1"
        run: go test -tags=integration -race ./internal/migrate -run TestP6F20DurableOutboxMigrationUpDownGuardAndRollForward -count=1
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run type-check

      - name: Frontend tests
        run: npm test -- --run

      - name: Build
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t unirouter:test .
      
      - name: Verify image
        run: docker images unirouter:test
